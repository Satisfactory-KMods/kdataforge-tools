$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/eventrule.schema.yml
x-kdf-type: eventrule
title: KDataForge event rules
allOf:
  - $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/documentBase
  - type: object
    required: [rules]
    properties:
      type: { const: eventrule }
      rules:
        type: array
        minItems: 1
        maxItems: 256
        items:
          type: object
          additionalProperties: false
          required: [id, event, actions]
          properties:
            id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$' }
            event: { enum: [worldReady, schematicPurchased] }
            schematic: { type: string, minLength: 1, pattern: '\S' }
            once: { type: boolean, default: true }
            requiresSchematics:
              type: array
              maxItems: 64
              items: { type: string, minLength: 1, pattern: '\S' }
            actions:
              type: array
              minItems: 1
              maxItems: 32
              items:
                type: object
                additionalProperties: false
                properties:
                  unlockSchematic: { type: string, minLength: 1, pattern: '\S' }
                  log: { type: string, minLength: 1, maxLength: 2048, pattern: '\S' }
                oneOf:
                  - required: [unlockSchematic]
                  - required: [log]
          if:
            properties:
              event: { const: worldReady }
          then:
            not:
              required: [schematic]
unevaluatedProperties: false
