$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/curve.schema.yml
x-kdf-type: curve
title: KDataForge curves
allOf:
  - $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/documentBase
  - type: object
    required: [curveType, curves]
    properties:
      type: { const: curve }
      curveType: { enum: [float, vector] }
      curves:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [keys]
          properties:
            id:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/token
            target:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/nonEmptyString
            defaultValue:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/numberOrVector
            preInfinityExtrap:
              enum: [none, constant, linear, cycle, cycleWithOffset, oscillate]
            postInfinityExtrap:
              enum: [none, constant, linear, cycle, cycleWithOffset, oscillate]
            isEventCurve: { type: boolean }
            keys:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [time, value]
                properties:
                  time:
                    $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/numericScalar
                  value:
                    $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/numberOrVector
                  interpMode: { enum: [constant, linear, cubic] }
                  tangentMode: { enum: [auto, smartAuto, user, break] }
                  tangentWeightMode: { enum: [none, arrive, leave, both] }
                  arriveTangent:
                    $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/numberOrVector
                  leaveTangent:
                    $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/numberOrVector
                  arriveTangentWeight:
                    $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/numberOrVector
                  leaveTangentWeight:
                    $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/numberOrVector
          oneOf:
            - required: [id]
              not: { required: [target] }
            - required: [target]
              not: { required: [id] }
unevaluatedProperties: false
