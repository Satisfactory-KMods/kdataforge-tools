$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/asset.schema.yml
x-kdf-type: asset
title: KDataForge image assets
allOf:
  - $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/documentBase
  - type: object
    required: [assets]
    properties:
      type: { const: asset }
      assets:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [id, file]
          properties:
            id:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/token
            file:
              type: string
              minLength: 1
              pattern: '\.(?:[Pp][Nn][Gg]|[Jj][Pp][Ee]?[Gg]|[Tt][Gg][Aa]|[Bb][Mm][Pp])$'
            properties:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/properties
unevaluatedProperties: false
