# KDataForge field documentation catalog.
#
# Hover texts for every key, value and template prefix of a KDataForge document. Embedded into
# kdf-validation (src/field_docs.rs) and checked by tests/field_docs.rs against the bundled
# schemas under schemas/. Edit the texts here; the Rust side has no copy.
#
# SECTIONS
#   common    keys every document kind shares (documentBase and the conditions block)
#   defs      shared structures, reached through `uses`
#   kinds     one table per document kind: the `type` values plus `pack` (pack.yml) and `config`
#   values    single values, grouped by the YAML key they belong to (op, type, ...)
#   prefixes  typed-reference prefixes (`cfg:`) and template providers (`{item:`)
#
# PATH KEYS
#   `.` separates map keys. `[]` marks "any list element" and is cosmetic: lookups receive the
#   key path with list indexes already removed, so `patches[].properties[].op` is looked up as
#   ["patches", "properties", "op"]. `*` matches any single map key (localization entry keys,
#   redirects, modVersion mod refs).
#
# SHARED STRUCTURES (`defs`)
#   An entry may carry `uses: <def>` (or a list of defs). The documentation of everything below
#   that path then comes from `defs.<def>`, whose keys are relative to the used structure. The
#   path `patches[].properties[].op` therefore resolves in two steps for every kind that
#   attaches the operation list to its `properties`:
#     kinds.cdo."patches[].properties"  ->  uses: operation  ->  defs.operation.op
#   A def may itself use further defs (a `where` filter uses `whereClause`, an operation list
#   inside a generated entry uses `operation`). An exact entry of the kind always wins over a
#   def entry, which is how a kind overrides one key (the default `parent` of each generated
#   type) without repeating the others.
#
# RESOLUTION ORDER of field(kind, path)
#   1. kinds.<kind>: exact path, then the longest prefix with `uses`
#   2. element conditions: `conditions` / `conditionBehavior` / `conditionBehaivor` on any list
#      entry below the document root (defs.listEntry, then common.conditions.*)
#   3. common: exact path, then `uses`
#   `mam` is an alias of `research`.
#
# ENTRY FIELDS
#   summary      one line (required)
#   description  one to four sentences
#   type         short type label ("string | list", "class path", "bool", "operation list")
#   required     true, or text that names the condition ("yes, unless ...")
#   default      value used when the key is omitted
#   examples     [{title, yaml, partial}] valid YAML; `partial: true` marks a fragment (or a
#                document the validator of this build cannot judge) that is only parsed as YAML
#   docs         page below https://docs.k-mods.com/kdataforge/ (short form `features/targeting`)
#   uses         shared structure(s) that describe the keys below this path
#   values       value group (section `values`) that documents the values of this key
version: 1

common:
  "$schema":
    summary: "Optional reference to the JSON Schema of the document."
    description: >-
      Lets an editor pick the schema that describes the document. The document grammar
      accepts the key; it does not change what the document does.
    type: "string"
    examples:
      - title: Schema reference in a document
        yaml: |
          $schema: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/cdo.schema.yml
          type: cdo
          patches:
            - target: Desc_Water
              properties:
                - path: mResourceSinkPoints
                  value: 0
    docs: "reference/yaml-schema"

  type:
    summary: "Root type of the document, which selects the handler that applies it."
    description: >-
      Names what the document does: `cdo` patches existing content, `item` or `recipe` generate
      new content, and so on. When `type` is missing, the type comes from the file name
      `<name>.<type>.yml` (`iron.recipe.yml` is a recipe), which only works for files that hold
      a single document. Unknown types warn once and the document is skipped.
    type: "document type"
    required: "yes, unless the file is named <name>.<type>.yml"
    values: type
    examples:
      - title: Type of a patch document
        yaml: |
          type: cdo
          patches:
            - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
              properties:
                - path: mManufactoringDuration
                  op: multiply
                  value: 0.5
      - title: Two documents in one file, each with its own type
        yaml: |
          type: item
          items:
            - id: MySuperIngot
          ---
          type: sinkpoints
          entries:
            - item: MySuperIngot
              points: 100
    docs: "reference/yaml-schema"

  debug:
    summary: "Logs every operation this document applies."
    description: >-
      With `debug: true` each applied operation of the document is written to the game log as
      `[KDF DEBUG] <file>: <target>.<path> <op> : <old value> -> <new value>`. Use it to see
      what a document really changed.
    type: "bool"
    default: false
    examples:
      - title: Trace one document
        yaml: |
          type: cdo
          debug: true
          patches:
            - target: Desc_Water
              properties:
                - path: mResourceSinkPoints
                  value: 0
    docs: "reference/yaml-schema"

  conditionBehaivor:
    summary: "How several condition objects combine, original spelling of `conditionBehavior`."
    description: >-
      Both spellings are accepted and mean the same. `AND` (the default) requires every
      condition object to pass, `OR` requires at least one. The value is case-insensitive; an
      invalid value fails closed, even when another `OR` object matches.
    type: "AND | OR"
    default: AND
    values: conditionBehavior
    examples:
      - title: Apply when RefinedPower or FicsitFarming is loaded
        yaml: |
          type: cdo
          conditionBehaivor: OR
          conditions:
            - hasMod: RefinedPower
            - hasMod: FicsitFarming
          patches:
            - target: Desc_Water
              properties:
                - path: mResourceSinkPoints
                  value: 0
    docs: "features/conditions-and-packs"

  conditionBehavior:
    summary: "How several condition objects combine."
    description: >-
      Correctly spelled alias of `conditionBehaivor`. `AND` (the default) requires every
      condition object to pass, `OR` requires at least one. With an empty condition list `AND`
      passes and `OR` does not.
    type: "AND | OR"
    default: AND
    values: conditionBehavior
    examples:
      - title: Either mod enables the document
        yaml: |
          type: cdo
          conditionBehavior: OR
          conditions:
            - hasMod: KAPI
            - hasMod: KLib
          patches:
            - target: Desc_Water
              properties:
                - path: mResourceSinkPoints
                  value: 0
    docs: "features/conditions-and-packs"

  conditions:
    summary: "Applies the document only when the environment matches."
    description: >-
      One condition object or a list of them. Keys inside an object are combined with AND,
      `ifNotMatch: true` negates the object, and `conditionBehavior` combines the objects of a
      list. A failing result skips the document and reports an Info diagnostic.
    type: "condition object | list"
    examples:
      - title: Only with KAPI loaded
        yaml: |
          type: cdo
          conditions:
            hasMod: KAPI
          patches:
            - target: Desc_Water
              properties:
                - path: mResourceSinkPoints
                  value: 0
      - title: Require KAPI and exclude an incompatible mod
        yaml: |
          type: cdo
          conditions:
            - hasMod: KAPI
            - hasMod: IncompatibleMod
              ifNotMatch: true
          patches:
            - target: Desc_Water
              properties:
                - path: mResourceSinkPoints
                  value: 0
    docs: "features/conditions-and-packs"

  conditions.gameVersion:
    summary: "Semver range the game version has to satisfy."
    description: >-
      The game version is reported as `<changelist>.0.0` (SML convention), so `>=491125.0.0`
      gates on the build changelist. Ranges use SML's semver syntax: `>=1.2.3`, `^3.12.0`,
      `~1.2.0`, an exact version, and unions with `||`.
    type: "semver range"
    examples:
      - title: Game build 491125 or newer
        yaml: |
          type: cdo
          conditions:
            gameVersion: '>=491125.0.0'
          patches:
            - target: Desc_Water
              properties:
                - path: mResourceSinkPoints
                  value: 0
    docs: "features/conditions-and-packs"

  conditions.hasMod:
    summary: "Mod references that all have to be loaded."
    description: >-
      A single mod reference or a list; every listed mod must be loaded. `Ref@<range>` pins a
      version, for example `RefinedPower@>=4.0.0`. Combine with `ifNotMatch: true` to require
      that a mod is absent (or outside the range).
    type: "mod ref | list"
    examples:
      - title: Several mods, one with a version
        yaml: |
          type: cdo
          conditions:
            hasMod:
              - KAPI
              - RefinedPower@>=4.0.0
          patches:
            - target: Desc_Water
              properties:
                - path: mResourceSinkPoints
                  value: 0
    docs: "features/conditions-and-packs"

  conditions.modVersion:
    summary: "Version constraints per mod, as a map of mod reference to semver range."
    description: >-
      The explicit form of a versioned `hasMod`. Each key is a mod reference and each value an
      SML semver range. With `ifNotMatch: true` the object rejects the listed ranges.
    type: "map of mod ref to range"
    examples:
      - title: SML 3.12 or newer
        yaml: |
          type: cdo
          conditions:
            modVersion:
              SML: '>=3.12.0'
          patches:
            - target: Desc_Water
              properties:
                - path: mResourceSinkPoints
                  value: 0
    docs: "features/conditions-and-packs"

  conditions.modVersion.*:
    summary: "Semver range one mod's version has to satisfy."
    description: >-
      The key is the mod reference, the value an SML semver range such as `>=3.12.0`,
      `^2.0.0`, `~1.2.0`, an exact version or a `||` union.
    type: "semver range"
    examples:
      - title: Pin KAPI to the 2026 releases
        yaml: |
          type: cdo
          conditions:
            modVersion:
              KAPI: '>=2026.0.0'
          patches:
            - target: Desc_Water
              properties:
                - path: mResourceSinkPoints
                  value: 0
    docs: "features/conditions-and-packs"

  conditions.hasClass:
    summary: "Class paths that all have to exist."
    description: >-
      A single class path or a list; every listed class has to exist. An entry-level `hasClass`
      cannot see classes that KDataForge itself generates.
    type: "class path | list"
    examples:
      - title: Only when the fracking activator exists
        yaml: |
          type: cdo
          conditions:
            hasClass: /Script/FactoryGame.FGBuildableFrackingActivator
          patches:
            - target: /Script/FactoryGame.FGBuildableFrackingActivator
              properties:
                - path: mDefaultPotentialExtractionPerMinute
                  op: multiply
                  value: 1.5
    docs: "features/conditions-and-packs"

  conditions.ifNotMatch:
    summary: "Negates the combined result of this condition object."
    description: >-
      The keys of the object are combined with AND first, then the result is inverted. It
      applies to the whole object, so excluding several mods independently needs one object per
      mod. Malformed keys, types or ranges are never turned into a match by the inversion.
    type: "bool"
    default: false
    examples:
      - title: Skip the document when IncompatibleMod is loaded
        yaml: |
          type: cdo
          conditions:
            - hasMod: IncompatibleMod
              ifNotMatch: true
          patches:
            - target: Desc_Water
              properties:
                - path: mResourceSinkPoints
                  value: 0
    docs: "features/conditions-and-packs"

  conditions.config:
    summary: "Expression over pack configuration fields and game settings."
    description: >-
      One expression string, or a list of expressions that must all be true. Operands are config
      field ids (`balance.ironSpeed`), `cfg:<pack>:<id>` and the game settings `session:`,
      `ags:` and `option:`. The operators are `!`, `&&`, `||`, `==`, `!=`, `<`, `<=`, `>`, `>=`,
      `contains` and `in`. It works in `pack.yml`, in a document and on list entries, not
      inside a config definition.
    type: "expression | list"
    examples:
      - title: Gate a document on two settings
        partial: true
        yaml: |
          type: cdo
          conditions:
            config: features.enableBonus && balance.ironSpeed >= 2
          patches:
            - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
              properties:
                - path: mManufactoringDuration
                  op: multiply
                  value: 0.9
      - title: Several expressions, all must hold
        partial: true
        yaml: |
          conditions:
            config:
              - features.enableBonus
              - balance.ironSpeed >= 2
    docs: "reference/config-expressions"

  include:
    summary: "Files of the same pack that have to apply before this document."
    description: >-
      A relative path (from the pack root) or a list of paths. It only orders documents within
      the same stage; it does not paste their text. A file with several documents waits for all
      of them. Cycles fall back to path order with a warning.
    type: "file path | list"
    examples:
      - title: Apply after the base values
        yaml: |
          type: cdo
          include:
            - base/base-values.cdo.yml
          patches:
            - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
              properties:
                - path: mManufactoringDuration
                  op: multiply
                  value: 2
    docs: "features/conditions-and-packs"

defs:
  nodePlacement:
    id:
      summary: "Stable node identity, unique across additions and replacements in this pack."
      description: "Keep this identity stable when editing a pack; changing it creates a different runtime identity."
      type: "string"
      examples:
        - title: "Configure id"
          partial: true
          yaml: |
            id: northern-iron
      docs: "features/resource-node-placement"
    resource:
      summary: "Resource descriptor class assigned to the node."
      description: "Use a concrete resource descriptor from the loaded game or an earlier KDataForge generation stage."
      type: "resource class"
      examples:
        - title: "Configure resource"
          partial: true
          yaml: |
            resource: /Game/FactoryGame/Resource/RawResources/OreIron/Desc_OreIron.Desc_OreIron_C
      docs: "features/resource-node-placement"
    fromResource:
      summary: "Optional original resource descriptor filter for reuse or replacement."
      description: "Compares the original descriptor when selecting an existing node; omission accepts any descriptor."
      type: "resource class"
      examples:
        - title: "Configure fromResource"
          partial: true
          yaml: |
            fromResource: /Game/FactoryGame/Resource/RawResources/OreIron/Desc_OreIron.Desc_OreIron_C
      docs: "features/resource-node-placement"
    position:
      summary: "Finite world coordinates [x, y, z] in centimetres."
      description: "Coordinates are absolute world positions, with 100 centimetres equal to one metre."
      type: "number[3]"
      examples:
        - title: "Configure position"
          partial: true
          yaml: |
            position: [10000, 20000, 1200]
      docs: "features/resource-node-placement"
    rotation:
      summary: "Finite [pitch, yaw, roll] in degrees; default [0, 0, 0]."
      description: "The sequence order is pitch, yaw, roll; every component must be finite."
      type: "number[3]"
      examples:
        - title: "Configure rotation"
          partial: true
          yaml: |
            rotation: [0, 90, 0]
      docs: "features/resource-node-placement"
    purity:
      summary: "Node purity; additions default to Normal, replacements preserve purity when omitted."
      description: "Use exact enum spelling. A replacement preserves current purity if this field is omitted."
      type: "enum"
      examples:
        - title: "Configure purity"
          partial: true
          yaml: |
            purity: Pure
      values: purity
      docs: "features/resource-node-placement"
    checkRange:
      summary: "Reuse and overlap radius in centimetres; default 500, range (0, 100000]."
      description: "The same radius limits nearby-node reuse and optional overlap checks; values above 100000 or at most zero are rejected."
      type: "number"
      examples:
        - title: "Configure checkRange"
          partial: true
          yaml: |
            checkRange: 500
      docs: "features/resource-node-placement"
    allowToMove:
      summary: "Move an eligible reused/replaced node and its linked mesh; default true."
      description: "Set false to keep the existing position and rotation when changing a resource descriptor."
      type: "boolean"
      examples:
        - title: "Configure allowToMove"
          partial: true
          yaml: |
            allowToMove: false
      docs: "features/resource-node-placement"
    preventOverlap:
      summary: "Reject a new spawn when an overlapClass actor is within checkRange; default false."
      description: "Applies when creating a new node after reuse did not succeed; it does not delete blocking actors."
      type: "boolean"
      examples:
        - title: "Configure preventOverlap"
          partial: true
          yaml: |
            preventOverlap: true
      docs: "features/resource-node-placement"
    overlapClass:
      summary: "Actor class used by overlap prevention; defaults to FGResourceNodeBase."
      description: "Collision overlap and actor-origin distance checks both consider this actor class."
      type: "actor class"
      examples:
        - title: "Configure overlapClass"
          partial: true
          yaml: |
            overlapClass: /Script/FactoryGame.FGResourceNodeBase
      docs: "features/resource-node-placement"
    mesh:
      summary: "Optional cooked UStaticMesh asset overriding the resource node mesh."
      description: "The referenced static mesh must already be cooked into the game or an installed mod."
      type: "asset path"
      examples:
        - title: "Configure mesh"
          partial: true
          yaml: |
            mesh: /Game/FactoryGame/Resource/RawResources/Ores/Meshes/SM_IronOre_01.SM_IronOre_01
      docs: "features/resource-node-placement"
    material:
      summary: "Optional cooked material overriding slot zero; cannot combine with materials."
      description: "Accepts a material or material instance and overrides only slot zero."
      type: "asset path"
      examples:
        - title: "Configure material"
          partial: true
          yaml: |
            material: /Game/FactoryGame/Resource/RawResources/Ores/Materials/MI_OreIron.MI_OreIron
      docs: "features/resource-node-placement"
    materials:
      summary: "Up to 64 material asset paths or null slots; cannot combine with material."
      description: "List indexes are material slots. A null entry clears that slot override; at most 64 entries are accepted."
      type: "list of asset paths or null"
      examples:
        - title: "Configure materials"
          partial: true
          yaml: |
            materials: [null]
      docs: "features/resource-node-placement"
  # ---- conditions on single list entries -------------------------------------------------
  listEntry:
    conditions:
      summary: "Keeps this list entry only while the condition passes."
      description: >-
        `conditions`, `conditionBehavior` and `conditionBehaivor` are allowed on any map entry
        of any list, at any depth: operations, patches, ingredients, unlocks, nodes, members of
        a value. Before the document is applied an entry whose condition is false is removed and
        the condition keys of the remaining entries are stripped. An entry condition that fails
        to evaluate removes the entry and logs an error.
      type: "condition object | list"
      examples:
        - title: This operation exists only while the bonus setting is on
          partial: true
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mProduct[0].Amount
                    op: multiply
                    value: 2
                    conditions:
                      config: features.enableBonus
      docs: "features/conditions-and-packs"
    conditionBehavior:
      summary: "How the condition objects of this list entry combine."
      description: >-
        Same meaning as on a document: `AND` (the default) or `OR` across the objects of the
        entry's `conditions` list.
      type: "AND | OR"
      default: AND
      values: conditionBehavior
      examples:
        - title: Entry kept when either mod is loaded
          partial: true
          yaml: |
            - path: mManufactoringDuration
              op: multiply
              value: 0.9
              conditionBehavior: OR
              conditions:
                - hasMod: KAPI
                - hasMod: KLib
      docs: "features/conditions-and-packs"
    conditionBehaivor:
      summary: "How the condition objects of this list entry combine (original spelling)."
      description: >-
        Same as `conditionBehavior`; both spellings are accepted. `AND` is the default.
      type: "AND | OR"
      default: AND
      values: conditionBehavior
      examples:
        - title: Entry kept when either mod is loaded
          partial: true
          yaml: |
            - path: mManufactoringDuration
              op: multiply
              value: 0.9
              conditionBehaivor: OR
              conditions:
                - hasMod: KAPI
                - hasMod: KLib
      docs: "features/conditions-and-packs"

  # ---- operations --------------------------------------------------------------------------
  operation:
    path:
      summary: "Property to change."
      description: >-
        A property name with optional members and indexes: `mManufactoringDuration`,
        `mIngredients[0].Amount`, `mSomeMap["Iron"].Value`, `mMeshComponent.RelativeScale3D`.
        Blueprint properties match on their authored name, case-insensitively. `[*]` (any
        element) is only valid in `where:` filters, never in an operation.
        The quoted operation-only selector `'@tagContainers'` expands to every top-level
        FGameplayTagContainer on each actual target, including inherited and late-subclass
        fields. It supports set, append, prepend, remove and clear. Nested containers
        are not selected; no matching fields is a no-op. Not valid in where, from or reads.
      type: "property path"
      required: true
      examples:
        - title: A plain property and a struct member of an array element
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mManufactoringDuration
                    value: 2
                  - path: mIngredients[0].Amount
                    value: 3
      docs: "reference/yaml-schema#property-paths"
    op:
      summary: "How `value` combines with what is stored at `path`."
      description: >-
        One of 25 operations. Without `op` the operation is `set` and overwrites the property.
        An operation the property type does not support is reported when the pack loads, never
        silently ignored.
      type: "operation"
      default: set
      values: op
      examples:
        - title: Halve a crafting time
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.5
      docs: "features/operations"
    value:
      summary: "Operand of the operation."
      description: >-
        The new value, the amount to add or multiply by, or the element to append, insert,
        remove or replace. The accepted YAML shape follows the property type, and the value may
        be a `cfg:` typed reference or contain `{...}` templates. `clear`, `sort`, `reverse`,
        `unique`, `remove_at`, `swap`, `duplicate`, `copy` and `move` take no `value`.
      type: "any"
      uses: localizedText
      examples:
        - title: Scalar value
          yaml: |
            type: cdo
            patches:
              - target: Desc_IronIngot_C
                properties:
                  - path: mResourceSinkPoints
                    value: 4
        - title: Struct list value
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mIngredients
                    op: append
                    value:
                      ItemClass: /Game/FactoryGame/Resource/RawResources/Coal/Desc_Coal.Desc_Coal_C
                      Amount: 1
      docs: "features/property-types"
    where:
      summary: "Element predicate used by `update_where`."
      description: >-
        One where clause or a non-empty list of clauses. Paths are relative to each array element;
        all clauses must match before the partial struct value is applied unless `whereMode: OR`
        selects any-match behavior.
      type: "clause | list"
      uses: whereClause
      examples:
        - title: Match a recipe amount by item class
          partial: true
          yaml: |
            path: mProduct
            op: update_where
            where: { path: ItemClass, equals: Desc_Old_C }
            value: { ItemClass: Desc_New_C }
      docs: "features/operations#update_where-array-of-structs"
    whereMode:
      summary: "How multiple where clauses combine."
      description: >-
        `AND` is the default and requires every clause. `OR` requires at least one clause. Value is
        case-insensitive. Valid beside a scope filter's `where` or an `update_where` operation.
      type: "AND | OR"
      default: AND
      values: whereMode
      examples:
        - title: Update elements matching either item class
          partial: true
          yaml: |
            path: mProduct
            op: update_where
            whereMode: OR
            where:
              - { path: ItemClass, equals: Desc_OldA_C }
              - { path: ItemClass, equals: Desc_OldB_C }
            value: { ItemClass: Desc_New_C }
      docs: "features/operations#update_where-array-of-structs"
    min:
      summary: "Lower bound of a `clamp`."
      description: >-
        Used by `op: clamp` together with `max`. May be a `cfg:` typed reference.
      type: "number"
      examples:
        - title: Keep a value between 0 and 999
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Schematics/Progression/Schematic_1-1.Schematic_1-1_C
                properties:
                  - path: mMenuPriority
                    op: clamp
                    min: 0
                    max: 999
      docs: "features/operations"
    max:
      summary: "Upper bound of a `clamp`."
      description: >-
        Used by `op: clamp` together with `min`. May be a `cfg:` typed reference.
      type: "number"
      examples:
        - title: Cap a value at 999
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Schematics/Progression/Schematic_1-1.Schematic_1-1_C
                properties:
                  - path: mMenuPriority
                    op: clamp
                    min: 0
                    max: 999
      docs: "features/operations"
    index:
      summary: "Array position the operation works on."
      description: >-
        Used by `insert`, `remove_at`, `swap`, `replace` and `duplicate`. Zero-based. For
        `insert` an out-of-range index is an error; it is not clamped. May be a `cfg:` typed
        reference.
      type: "integer"
      examples:
        - title: Insert as the second ingredient
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mIngredients
                    op: insert
                    index: 1
                    value:
                      ItemClass: /Game/FactoryGame/Resource/RawResources/OreCopper/Desc_OreCopper.Desc_OreCopper_C
                      Amount: 1
      docs: "features/operations"
    with:
      summary: "Second array position of a `swap`."
      description: >-
        `swap` exchanges the elements at `index` and `with` and leaves the rest of the array
        untouched. May be a `cfg:` typed reference.
      type: "integer"
      examples:
        - title: Swap the first two ingredients
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mIngredients
                    op: swap
                    index: 0
                    with: 1
      docs: "features/operations"
    from:
      summary: "Source property or old reference."
      description: >-
        A property path on the same object. `copy` writes its value to `path`; `move` does the
        same and then resets the source to its default. Different but text-compatible property
        types work as long as the text parses for the destination. For `replace_refs`, this is the
        old object or class reference searched below `path`.
      type: "property path | object/class reference"
      examples:
        - title: Copy one text property into another
          yaml: |
            type: cdo
            patches:
              - target: Desc_IronIngot_C
                properties:
                  - path: mAbbreviatedDisplayName
                    op: copy
                    from: mDisplayName
      docs: "features/operations"

  # ---- scope filters (cdo patches, remove: entries, block: entries, sinkpoints entries) -----
  scopeFilters:
    classType:
      summary: "Selects Blueprint-authored or native classes by Unreal class flags."
      description: >-
        Use with ofClass. any accepts both kinds; blueprint requires CLASS_CompiledFromBlueprint,
        native excludes it. Applies to candidate CDOs and to the class of candidate assets, also
        when classes load later. This does not inspect class names.
      type: "any | blueprint | native"
      default: any
      values: classType
      examples:
        - title: Blueprint class scope
          partial: true
          yaml: |
            ofClass: /Script/FactoryGame.FGBuildable
            classType: blueprint
      docs: "features/targeting#class-identity-filters"
    excludeClasses:
      summary: "Excludes exact classes or full class-path wildcard patterns from a filtered scope."
      description: >-
        One class reference or a non-empty list. Exact references exclude only the named class;
        subclasses remain eligible. Full paths starting with / also accept case-insensitive * and ?
        wildcards, for example /KLib/* excludes that namespace. Patterns test each candidate's class
        path, never its ancestry or an asset instance's object path. Also applied to classes loaded
        later. Use with ofClass, not as a modifier of an explicit target or allAssetsOfClass selection.
      type: "class reference or full path pattern | list"
      examples:
        - title: Exclude the base class only
          partial: true
          yaml: |
            ofClass: /Script/FactoryGame.FGBuildable
            excludeClasses: /Script/FactoryGame.FGBuildable
        - title: Exclude owned content namespaces
          partial: true
          yaml: |
            ofClass: /Script/FactoryGame.FGRecipe
            classType: blueprint
            excludeClasses: ['/KLib/*', '/SatisfactoryPlus/*']
      docs: "features/targeting#class-identity-filters"
    ofClass:
      summary: "Scope of a filtered selection: this class, its subclasses and its data assets."
      description: >-
        Names the class whose members the filters pick from. It is required with `matchTag`,
        `matchName` and `where` unless a recipe shortcut (`producedIn`, `ingredient`,
        `product`) supplies the default `FGRecipe`. Documents that select existing content
        default it to their own base class (`FGRecipe`, `FGSchematic`, `FGItemDescriptor`, ...).
      type: "class path"
      examples:
        - title: Every alternate recipe in the game
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGRecipe
                matchName: Recipe_Alternate_*
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.8
      docs: "features/targeting#ofclass-scope--filters-select-by-tag-name-recipe-shape-or-property-values"
    matchTag:
      summary: "Selects objects that carry every listed gameplay tag."
      description: >-
        A tag or a list of tags; all of them must be present. Register your own tags first with
        a `gametag` document. `tagProperty` names the tag container explicitly.
      type: "string | list"
      examples:
        - title: Patch everything tagged as an alternate recipe
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGRecipe
                matchTag: KMods.AlternateRecipe
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.8
      docs: "features/targeting#matchtag-select-by-gameplay-tag"
    tagProperty:
      summary: "Tag container property that `matchTag` reads."
      description: >-
        Use it when the objects keep their tags in a container other than the default one, for
        example `mGameplayTags`.
      type: "property name"
      examples:
        - title: Explicit tag container
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGRecipe
                matchTag: KMods.AlternateRecipe
                tagProperty: mGameplayTags
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.8
      docs: "features/targeting#matchtag-select-by-gameplay-tag"
    matchAssets:
      summary: "Also match data-asset instances of the scope class."
      description: >-
        By default a scope selects classes and the data-asset instances of that class. Set it to
        `false` to select classes only.
      type: "bool"
      default: true
      examples:
        - title: Classes only
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGRecipe
                matchTag: KMods.AlternateRecipe
                matchAssets: false
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.8
      docs: "features/targeting#matchtag-select-by-gameplay-tag"
    matchName:
      summary: "Selects by class name or path with wildcards."
      description: >-
        `*` matches any run of characters and `?` one character, case-insensitively; the
        trailing `_C` of Blueprint classes is optional. A pattern that contains `/` is matched
        against the full class path, which selects by content folder. With a list, any pattern
        may match. Data-asset instances are matched on their own name and path.
      type: "wildcard | list"
      examples:
        - title: Every milestone in a folder
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGSchematic
                matchName: /Game/FactoryGame/Schematics/Progression/*
                properties:
                  - path: mTimeToComplete
                    op: multiply
                    value: 0.5
      docs: "features/targeting#matchname-select-by-class-name-pattern"
    producedIn:
      summary: "Selects recipes crafted in the listed building classes or their subclasses."
      description: >-
        A building class or a list; any one may match. The scope defaults to `FGRecipe` when
        `ofClass` is missing. A base class such as `FGBuildableManufacturer` covers every
        machine derived from it, including modded ones.
      type: "class path | list"
      examples:
        - title: Every Constructor recipe is 25 percent faster
          yaml: |
            type: cdo
            patches:
              - producedIn: /Game/FactoryGame/Buildable/Factory/ConstructorMk1/Build_ConstructorMk1.Build_ConstructorMk1_C
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.75
      docs: "features/targeting#producedin--ingredient--product-recipe-shortcuts"
    ingredient:
      summary: "Selects recipes that consume one of the listed items."
      description: >-
        An item class or a list; a recipe matches when one of its ingredients is that item or a
        subclass of it. The scope defaults to `FGRecipe` when `ofClass` is missing.
      type: "class path | list"
      examples:
        - title: Every recipe that consumes Plastic or Rubber
          yaml: |
            type: cdo
            patches:
              - ingredient: [Desc_Plastic_C, Desc_Rubber_C]
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.9
      docs: "features/targeting#producedin--ingredient--product-recipe-shortcuts"
    product:
      summary: "Selects recipes that produce one of the listed items."
      description: >-
        An item class or a list; a recipe matches when one of its products is that item or a
        subclass of it. The scope defaults to `FGRecipe` when `ofClass` is missing.
      type: "class path | list"
      examples:
        - title: Screw recipes made in an Assembler yield twice as much
          yaml: |
            type: cdo
            patches:
              - product: Desc_IronScrew_C
                producedIn: Build_AssemblerMk1_C
                properties:
                  - path: mProduct[0].Amount
                    op: multiply
                    value: 2
      docs: "features/targeting#producedin--ingredient--product-recipe-shortcuts"
    where:
      summary: "Selects objects whose properties satisfy the where clauses."
      description: >-
        One clause or a list of clauses. Clauses use AND by default; `whereMode: OR` selects objects
        when any clause holds. A clause names a property `path` (`[*]` means any element) and exactly
        one comparison operator. Objects without the property do not match.
      type: "clause | list"
      uses: whereClause
      examples:
        - title: Long recipes that use Iron Ingot
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGRecipe
                where:
                  - path: mManufactoringDuration
                    greaterThan: 8
                  - path: mIngredients[*].ItemClass
                    equals: Desc_IronIngot_C
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.8
      docs: "features/targeting#where-filter-by-property-values"
    whereMode:
      summary: "How multiple scope-filter where clauses combine."
      description: >-
        `AND` is the default and requires every clause. `OR` requires at least one clause. Value is
        case-insensitive and requires a sibling `where` field. Other scope filters on the same entry
        still combine with this where result using AND.
      type: "AND | OR"
      default: AND
      values: whereMode
      examples:
        - title: Select liquid or gas descriptors
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGItemDescriptor
                whereMode: OR
                where:
                  - { path: mForm, equals: RF_LIQUID }
                  - { path: mForm, equals: RF_GAS }
                properties:
                  - { path: mResourceSinkPoints, value: 0 }
      docs: "features/targeting#where-filter-by-property-values"

  whereClause:
    path:
      summary: "Property that the clause compares."
      description: >-
        Same grammar as an operation path, plus `[*]` for "any element". Inside a `where` path a
        class reference reads through to the defaults of that class, so
        `mProduct[0].ItemClass.mForm` compares the form of the produced item.
      type: "property path"
      required: true
      examples:
        - title: Compare a property of every unlocked recipe
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGSchematic
                where:
                  path: mTechTier
                  lessOrEqual: 3
                properties:
                  - path: mTimeToComplete
                    value: 0
      docs: "features/targeting#where-filter-by-property-values"
    equals:
      summary: "Matches when the property equals the value."
      description: >-
        Works on every property type. For class references the class or any subclass matches.
        Exactly one operator is allowed per clause.
      type: "any"
      examples:
        - title: Recipes that use Iron Ingot
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGRecipe
                where:
                  path: mIngredients[*].ItemClass
                  equals: Desc_IronIngot_C
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.9
      docs: "features/targeting#where-filter-by-property-values"
    notEquals:
      summary: "Matches when the property differs from the value."
      description: >-
        The negation of `equals`. Works on every property type.
      type: "any"
      examples:
        - title: Everything except solids
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGItemDescriptor
                where:
                  path: mForm
                  notEquals: RF_SOLID
                properties:
                  - path: mResourceSinkPoints
                    value: 0
      docs: "features/targeting#where-filter-by-property-values"
    lessThan:
      summary: "Matches when the property is smaller than the number."
      description: >-
        Numeric comparison on numbers, enums (by ordinal) and booleans. The value may be a
        `cfg:` typed reference.
      type: "number"
      examples:
        - title: Short recipes
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGRecipe
                where:
                  path: mManufactoringDuration
                  lessThan: 2
                properties:
                  - path: mManufactoringDuration
                    value: 2
      docs: "features/targeting#where-filter-by-property-values"
    lessOrEqual:
      summary: "Matches when the property is smaller than or equal to the number."
      description: >-
        Numeric comparison on numbers, enums (by ordinal) and booleans. The value may be a
        `cfg:` typed reference.
      type: "number"
      examples:
        - title: Schematics up to tier 3
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGSchematic
                where:
                  path: mTechTier
                  lessOrEqual: 3
                properties:
                  - path: mTimeToComplete
                    value: 0
      docs: "features/targeting#where-filter-by-property-values"
    greaterThan:
      summary: "Matches when the property is larger than the number."
      description: >-
        Numeric comparison on numbers, enums (by ordinal) and booleans. The value may be a
        `cfg:` typed reference.
      type: "number"
      examples:
        - title: Recipes longer than 8 seconds
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGRecipe
                where:
                  path: mManufactoringDuration
                  greaterThan: 8
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.8
      docs: "features/targeting#where-filter-by-property-values"
    greaterOrEqual:
      summary: "Matches when the property is larger than or equal to the number."
      description: >-
        Numeric comparison on numbers, enums (by ordinal) and booleans. The value may be a
        `cfg:` typed reference.
      type: "number"
      examples:
        - title: Remove high-tier schematics
          yaml: |
            type: schematic
            remove:
              - where:
                  path: mTechTier
                  greaterOrEqual: 8
      docs: "features/targeting#where-filter-by-property-values"
    contains:
      summary: "Matches when the container or text contains the value."
      description: >-
        On arrays, sets and tag containers an element equals the value (same rules as `equals`)
        or the container has the tag. On strings, names and text the text contains the
        substring.
      type: "any"
      examples:
        - title: Recipes whose tags contain a tag
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGRecipe
                where:
                  path: mGameplayTags
                  contains: KMods.AlternateRecipe
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.8
      docs: "features/targeting#where-filter-by-property-values"
    notContains:
      summary: "Matches when the container or text does not contain the value."
      description: >-
        The negation of `contains`, on arrays, sets, tag containers and text.
      type: "any"
      examples:
        - title: Recipes without the tag
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGRecipe
                where:
                  path: mGameplayTags
                  notContains: KMods.AlternateRecipe
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 1.1
      docs: "features/targeting#where-filter-by-property-values"
    in:
      summary: "Matches when the property matches any listed value."
      description: >-
        A scalar property matches like `equals` against each value; an array, set or tag
        container matches like `contains`. A single scalar is accepted instead of a list.
      type: "value | list"
      examples:
        - title: Liquids and gases never earn sink points
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGItemDescriptor
                where:
                  path: mForm
                  in: [RF_LIQUID, RF_GAS]
                properties:
                  - path: mResourceSinkPoints
                    value: 0
      docs: "features/targeting#where-filter-by-property-values"
    notIn:
      summary: "Matches when the property matches none of the listed values."
      description: >-
        The negation of `in`. A single scalar is accepted instead of a list.
      type: "value | list"
      examples:
        - title: Everything but liquids and gases
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGItemDescriptor
                where:
                  path: mForm
                  notIn: [RF_LIQUID, RF_GAS]
                properties:
                  - path: mStackSize
                    value: SS_HUGE
      docs: "features/targeting#where-filter-by-property-values"
    matches:
      summary: "Matches when the display text fits the wildcard pattern."
      description: >-
        The pattern uses `*` and `?`. References are compared by their path.
      type: "wildcard"
      examples:
        - title: Recipes with Alternate in their name
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGRecipe
                where:
                  path: mDisplayName
                  matches: "*Alternate*"
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.8
      docs: "features/targeting#where-filter-by-property-values"
    isEmpty:
      summary: "Matches on an empty (true) or non-empty (false) container, text or reference."
      description: >-
        Applies to containers, text and references; an empty reference is a null reference.
        The scope class itself is a candidate too and holds default values.
      type: "bool"
      examples:
        - title: Recipes no building can craft
          yaml: |
            type: cdo
            patches:
              - ofClass: /Script/FactoryGame.FGRecipe
                where:
                  path: mProducedIn
                  isEmpty: true
                properties:
                  - path: mProducedIn
                    op: append
                    value: /Game/FactoryGame/Buildable/-Shared/WorkBench/BP_WorkBenchComponent.BP_WorkBenchComponent_C
      docs: "features/targeting#where-filter-by-property-values"

  # ---- generated and registered entries --------------------------------------------------
  generatedEntry:
    id:
      summary: "Stable id of the generated class."
      description: >-
        The id is the save-persistence contract: the class is created in `/KDataForge/Gen/<PackRef>`
        and named `Gen_<PackRef>_<Id>`. Renaming a file is safe, renaming an id needs a
        `redirects:` entry in `pack.yml`. Letters, digits, `_`, `.` and `-`, starting with a
        letter. The id also works as a short reference elsewhere in the pack.
      type: "id"
      required: true
      examples:
        - title: An item with its id
          yaml: |
            type: item
            items:
              - id: MySuperIngot
      docs: "reference/yaml-schema#generated-class-identity-save-persistence-contract"
    parent:
      summary: "Class the new class is derived from."
      description: >-
        The generated class copies the layout of its parent (components, mesh slots) and only
        its default values differ. A class path, a generated id or a bare class name.
      type: "class path"
      examples:
        - title: A variant of the Iron Ingot
          yaml: |
            type: item
            items:
              - id: PureIronIngot
                parent: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
      docs: "reference/yaml-schema#content-creation-item-resource-building-recipe-schematic-research-unlock"
    register:
      summary: "Queues the class for registration in the mod content registry."
      description: >-
        `true` (the default) queues the class for registration in SML's mod content registry
        before the registry freezes at world begin play. Registration is described for recipes,
        schematics and research trees; registering a schematic also registers its recipes and
        their items.
      type: "bool"
      default: true
      examples:
        - title: Generate a recipe without registering it
          yaml: |
            type: recipe
            recipes:
              - id: Recipe_Internal
                register: false
      docs: "features/recipes"
    properties:
      summary: "Operations applied to the defaults of the new class."
      description: >-
        The same operations as a `cdo` patch, applied to the class default object of the
        generated class. All variation of a generated class lives in these defaults.
      type: "operation list"
      uses: operation
      examples:
        - title: Name and stack size of a new item
          yaml: |
            type: item
            items:
              - id: MySuperIngot
                properties:
                  - path: mDisplayName
                    value: Super Ingot
                  - path: mStackSize
                    value: SS_HUGE
      docs: "features/operations"

  registerableEntry:
    id:
      summary: "Stable id of a new class to generate."
      description: >-
        Generates a new class named `Gen_<PackRef>_<Id>`. Use either `id` (generate) or `class`
        (register an existing class), never both.
      type: "id"
      required: "yes, unless `class` is given"
      examples:
        - title: Generate a recipe
          yaml: |
            type: recipe
            recipes:
              - id: Recipe_MySuperIngot
      docs: "features/recipes"
    class:
      summary: "Existing class to register without generating anything."
      description: >-
        Register-only mode: queues an existing class (for example a Blueprint recipe that another
        mod ships but never registers). `properties` still tweaks its defaults.
      type: "class path"
      required: "yes, unless `id` is given"
      examples:
        - title: Register an existing recipe
          yaml: |
            type: recipe
            recipes:
              - class: /Game/SomeMod/Recipes/Recipe_Hidden.Recipe_Hidden_C
      docs: "features/recipes"
    parent:
      summary: "Class the new class is derived from."
      description: >-
        Only used with `id`. The generated class copies the layout of its parent.
      type: "class path"
      examples:
        - title: Derive a recipe from an existing one
          yaml: |
            type: recipe
            recipes:
              - id: Recipe_GatedPlate
                parent: /Game/FactoryGame/Recipes/Constructor/Recipe_IronPlate.Recipe_IronPlate_C
      docs: "features/recipes"
    register:
      summary: "Queues the class for registration in the mod content registry."
      description: >-
        Registration is on unless you set `false`. Auto-propagation registers a schematic's
        recipes, and a recipe's items, with it.
      type: "bool"
      default: true
      examples:
        - title: Skip registration
          yaml: |
            type: recipe
            recipes:
              - id: Recipe_Internal
                register: false
      docs: "features/recipes"
    properties:
      summary: "Operations applied to the defaults of the class."
      description: >-
        The same operations as a `cdo` patch, applied to the generated (or registered) class.
      type: "operation list"
      uses: operation
      examples:
        - title: Craft time of a new recipe
          yaml: |
            type: recipe
            recipes:
              - id: Recipe_MySuperIngot
                properties:
                  - path: mManufactoringDuration
                    value: 4
      docs: "features/operations"

  instancedObject:
    class:
      summary: "Class of the instanced sub-object."
      description: >-
        A concrete subclass of the base the list expects (`FGUnlock`, `FGAvailabilityDependency`,
        ...). Known native FactoryGame and KMods class paths are remapped to their Blueprint
        implementation automatically.
      type: "class path"
      required: true
      examples:
        - title: A recipe unlock on a schematic
          yaml: |
            type: schematic
            schematics:
              - id: Schematic_MySuperIngot
                unlocks:
                  - class: /Game/FactoryGame/Unlocks/BP_UnlockRecipe.BP_UnlockRecipe_C
      docs: "reference/yaml-schema#instanced-unlocks-on-schematics-unlocks"
    properties:
      summary: "Operations applied to the new sub-object."
      description: >-
        The same operations as a `cdo` patch, applied to the instance before it is appended to
        the owner's array.
      type: "operation list"
      uses: operation
      examples:
        - title: Unlock a generated recipe
          yaml: |
            type: schematic
            schematics:
              - id: Schematic_MySuperIngot
                unlocks:
                  - class: /Game/FactoryGame/Unlocks/BP_UnlockRecipe.BP_UnlockRecipe_C
                    properties:
                      - path: mRecipes
                        value:
                          - Recipe_MySuperIngot
      docs: "features/schematics"

  # ---- research tree nodes -----------------------------------------------------------------
  coordinate:
    X:
      summary: "Horizontal grid position of the node."
      description: >-
        A whole number on the research tree grid. `X` and `Y` are both required.
      type: "integer"
      required: true
      examples:
        - title: Node at the origin
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
                addNodes:
                  - schematic: Schematic_First
                    coordinate:
                      X: 0
                      Y: 0
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"
    Y:
      summary: "Vertical grid position of the node."
      description: >-
        A whole number on the research tree grid. `X` and `Y` are both required.
      type: "integer"
      required: true
      examples:
        - title: Node one row down
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
                addNodes:
                  - schematic: Schematic_Second
                    coordinate:
                      X: 2
                      Y: 1
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"

  nodeReference:
    schematic:
      summary: "Refers to another node by its schematic."
      description: >-
        Instead of a literal coordinate, names the node that shows this schematic (a generated
        short id or a schematic class path). The node may be earlier or later in the same
        `addNodes` list, or already part of the tree.
      type: "schematic id | class path"
      examples:
        - title: Parent by schematic
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
                autoPath: true
                addNodes:
                  - schematic: Schematic_Second
                    coordinate:
                      X: 2
                      Y: 0
                    parents:
                      - schematic: Schematic_First
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"

  road:
    key:
      summary: "Child node the road leads to."
      description: >-
        A coordinate or a `schematic` reference identifying the child node. `points` holds the
        path of the road.
      type: "node reference"
      required: true
      uses: [nodeReference, coordinate]
      examples:
        - title: A road to the node at 2/0
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
                addNodes:
                  - schematic: Schematic_First
                    coordinate:
                      X: 0
                      Y: 0
                    childrenAndRoads:
                      key:
                        X: 2
                        Y: 0
                      points:
                        - X: 0
                          Y: 0
                        - X: 2
                          Y: 0
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"
    points:
      summary: "Coordinates the road passes through."
      description: >-
        At least two coordinates, from the parent node to the child node, so a bent road lists
        its corners.
      type: "coordinate list"
      required: true
      uses: coordinate
      examples:
        - title: A bent road
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
                addNodes:
                  - schematic: Schematic_First
                    coordinate:
                      X: 0
                      Y: 0
                    childrenAndRoads:
                      key:
                        X: 2
                        Y: 0
                      points:
                        - X: 0
                          Y: 0
                        - X: 0
                          Y: 1
                        - X: 2
                          Y: 1
                        - X: 2
                          Y: 0
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"

  researchNode:
    schematic:
      summary: "Schematic the node shows."
      description: >-
        A generated short id or a full schematic class path. Other nodes can refer to this node
        by this schematic.
      type: "schematic id | class path"
      required: true
      examples:
        - title: Add a node
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
                addNodes:
                  - schematic: Schematic_First
                    coordinate:
                      X: 0
                      Y: 0
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"
    class:
      summary: "Node class to use instead of the default research tree node."
      description: >-
        A `UFGResearchTreeNode` subclass. `properties` then applies to that node. A convenience
        field missing from a custom node class logs a warning and is skipped.
      type: "class path"
      examples:
        - title: Custom node class
          partial: true
          yaml: |
            addNodes:
              - schematic: Schematic_First
                class: /Game/SomeMod/Research/BP_CustomNode.BP_CustomNode_C
                coordinate:
                  X: 0
                  Y: 0
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"
    coordinate:
      summary: "Grid position of the node."
      description: >-
        An `X`/`Y` map of whole numbers. Supply it for any node that takes part in parent
        relationships or roads.
      type: "coordinate"
      uses: coordinate
      examples:
        - title: Position a node
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
                addNodes:
                  - schematic: Schematic_Second
                    coordinate:
                      X: 2
                      Y: 0
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"
    parents:
      summary: "Nodes that have to be unlocked before this one."
      description: >-
        Each reference is another node's `schematic` or a literal coordinate. With `autoPath: true`
        on the research entry, KDataForge draws a straight road for every parent relationship.
      type: "node reference list"
      uses: [nodeReference, coordinate]
      examples:
        - title: Require the first node
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
                autoPath: true
                addNodes:
                  - schematic: Schematic_Second
                    coordinate:
                      X: 2
                      Y: 0
                    parents:
                      - schematic: Schematic_First
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"
    nodesToUnhide:
      summary: "Nodes that become visible once this node is unlocked."
      description: >-
        References by `schematic` or coordinate. References may point forward or backward in the
        list, or to a node already in the tree.
      type: "node reference list"
      uses: [nodeReference, coordinate]
      examples:
        - title: Reveal a hidden node
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
                addNodes:
                  - schematic: Schematic_First
                    coordinate:
                      X: 0
                      Y: 0
                    nodesToUnhide:
                      - schematic: Schematic_Secret
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"
    unhiddenBy:
      summary: "Nodes whose unlock makes this node visible."
      description: >-
        The reverse of `nodesToUnhide`: references by `schematic` or coordinate.
      type: "node reference list"
      uses: [nodeReference, coordinate]
      examples:
        - title: Hidden until the first node is done
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
                addNodes:
                  - schematic: Schematic_Secret
                    coordinate:
                      X: 4
                      Y: 0
                    unhiddenBy:
                      - schematic: Schematic_First
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"
    childrenAndRoads:
      summary: "Custom visual roads from this node to its children."
      description: >-
        One road or a list of roads, each with the child `key` and the `points` it passes
        through. Use it for bent routes; `autoPath` only draws straight two-point roads.
      type: "road | list"
      uses: road
      examples:
        - title: Two roads from one node
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
                addNodes:
                  - schematic: Schematic_First
                    coordinate:
                      X: 0
                      Y: 0
                    childrenAndRoads:
                      - key:
                          X: 2
                          Y: 0
                        points:
                          - X: 0
                            Y: 0
                          - X: 2
                            Y: 0
                      - key:
                          X: 0
                          Y: 2
                        points:
                          - X: 0
                            Y: 0
                          - X: 0
                            Y: 2
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"
    properties:
      summary: "Operations applied to the node object."
      description: >-
        The same operations as a `cdo` patch, applied to the node instance.
      type: "operation list"
      uses: operation
      examples:
        - title: Property of a node
          partial: true
          yaml: |
            addNodes:
              - schematic: Schematic_First
                coordinate:
                  X: 0
                  Y: 0
                properties:
                  - path: mHidden
                    value: false
      docs: "features/operations"

  # ---- vectors and localized text -----------------------------------------------------------
  vector:
    X:
      summary: "X component of a vector value."
      description: >-
        A number. A vector is written as an `X`/`Y`/`Z` map (upper or lower case, all three
        required) or as a sequence of three numbers.
      type: "number"
      examples:
        - title: Vector as a map
          yaml: |
            type: curve
            curveType: vector
            curves:
              - id: CameraOffset
                defaultValue:
                  X: 0
                  Y: 0
                  Z: 0
                keys:
                  - time: 0
                    value:
                      X: 0
                      Y: 0
                      Z: 0
      docs: "features/curves#vector-curves"
    Y:
      summary: "Y component of a vector value."
      description: >-
        A number. All three components are required.
      type: "number"
      examples:
        - title: Vector as a map
          yaml: |
            type: curve
            curveType: vector
            curves:
              - id: CameraOffset
                keys:
                  - time: 0
                    value:
                      X: 0
                      Y: 50
                      Z: 0
      docs: "features/curves#vector-curves"
    Z:
      summary: "Z component of a vector value."
      description: >-
        A number. All three components are required.
      type: "number"
      examples:
        - title: Vector as a map
          yaml: |
            type: curve
            curveType: vector
            curves:
              - id: CameraOffset
                keys:
                  - time: 0
                    value:
                      X: 0
                      Y: 0
                      Z: 25
      docs: "features/curves#vector-curves"
    x:
      summary: "X component of a vector value (lower case)."
      description: >-
        Lower-case spelling of `X`. Use one spelling per component.
      type: "number"
      examples:
        - title: Lower-case components
          yaml: |
            type: curve
            curveType: vector
            curves:
              - id: CameraOffset
                keys:
                  - time: 0
                    value:
                      x: 0
                      y: 0
                      z: 0
      docs: "features/curves#vector-curves"
    y:
      summary: "Y component of a vector value (lower case)."
      description: >-
        Lower-case spelling of `Y`. Use one spelling per component.
      type: "number"
      examples:
        - title: Lower-case components
          yaml: |
            type: curve
            curveType: vector
            curves:
              - id: CameraOffset
                keys:
                  - time: 0
                    value:
                      x: 0
                      y: 10
                      z: 0
      docs: "features/curves#vector-curves"
    z:
      summary: "Z component of a vector value (lower case)."
      description: >-
        Lower-case spelling of `Z`. Use one spelling per component.
      type: "number"
      examples:
        - title: Lower-case components
          yaml: |
            type: curve
            curveType: vector
            curves:
              - id: CameraOffset
                keys:
                  - time: 0
                    value:
                      x: 0
                      y: 0
                      z: 10
      docs: "features/curves#vector-curves"

  localizedText:
    stringTable:
      summary: "Existing Unreal StringTable ID or asset object path."
      description: >-
        Together with key, preserves the StringTable reference and its translations. Do not
        combine with ns or source. The existing table and key must be supplied by their owning mod.
      type: "non-empty string"
      examples:
        - title: Keep an existing StringTable reference
          partial: true
          yaml: |
            value:
              stringTable: /SatisfactoryPlus/ST_SatisfactoryPlus.ST_SatisfactoryPlus
              key: CDOBuilding_MiniExtractior.PropertyContainer_0.mDisplayName
      docs: "features/property-types#ftext-stringtable-references"
    key:
      summary: "Localization key of the text."
      description: >-
        Required in the map form. A localization document with the same namespace and key
        supplies the translations.
      type: "string"
      required: true
      examples:
        - title: Localized pack description
          partial: true
          yaml: |
            description:
              key: Pack_Description
              ns: KDFSample
              source: Rebalances the smelter recipes.
      docs: "features/localization#simple-key-entries-new-text"
    ns:
      summary: "Localization namespace of the text."
      description: >-
        Groups keys together; a translation document uses the same `namespace`.
      type: "string"
      examples:
        - title: Namespace of a text
          partial: true
          yaml: |
            description:
              key: Pack_Description
              ns: KDFSample
              source: Rebalances the smelter recipes.
      docs: "features/localization#simple-key-entries-new-text"
    source:
      summary: "Text shown when no translation exists."
      description: >-
        The source string. A translation entry that overrides the text has to repeat it
        byte for byte.
      type: "string"
      examples:
        - title: Source text
          partial: true
          yaml: |
            description:
              key: Pack_Description
              ns: KDFSample
              source: Rebalances the smelter recipes.
      docs: "features/localization#simple-key-entries-new-text"

kinds:
  eventrule:
    rules:
      summary: "Registers 1 to 256 server-side event rules."
      description: "Rules are registered during RuntimePatches, then executed by world events rather than during YAML loading."
      type: "list"
      examples:
        - title: "Configure rules"
          partial: true
          yaml: |
            rules:
              - id: started
                event: worldReady
                actions:
                  - log: World ready
      docs: "features/event-rules"
    "rules[].id":
      summary: "Stable pack-qualified once-per-save identity; 1 to 128 ASCII letters, digits, dot, underscore or hyphen."
      description: "Keep this identity stable when editing a pack; changing it creates a different runtime identity."
      type: "string"
      examples:
        - title: "Configure id"
          partial: true
          yaml: |
            id: northern-iron
      docs: "features/event-rules"
    "rules[].event":
      summary: "Exact event name: worldReady or schematicPurchased."
      description: "Event names are case sensitive. Adding a worldReady rule through reload takes effect on the next world load."
      type: "enum"
      examples:
        - title: "Configure event"
          partial: true
          yaml: |
            event: worldReady
      values: event
      docs: "features/event-rules"
    "rules[].schematic":
      summary: "Optional schematicPurchased class filter; forbidden on worldReady."
      description: "Filters purchases to this concrete schematic and is invalid with worldReady."
      type: "schematic class"
      examples:
        - title: "Configure schematic"
          partial: true
          yaml: |
            schematic: /Game/FactoryGame/Schematics/Progression/Schematic_1-1.Schematic_1-1_C
      docs: "features/event-rules"
    "rules[].once":
      summary: "Persist successful rule completion in the save; default true."
      description: "A successful execution is remembered per pack reference and rule id across reloads and save loads."
      type: "boolean"
      examples:
        - title: "Configure once"
          partial: true
          yaml: |
            once: true
      docs: "features/event-rules"
    "rules[].requiresSchematics":
      summary: "Up to 64 schematic classes that must already be purchased."
      description: "All listed schematics must already be purchased at event time; failed prerequisites leave the rule incomplete."
      type: "list of schematic classes"
      examples:
        - title: "Configure requiresSchematics"
          partial: true
          yaml: |
            requiresSchematics:
              - /Game/FactoryGame/Schematics/Progression/Schematic_1-1.Schematic_1-1_C
      docs: "features/event-rules"
    "rules[].actions":
      summary: "Ordered list of 1 to 32 actions; each action has exactly one key."
      description: "Actions run in order after grant preflight. Every action map must contain exactly one supported action key."
      type: "list"
      examples:
        - title: "Configure actions"
          partial: true
          yaml: |
            actions:
              - log: World ready
      docs: "features/event-rules"
    "rules[].actions[].unlockSchematic":
      summary: "Grant a concrete schematic; already purchased schematics are skipped."
      description: "The game must allow the grant. An already purchased schematic is a successful no-op."
      type: "schematic class"
      examples:
        - title: "Configure unlockSchematic"
          partial: true
          yaml: |
            unlockSchematic: /Game/FactoryGame/Schematics/Progression/Schematic_1-1.Schematic_1-1_C
      docs: "features/event-rules"
    "rules[].actions[].log":
      summary: "Write nonblank diagnostic text of at most 2048 characters to LogKDataForge."
      description: "Writes diagnostic text to LogKDataForge and does not display a toast or other player popup."
      type: "string"
      examples:
        - title: "Configure log"
          partial: true
          yaml: |
            log: World ready
      docs: "features/event-rules"
  # ---- type: asset ---------------------------------------------------------------------------
  asset:
    assets:
      summary: "Image files of the pack that become texture assets."
      description: >-
        Each entry loads an image file at start-up and turns it into a `UTexture2D` that any
        object property can reference, for example as an item icon. The texture lives at
        `/KDataForge/GenAssets/<PackRef>.Gen_<PackRef>_<Id>`. Images are 2D only; the next
        game start decodes changed files.
      type: "list of image entries"
      required: true
      examples:
        - title: Import an icon
          yaml: |
            type: asset
            assets:
              - id: SuperIngotIcon
                file: icons/super-ingot.png
      docs: "features/data-assets#2d-image-assets-type-asset"
    "assets[].id":
      summary: "Stable id of the texture asset."
      description: >-
        Shares the generated asset namespace with data assets, curves and sounds, so an id must
        not be reused. Properties can point at the texture with the bare id (`mSmallIcon:
        SuperIngotIcon`) or the full `/KDataForge/GenAssets/...` path.
      type: "id"
      required: true
      examples:
        - title: Use the texture as an item icon
          yaml: |
            type: item
            items:
              - id: SuperIngot
                properties:
                  - path: mSmallIcon
                    value: SuperIngotIcon
      docs: "features/data-assets#2d-image-assets-type-asset"
    "assets[].file":
      summary: "Image file, relative to the pack root."
      description: >-
        A `png`, `jpg`, `jpeg`, `tga` or `bmp` file inside the pack folder. DDS and WAV are not
        supported.
      type: "file path"
      required: true
      examples:
        - title: Image in a subfolder
          yaml: |
            type: asset
            assets:
              - id: MyIcon
                file: icons/my-icon.png
      docs: "features/data-assets#2d-image-assets-type-asset"
    "assets[].properties":
      summary: "Optional operations applied to the generated texture."
      description: >-
        Uses the same operation grammar as a `cdo` patch.
      type: "operation list"
      uses: operation
      examples:
        - title: Point filtering for a pixel-art icon
          partial: true
          yaml: |
            assets:
              - id: PixelIcon
                file: icons/pixel.png
                properties:
                  - path: Filter
                    value: TF_Nearest
      docs: "features/data-assets#2d-image-assets-type-asset"

  # ---- type: building ------------------------------------------------------------------------
  building:
    buildings:
      summary: "New building descriptor classes to generate."
      description: >-
        Generates `FGBuildingDescriptor`-derived classes, each a new entry in the build menu.
        A generated class keeps the layout of its parent: no new meshes, components or
        behaviour, only different defaults. The parent is a building descriptor (`Desc_*_C`),
        never the buildable actor (`Build_*_C`). To tune an existing building use a `cdo` patch.
      type: "list of building entries"
      required: true
      uses: generatedEntry
      examples:
        - title: A second build menu entry for the storage container
          yaml: |
            type: building
            buildings:
              - id: MyCrimsonStorage
                parent: /Game/FactoryGame/Buildable/Factory/StorageContainerMk1/Desc_StorageContainerMk1.Desc_StorageContainerMk1_C
                properties:
                  - path: mDisplayName
                    value: Crimson Storage Container
      docs: "features/buildings"
    "buildings[].parent":
      summary: "Building descriptor class the new entry copies its settings from."
      description: >-
        Defaults to `/Script/FactoryGame.FGBuildingDescriptor`, which is also the required base:
        the parent must derive from it. Use the descriptor of an existing building (`Desc_*_C`);
        its `mBuildableClass` decides which building the entry places. A buildable actor class
        (`Build_*_C`) is an error: `kdf lint` reports it and suggests the matching descriptor.
      type: "class path"
      default: "/Script/FactoryGame.FGBuildingDescriptor"
      examples:
        - title: Variant of the Constructor
          yaml: |
            type: building
            buildings:
              - id: MyConstructor
                parent: /Game/FactoryGame/Buildable/Factory/ConstructorMk1/Desc_ConstructorMk1.Desc_ConstructorMk1_C
      docs: "features/buildings"

  # ---- type: cdo -----------------------------------------------------------------------------
  cdo:
    patches:
      summary: "Patches that change properties of existing classes and assets."
      description: >-
        Each patch selects what to change (`target`, `allAssetsOfClass`, or an `ofClass` scope
        with filters) and lists the `properties` operations to apply. Selectors on one patch
        accumulate their matches; one clear selector per patch is easier to audit.
      type: "list of patches"
      required: true
      uses: scopeFilters
      examples:
        - title: Halve the crafting time of the Iron Ingot recipe
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.5
      docs: "features/patching-cdo"
    "patches[].target":
      summary: "Exact class or object to patch."
      description: >-
        A class path patches the class default object, an object path (no `_C`) patches that
        object directly, and a list patches each entry the same way. A bare generated id or
        a bare class name also resolves; prefer full paths in published packs.
      type: "class path | object path | list"
      examples:
        - title: One class
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mManufactoringDuration
                    value: 2
        - title: Several unrelated targets with the same properties
          yaml: |
            type: cdo
            patches:
              - target:
                  - MySuperIngot
                  - /Game/FactoryGame/Resource/Parts/IronPlate/Desc_IronPlate.Desc_IronPlate_C
                properties:
                  - path: mResourceSinkPoints
                    value: 50
      docs: "features/targeting"
    "patches[].allAssetsOfClass":
      summary: "Every asset of a class, found in the asset registry."
      description: >-
        Patches all assets of that class and its subclasses, which suits data-asset families.
        It depends on the asset registry being populated.
      type: "class path"
      examples:
        - title: Speed up every KAPI cleaner recipe
          yaml: |
            type: cdo
            conditions:
              hasMod: KAPI
            patches:
              - allAssetsOfClass: /Script/KAPI.KAPICleanerItemDescription
                properties:
                  - path: mProductionTime
                    op: multiply
                    value: 0.75
      docs: "features/targeting#allassetsofclass-every-asset-of-a-class"
    "patches[].applyToSubclasses":
      summary: "Also patches every class derived from the target."
      description: >-
        With a class target, every derived class default object is patched too, including
        classes from other mods, Blueprint classes loaded later and native-parent classes
        generated by KDF. Deferred writes wait until the class and CDO are initialized.
        Prefer the most derived class that still covers your intent,
        and `min`/`max`/`clamp`/`multiply` over an absolute `set`.
      type: "bool"
      default: false
      examples:
        - title: Every extractor
          yaml: |
            type: cdo
            patches:
              - target: /Script/FactoryGame.FGBuildableResourceExtractor
                applyToSubclasses: true
                properties:
                  - path: mExtractMultiplier
                    op: min
                    value: 2
      docs: "features/targeting#applytosubclasses-widen-a-class-target-to-every-derived-class"
    "patches[].applyToSpawnedActors":
      summary: "Re-applies the operations to every actor of the class when it spawns."
      description: >-
        For actor classes whose placed instances override the defaults. The writes happen at
        world begin play and on every later spawn, unconditionally: they do not preserve a value
        a player or save changed.
      type: "bool"
      default: false
      examples:
        - title: Bigger storage containers, also for placed ones
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Buildable/Factory/StorageContainerMk1/Build_StorageContainerMk1.Build_StorageContainerMk1_C
                applyToSpawnedActors: true
                properties:
                  - path: mInventorySizeX
                    value: 12
      docs: "features/targeting#applytospawnedactors-runtime-actor-patches"
    "patches[].deferOneGameTick":
      summary: "Waits one game tick after BeginPlay before resolving and applying."
      description: >-
        The targets are resolved and the operations applied one game tick after BeginPlay
        instead of in the normal apply pass.
      type: "bool"
      default: false
      examples:
        - title: Apply one tick late
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Buildable/Factory/StorageContainerMk1/Build_StorageContainerMk1.Build_StorageContainerMk1_C
                deferOneGameTick: true
                properties:
                  - path: mInventorySizeX
                    value: 12
      docs: "features/targeting"
    "patches[].properties":
      summary: "Operations applied to every selected target."
      description: >-
        A non-empty list of operations, applied in order. Each names a property `path` and an
        `op` (default `set`).
      type: "operation list"
      required: true
      uses: operation
      examples:
        - title: Two operations on one patch
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.5
                  - path: mGameplayTags
                    op: append
                    value: [MyPack.Rebalanced]
      docs: "features/operations"

  # ---- type: class ---------------------------------------------------------------------------
    "patches[].inventoryRemap":
      summary: "Converts existing and newly added items in matching player inventories."
      description: >-
        Requires explicit FGCharacterPlayer target classes and applyToSpawnedActors: true.
        Cannot combine with properties, actorAction or CDO/asset scope filters. Server-only;
        binds item-added, item-removed and inventory-resize events after player inventory is ready.
        Each source is unique and destinations cannot also be sources. Conflicting or chained
        rules on overlapping player targets are rejected at runtime. Complete output must fit
        while original stacks still occupy their slots; otherwise originals are retained and
        conversion retries on inventory changes. Quantities exceeding 32-bit range are retained.
        Only descriptor and count are converted; per-item dynamic state is not transferred.
        Reload removes old bindings and applies current rules; converted items are not reverted.
        Generated item IDs require deferOneGameTick: true because Items follows CDOChanges.
      type: "array of from/to/multiplier maps"
      examples:
        - title: Convert old inventory items
          yaml: |
            type: cdo
            patches:
              - target: /Script/FactoryGame.FGCharacterPlayer
                applyToSubclasses: true
                applyToSpawnedActors: true
                inventoryRemap:
                  - from: /Example/Items/Desc_Old.Desc_Old_C
                    to: /Example/Items/Desc_New.Desc_New_C
                    multiplier: 10
      docs: "features/targeting#player-inventory-remapping"
    "patches[].inventoryRemap[].from":
      summary: "Exact concrete item descriptor class consumed by this conversion."
      description: "Names the original item class. Each source appears once, and no destination may also be a source."
      type: "item class"
      examples:
        - title: Original inventory item
          partial: true
          yaml: |
            from: /Example/Items/Desc_Old.Desc_Old_C
      docs: "features/targeting#player-inventory-remapping"
    "patches[].inventoryRemap[].to":
      summary: "Exact concrete item descriptor class produced by this conversion."
      description: "Names the replacement item class. The entire multiplied output must fit before any originals are consumed."
      type: "item class"
      examples:
        - title: Replacement inventory item
          partial: true
          yaml: |
            to: /Example/Items/Desc_New.Desc_New_C
      docs: "features/targeting#player-inventory-remapping"
    "patches[].inventoryRemap[].multiplier":
      summary: "Output items per source item; positive 32-bit integer, default 1."
      description: "Write a number, not a quoted numeric string. Complete conversion is deferred if total output overflows 32-bit or does not fit."
      type: "integer"
      examples:
        - title: Ten output items per original
          partial: true
          yaml: |
            multiplier: 10
      docs: "features/targeting#player-inventory-remapping"
    "patches[].actorAction":
      summary: "Destroys or dismantles matching live actors one tick after they are ready."
      description: >-
        Requires explicit actor target classes and applyToSpawnedActors: true; properties, inventoryRemap and
        CDO scope filters are not allowed. Handles existing actors and future spawns. Dismantle
        calls the game's dismantle interface for children and parent, falling back to Destroy
        for actors without that interface. Only authority actors are changed, including local
        non-replicated client actors; actorSelector predicates remain server-only. Pending
        callbacks are cancelled on reload or world shutdown. Generated actor IDs need
        deferOneGameTick: true because generation follows CDOChanges. Removed actors are not restored
        by reload; destruction of saved actors may persist in the save.
      type: "destroy | dismantle"
      examples:
        - title: Remove retired actors and their dismantle children
          yaml: |
            type: cdo
            patches:
              - target: /Example/Retired/Build_Old.Build_Old_C
                applyToSubclasses: true
                applyToSpawnedActors: true
                actorAction: dismantle
      docs: "features/targeting#actor-lifecycle-actions"
    "patches[].actorSelector":
      summary: "Selects authoritative actor instances without modifying class defaults."
      type: "map"
      examples:
        - title: "Configure actorSelector"
          partial: true
          yaml: |
            actorSelector:
              tags: FactoryNorth
      description: "Requires explicit actor target and applyToSpawnedActors: true. Predicates are ANDed after BeginPlay, at startup, spawn and reload."
      docs: "features/actor-selectors"
    "patches[].actorSelector.tags":
      summary: "Requires every ordinary Actor.Tags name; accepts one name or a list."
      description: "These are ordinary AActor.Tags names, not gameplay tags; every supplied name must match."
      type: "string or list"
      examples:
        - title: "Configure tags"
          partial: true
          yaml: |
            tags: [FactoryNorth, Boosted]
      docs: "features/actor-selectors"
    "patches[].actorSelector.sphere":
      summary: "Selects actors inside a world-space sphere in centimetres."
      description: "Tests the actor origin rather than its mesh or collision bounds."
      type: "map"
      examples:
        - title: "Configure sphere"
          partial: true
          yaml: |
            sphere:
              center: [0, 0, 0]
              radius: 500
      docs: "features/actor-selectors"
    "patches[].actorSelector.sphere.center":
      summary: "Sphere centre as [x, y, z] in world centimetres."
      description: "Uses absolute world coordinates in centimetres, not an offset from the actor."
      type: "number[3]"
      examples:
        - title: "Configure center"
          partial: true
          yaml: |
            center: [0, 0, 0]
      docs: "features/actor-selectors"
    "patches[].actorSelector.sphere.radius":
      summary: "Finite sphere radius greater than zero, in centimetres."
      description: "Accepted only on replacement entries. Specify this alias or checkRange, never both."
      type: "number"
      examples:
        - title: "Configure radius"
          partial: true
          yaml: |
            radius: 500
      docs: "features/actor-selectors"
    "patches[].actorSelector.box":
      summary: "Selects actors inside an axis-aligned world-space box."
      description: "Bounds are axis aligned and inclusive; minimum must be smaller than maximum on every axis."
      type: "map"
      examples:
        - title: "Configure box"
          partial: true
          yaml: |
            box:
              min: [0, 0, 0]
              max: [100, 100, 100]
      docs: "features/actor-selectors"
    "patches[].actorSelector.box.min":
      summary: "Minimum [x, y, z]; each component must be less than max."
      description: "Every component must be finite and strictly less than the matching maximum component."
      type: "number[3]"
      examples:
        - title: "Configure min"
          partial: true
          yaml: |
            min: [0, 0, 0]
      docs: "features/actor-selectors"
    "patches[].actorSelector.box.max":
      summary: "Maximum [x, y, z]; each component must be greater than min."
      description: "Every component must be finite and strictly greater than the matching minimum component."
      type: "number[3]"
      examples:
        - title: "Configure max"
          partial: true
          yaml: |
            max: [100, 100, 100]
      docs: "features/actor-selectors"
    "patches[].actorSelector.currentRecipe":
      summary: "Requires an exact currently configured recipe class, or one from a list."
      description: "Matches exact current recipe classes on compatible actors; an actor without a configured recipe does not match."
      type: "recipe class or list"
      examples:
        - title: "Configure currentRecipe"
          partial: true
          yaml: |
            currentRecipe: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
      docs: "features/actor-selectors"

  class:
    classes:
      summary: "Classes of any kind to generate from any parent."
      description: >-
        The escape hatch for classes the preset types do not cover: equipment descriptors,
        categories, unlocks, classes of other mods. It runs first in the Items stage, so later
        documents can use the generated classes. As with every generated class, only the
        defaults differ from the parent.
      type: "list of class entries"
      required: true
      examples:
        - title: An equipment descriptor
          yaml: |
            type: class
            classes:
              - id: Desc_MyGadget
                parent: /Script/FactoryGame.FGEquipmentDescriptor
                properties:
                  - path: mStackSize
                    value: SS_ONE
      docs: "features/custom-classes"
    "classes[].id":
      summary: "Stable id of the generated class."
      description: >-
        The id is the save-persistence contract: the class is created in `/KDataForge/Gen/<PackRef>`
        and named `Gen_<PackRef>_<Id>`. Renaming an id needs a `redirects:` entry in `pack.yml`.
        Register-only entries (`class:`) are not supported here.
      type: "id"
      required: true
      examples:
        - title: A custom class
          yaml: |
            type: class
            classes:
              - id: MyCustomThing
                parent: /Script/FactoryGame.FGEquipmentDescriptor
      docs: "features/custom-classes"
    "classes[].properties":
      summary: "Operations applied to the defaults of the generated class."
      description: >-
        The same operations as a `cdo` patch, applied to the class default object. All
        variation of a generated class lives in these defaults.
      type: "operation list"
      uses: operation
      examples:
        - title: Name of the new class
          yaml: |
            type: class
            classes:
              - id: Desc_MyGadget
                parent: /Script/FactoryGame.FGEquipmentDescriptor
                properties:
                  - path: mDisplayName
                    value: Portable Gadget
      docs: "features/operations"
    "classes[].parent":
      summary: "Class to derive from, native or Blueprint."
      description: >-
        Required: there is no default parent and no required base class. Any class works, such
        as `/Script/Module.Class` or `/Game/...Thing_C`.
      type: "class path"
      required: true
      examples:
        - title: A category class
          yaml: |
            type: class
            classes:
              - id: SampleBalanceCategory
                parent: /Script/FactoryGame.FGCategory
      docs: "features/custom-classes"
    "classes[].registerAs":
      summary: "Queues the class for content registration as a recipe, schematic or research tree."
      description: >-
        Only needed when you generate one of those three kinds through `class` instead of the
        preset type. Everything else just has to exist.
      type: "recipe | schematic | research"
      values: registerAs
      examples:
        - title: Generate a recipe through the generic type
          yaml: |
            type: class
            classes:
              - id: Recipe_FromClass
                parent: /Script/FactoryGame.FGRecipe
                registerAs: recipe
      docs: "features/custom-classes"

  # ---- type: curve ---------------------------------------------------------------------------
  curve:
    curveType:
      summary: "Kind of curve asset the document creates or edits."
      description: >-
        `float` for `UCurveFloat`, `vector` for `UCurveVector`. A document cannot edit a curve
        of the other kind.
      type: "float | vector"
      required: true
      values: curveType
      examples:
        - title: A float curve
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                keys:
                  - time: 0
                    value: 1
      docs: "features/curves"
    curves:
      summary: "Curves to create or edit."
      description: >-
        Each entry has exactly one of `id` (create) or `target` (edit). Its `keys` replace the
        full key set of the curve. Generated curves live at
        `/KDataForge/GenAssets/<PackRef>.Gen_<PackRef>_<Id>`.
      type: "list of curves"
      required: true
      examples:
        - title: Two keys
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                keys:
                  - time: 0
                    value: 1
                  - time: 10
                    value: 0.5
      docs: "features/curves"
    "curves[].id":
      summary: "Creates a new curve asset with this id."
      description: >-
        Use `id` or `target`, never both. The curve is announced to the asset registry and is
        referenced by its `/KDataForge/GenAssets/<PackRef>.Gen_<PackRef>_<Id>` path.
      type: "id"
      required: "yes, unless `target` is given"
      examples:
        - title: A new curve
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                keys:
                  - time: 0
                    value: 1
      docs: "features/curves"
    "curves[].target":
      summary: "Existing curve asset to edit."
      description: >-
        An object path of a cooked curve; a curve generated by the current pack also works by
        its bare id. It has to match `curveType`.
      type: "object path"
      required: "yes, unless `id` is given"
      examples:
        - title: Replace the keys of a curve
          yaml: |
            type: curve
            curveType: float
            curves:
              - target: /SomeMod/Curves/Curve_ProductionRate.Curve_ProductionRate
                keys:
                  - time: 0
                    value: 1
                  - time: 60
                    value: 2
      docs: "features/curves#editing-an-existing-curve"
    "curves[].defaultValue":
      summary: "Value returned when the curve has no keys."
      description: >-
        A number for a float curve; for a vector curve an `X`/`Y`/`Z` map or three numbers.
      type: "number | vector"
      uses: vector
      examples:
        - title: Default of a float curve
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                defaultValue: 0
                keys:
                  - time: 0
                    value: 1
      docs: "features/curves#key-and-curve-fields"
    "curves[].preInfinityExtrap":
      summary: "Behaviour before the first key."
      description: >-
        One of `none`, `constant`, `linear`, `cycle`, `cycleWithOffset` or `oscillate`.
      type: "extrapolation"
      values: extrapolation
      examples:
        - title: Hold the first value
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                preInfinityExtrap: constant
                keys:
                  - time: 0
                    value: 1
      docs: "features/curves#key-and-curve-fields"
    "curves[].postInfinityExtrap":
      summary: "Behaviour after the last key."
      description: >-
        One of `none`, `constant`, `linear`, `cycle`, `cycleWithOffset` or `oscillate`.
      type: "extrapolation"
      values: extrapolation
      examples:
        - title: Continue linearly
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                postInfinityExtrap: linear
                keys:
                  - time: 0
                    value: 1
      docs: "features/curves#key-and-curve-fields"
    "curves[].isEventCurve":
      summary: "Marks a float curve as an event curve."
      description: >-
        Valid for float curves only.
      type: "bool"
      examples:
        - title: Event curve
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: PulseCurve
                isEventCurve: true
                keys:
                  - time: 0
                    value: 1
      docs: "features/curves#key-and-curve-fields"
    "curves[].keys":
      summary: "Complete key set of the curve."
      description: >-
        At least one key. It replaces every existing key. Times must be finite and unique within
        the entry.
      type: "list of keys"
      required: true
      examples:
        - title: Linear then cubic
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                keys:
                  - time: 0
                    value: 1
                    interpMode: constant
                  - time: 10
                    value: 0.5
                    interpMode: cubic
      docs: "features/curves#key-and-curve-fields"
    "curves[].keys[].time":
      summary: "Position of the key on the curve's time axis."
      description: >-
        A finite number, unique within the curve entry. A number or a numeric string.
      type: "number"
      required: true
      examples:
        - title: A key at time 5
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                keys:
                  - time: 5
                    value: 1
      docs: "features/curves#key-and-curve-fields"
    "curves[].keys[].value":
      summary: "Value of the curve at this key."
      description: >-
        A finite number for a float curve. A vector curve takes an `X`/`Y`/`Z` map or a sequence
        of three numbers, and one key sets all three component curves.
      type: "number | vector"
      required: true
      uses: vector
      examples:
        - title: A vector key
          yaml: |
            type: curve
            curveType: vector
            curves:
              - id: CameraOffset
                keys:
                  - time: 1
                    value: [100, 0, 50]
      docs: "features/curves#vector-curves"
    "curves[].keys[].interpMode":
      summary: "Interpolation from this key to the next."
      description: >-
        `constant`, `linear` or `cubic`.
      type: "constant | linear | cubic"
      default: linear
      values: interpMode
      examples:
        - title: Cubic interpolation
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                keys:
                  - time: 0
                    value: 1
                    interpMode: cubic
      docs: "features/curves#key-and-curve-fields"
    "curves[].keys[].tangentMode":
      summary: "How the tangents of a cubic key are computed."
      description: >-
        `auto`, `smartAuto`, `user` or `break`. With `user` and `break` the tangent values come
        from `arriveTangent` and `leaveTangent`.
      type: "auto | smartAuto | user | break"
      default: auto
      values: tangentMode
      examples:
        - title: User-defined tangents
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                keys:
                  - time: 0
                    value: 1
                    interpMode: cubic
                    tangentMode: user
                    arriveTangent: -0.05
                    leaveTangent: -0.05
      docs: "features/curves#key-and-curve-fields"
    "curves[].keys[].tangentWeightMode":
      summary: "Which tangents of the key carry a weight."
      description: >-
        `none`, `arrive`, `leave` or `both`.
      type: "none | arrive | leave | both"
      default: none
      values: tangentWeightMode
      examples:
        - title: Weight both tangents
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                keys:
                  - time: 0
                    value: 1
                    interpMode: cubic
                    tangentWeightMode: both
                    arriveTangentWeight: 0.3
                    leaveTangentWeight: 0.3
      docs: "features/curves#key-and-curve-fields"
    "curves[].keys[].arriveTangent":
      summary: "Tangent entering the key."
      description: >-
        A number, or an `X`/`Y`/`Z` value for vector curves.
      type: "number | vector"
      default: 0
      uses: vector
      examples:
        - title: Arrive tangent
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                keys:
                  - time: 10
                    value: 0.5
                    interpMode: cubic
                    tangentMode: user
                    arriveTangent: -0.05
      docs: "features/curves#key-and-curve-fields"
    "curves[].keys[].leaveTangent":
      summary: "Tangent leaving the key."
      description: >-
        A number, or an `X`/`Y`/`Z` value for vector curves.
      type: "number | vector"
      default: 0
      uses: vector
      examples:
        - title: Leave tangent
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                keys:
                  - time: 10
                    value: 0.5
                    interpMode: cubic
                    tangentMode: user
                    leaveTangent: -0.05
      docs: "features/curves#key-and-curve-fields"
    "curves[].keys[].arriveTangentWeight":
      summary: "Weight of the tangent entering the key."
      description: >-
        A number, or an `X`/`Y`/`Z` value for vector curves. Used with `tangentWeightMode`.
      type: "number | vector"
      default: 0
      uses: vector
      examples:
        - title: Arrive weight
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                keys:
                  - time: 0
                    value: 1
                    interpMode: cubic
                    tangentWeightMode: arrive
                    arriveTangentWeight: 0.3
      docs: "features/curves#key-and-curve-fields"
    "curves[].keys[].leaveTangentWeight":
      summary: "Weight of the tangent leaving the key."
      description: >-
        A number, or an `X`/`Y`/`Z` value for vector curves. Used with `tangentWeightMode`.
      type: "number | vector"
      default: 0
      uses: vector
      examples:
        - title: Leave weight
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                keys:
                  - time: 0
                    value: 1
                    interpMode: cubic
                    tangentWeightMode: leave
                    leaveTangentWeight: 0.3
      docs: "features/curves#key-and-curve-fields"

  # ---- type: dataasset -----------------------------------------------------------------------
  dataasset:
    assets:
      summary: "New data-asset instances to create at runtime."
      description: >-
        Creates real `UDataAsset` instances (not classes) under `/KDataForge/GenAssets/<PackRef>`,
        named `Gen_<PackRef>_<Id>`, and announces them to the asset registry. Consumers such as
        KAPI are asked to rescan afterwards. Existing assets are edited with a `cdo` document.
      type: "list of data assets"
      required: true
      examples:
        - title: A KAPI cleaner recipe
          yaml: |
            type: dataasset
            conditions:
              hasMod: KAPI
            assets:
              - id: CleanerItem_MyFluid
                class: /Script/KAPI.KAPICleanerItemDescription
                properties:
                  - path: mProductionTime
                    value: 4.0
      docs: "features/data-assets#creating-new-instances-type-dataasset"
    "assets[].id":
      summary: "Stable id of the data asset."
      description: >-
        Shares the generated asset namespace with images, curves and sounds. Reference the
        asset by this bare id inside the pack, or by its full object path.
      type: "id"
      required: true
      examples:
        - title: A named asset
          yaml: |
            type: dataasset
            assets:
              - id: CleanerItem_MyFluid
                class: /Script/KAPI.KAPICleanerItemDescription
      docs: "features/data-assets#creating-new-instances-type-dataasset"
    "assets[].class":
      summary: "Class of the data asset to instantiate."
      description: >-
        Any concrete `UDataAsset` subclass; `UPrimaryDataAsset` subclasses are the common case.
        Native KBFL CDO helpers keep their original requirement classes and callbacks. They are
        published only after successful configuration during startup and require a game restart
        for changes; pack reload is blocked while generated native helpers are active.
      type: "class path"
      required: true
      examples:
        - title: Message asset
          yaml: |
            type: dataasset
            assets:
              - id: WelcomeMessage
                class: /Script/FactoryGame.FGMessage
      docs: "features/data-assets#creating-new-instances-type-dataasset"
    "assets[].properties":
      summary: "Operations applied to the new asset."
      description: >-
        The same operations as a `cdo` patch, applied to the created instance.
      type: "operation list"
      uses: operation
      examples:
        - title: Set a time
          yaml: |
            type: dataasset
            assets:
              - id: CleanerItem_MyFluid
                class: /Script/KAPI.KAPICleanerItemDescription
                properties:
                  - path: mProductionTime
                    value: 4.0
      docs: "features/operations"
    "assets[].unlocks":
      summary: "Instanced unlock objects appended to the asset's `mUnlocks`."
      description: >-
        Intended for `UKAPIDeliveryTask`. A class that has no such array reports it at runtime.
        The entry shape matches schematic unlocks, including native-to-Blueprint remapping.
      type: "list of instanced objects"
      uses: instancedObject
      examples:
        - title: Unlock a recipe from a delivery task
          partial: true
          yaml: |
            assets:
              - id: MyDeliveryTask
                class: /Script/KAPI.KAPIDeliveryTask
                unlocks:
                  - class: /Game/FactoryGame/Unlocks/BP_UnlockRecipe.BP_UnlockRecipe_C
      docs: "features/data-assets#creating-new-instances-type-dataasset"
    "assets[].dependencies":
      summary: "Instanced dependency objects appended to the asset's `mTaskDependencies`."
      description: >-
        Intended for `UKAPIDeliveryTask`. Entry shape and class remapping match schematic
        dependencies.
      type: "list of instanced objects"
      uses: instancedObject
      examples:
        - title: Require a schematic first
          partial: true
          yaml: |
            assets:
              - id: MyDeliveryTask
                class: /Script/KAPI.KAPIDeliveryTask
                dependencies:
                  - class: /Script/FactoryGame.FGSchematicPurchasedDependency
      docs: "features/data-assets#creating-new-instances-type-dataasset"

  # ---- type: gametag -------------------------------------------------------------------------
  gametag:
    tags:
      summary: "Gameplay tags to register with the engine."
      description: >-
        Tags are added to the tag tree at runtime, before every other stage, so other documents
        of the pack can use them in `matchTag` or tag containers. They exist for the session
        only and are never written to a config file.
      type: "list of tags"
      required: true
      examples:
        - title: A tag with a comment and a plain tag
          yaml: |
            type: gametag
            tags:
              - tag: MyPack.Machines.Special
                comment: Marks special machines
              - MyPack.Simple
      docs: "features/game-tags"
    "tags[].tag":
      summary: "Dot-separated gameplay tag name."
      description: >-
        The map form of an entry. An invalid name is rejected at validation time with the
        engine's suggested fix.
      type: "gameplay tag"
      required: true
      examples:
        - title: Tag with a comment
          yaml: |
            type: gametag
            tags:
              - tag: MyPack.Machines.Special
                comment: Marks special machines
      docs: "features/game-tags"
    "tags[].comment":
      summary: "Documentation for the tag."
      description: >-
        Shown in the tag picker and editor; it has no effect on the game.
      type: "string"
      examples:
        - title: Commented tag
          yaml: |
            type: gametag
            tags:
              - tag: MyPack.Machines.Special
                comment: Marks special machines
      docs: "features/game-tags"

  # ---- type: item ----------------------------------------------------------------------------
  item:
    items:
      summary: "New item descriptor classes to generate."
      description: >-
        Each entry creates a `UFGItemDescriptor`-derived class, like every base-game part. The
        class is created before any save loads and keeps the layout of its parent. Items are
        always generated: there is no register-only mode.
      type: "list of item entries"
      required: true
      uses: generatedEntry
      examples:
        - title: A new ingot
          yaml: |
            type: item
            items:
              - id: MySuperIngot
                parent: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                properties:
                  - path: mDisplayName
                    value: Super Ingot
                  - path: mStackSize
                    value: SS_HUGE
      docs: "features/items"
    "items[].parent":
      summary: "Item class the new item copies mesh, icon and form from."
      description: >-
        Defaults to `/Script/FactoryGame.FGItemDescriptor`, which is also the required base
        class. An existing item as parent means `properties` only needs to override differences.
      type: "class path"
      default: "/Script/FactoryGame.FGItemDescriptor"
      examples:
        - title: Derive from the Iron Ingot
          yaml: |
            type: item
            items:
              - id: PureIronIngot
                parent: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
      docs: "features/items"

  # ---- type: localization ----------------------------------------------------------------------
  localization:
    namespace:
      summary: "Text namespace the entries belong to."
      description: >-
        Together with an entry key it identifies a localized text. Use your own namespace for new
        keys, or the namespace of the text you override.
      type: "string"
      required: true
      examples:
        - title: Entries in the MyPack namespace
          yaml: |
            type: localization
            namespace: MyPack
            entries:
              MySuperIngot_Name: Super Ingot
      docs: "features/localization"
    culture:
      summary: "Language the entries apply to; omit for every language."
      description: >-
        Matched as a prefix in both directions against the current language, so `de` applies to
        `de-DE` and `de-AT`. `pt-BR` only matches that variant. A non-matching document is
        skipped with an Info diagnostic.
      type: "culture code"
      examples:
        - title: German texts
          yaml: |
            type: localization
            namespace: MyPack
            culture: de
            entries:
              MySuperIngot_Name: Superbarren
      docs: "features/localization#bidirectional-prefix-matching-for-culture"
    entries:
      summary: "Map of text key to text."
      description: >-
        Each key maps to a plain string (a new text under the namespace) or to a `source`/`text`
        map that overrides an existing text by its original string.
      type: "map of key to text"
      required: true
      examples:
        - title: New and overridden texts
          yaml: |
            type: localization
            namespace: MyPack
            culture: de
            entries:
              MySuperIngot_Name: Superbarren
              IronIngot_Renamed:
                source: Iron Ingot
                text: Eisenbarren (überarbeitet)
      docs: "features/localization"
    "entries.*":
      summary: "Text of one key."
      description: >-
        The key is the text key inside the namespace. The value is the new text, or a map with
        `source` and `text` to override an existing text. Templates such as `{cfg:...}` work in
        the text.
      type: "string | source/text map"
      examples:
        - title: Plain text
          yaml: |
            type: localization
            namespace: MyPack
            entries:
              MySuperIngot_Desc: A far superior ingot.
      docs: "features/localization#simple-key-entries-new-text"
    "entries.*.source":
      summary: "Original text that is being overridden."
      description: >-
        Has to be byte-identical to the current source string (spacing, punctuation and case
        matter), otherwise the override silently stops matching. Copy it from the game instead of
        retyping it. Without `source` the `text` is also the source, which only works for new keys.
      type: "string"
      examples:
        - title: Override an existing text
          yaml: |
            type: localization
            namespace: MyPack
            culture: de
            entries:
              SchematicOverride:
                source: Super Ingot Smelting
                text: Superbarren-Verhüttung
      docs: "features/localization#source--text-map-overriding-an-existing-text"
    "entries.*.text":
      summary: "Replacement text."
      description: >-
        Required in the map form and must not be empty.
      type: "string"
      required: true
      examples:
        - title: Replacement text
          yaml: |
            type: localization
            namespace: MyPack
            culture: de
            entries:
              IronIngot_Renamed:
                source: Iron Ingot
                text: Eisenbarren (überarbeitet)
      docs: "features/localization#source--text-map-overriding-an-existing-text"

  # ---- type: config (*.config.yml, pack configuration) ---------------------------------------------
  config:
    category:
      summary: "Default category of every field in this file."
      description: >-
        A `UFGCategory` subclass: the bare id of a class generated in the pack, a class path, or
        `/KDataForge/Gen/<PackRef>.Gen_<PackRef>_<Id>`. Settings screens use it as a section
        heading, sorted by the category's `mMenuPriority`. A field's own `category` wins.
      type: "class path | id"
      examples:
        - title: Default category for the file
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: features.enableBonus
                type: boolean
                name: Enable bonus
                description: Turns the bonus recipes on or off.
                default: true
      docs: "features/pack-configuration#categories"
    fields:
      summary: "Settings the pack offers to players."
      description: >-
        A non-empty list of typed fields. Their values are stored in
        `Configs/Packs/<PackRef>.config.yml` and read from other documents through `cfg:`,
        `{cfg:}` and `config:` conditions. A field with an error is skipped; the rest of the
        file still loads. Field ids are unique across all config files of a pack.
      type: "list of fields"
      required: true
      examples:
        - title: One slider setting
          yaml: |
            type: config
            category: SampleBalanceCategory
            fields:
              - id: balance.ironSpeed
                type: number
                valueType: float
                name: Iron smelting speed
                description: How many times faster the Iron Ingot recipe runs.
                default: 2
                min: 0.25
                max: 4
                step: 0.25
                display: slider
                apply: hot
      docs: "features/pack-configuration"
    "fields[].id":
      summary: "Name of the setting, used to read its value."
      description: >-
        Dot-separated segments of letters, digits and `_` that do not start with a digit
        (`balance.ironSpeed`), at most 200 characters. Unique per pack ignoring case; no id may
        be the dotted prefix of another; `true`, `false`, `in` and `contains` are reserved. Dotted
        ids become nested maps in the values file.
      type: "config id"
      required: true
      examples:
        - title: Dotted id
          yaml: |
            type: config
            category: SampleBalanceCategory
            fields:
              - id: balance.ironSpeed
                type: number
                name: Iron smelting speed
                description: How many times faster the Iron Ingot recipe runs.
                default: 2
      docs: "features/pack-configuration#common-field-keys"
    "fields[].type":
      summary: "Kind of setting: text, number, boolean or select."
      description: >-
        Decides which other keys the field accepts and which control a settings screen shows.
        `boolean` cannot be combined with `multiple`.
      type: "text | number | boolean | select"
      required: true
      values: config.type
      examples:
        - title: A checkbox
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: features.enableBonus
                type: boolean
                name: Enable bonus
                description: Turns the bonus recipes on or off.
                default: true
      docs: "features/pack-configuration#field-types-at-a-glance"
    "fields[].valueType":
      summary: "Stored type of the value."
      description: >-
        `text`: `string` (default), `text`, `name` or `tag`. `number`: `int32` (default), `int8`,
        `int16`, `int64`, `uint8`, `float` or `double`. `boolean`: `bool` (default) or `uint8`.
        `select`: any of the text and number types plus `bool` (default `string`).
      type: "value type"
      default: "string (text), int32 (number), bool (boolean), string (select)"
      values: valueType
      examples:
        - title: A float number
          yaml: |
            type: config
            category: SampleBalanceCategory
            fields:
              - id: balance.ratio
                type: number
                valueType: float
                name: Ratio
                description: A free decimal number.
                default: 0.125
      docs: "features/pack-configuration#common-field-keys"
    "fields[].name":
      summary: "Display name of the setting."
      description: >-
        A non-empty string, or the localized form with `key`, `ns` and `source`. Required so
        that every setting is explained in the UI.
      type: "string | localized text"
      required: true
      uses: localizedText
      examples:
        - title: Localized name
          yaml: |
            type: config
            category: SampleBalanceCategory
            fields:
              - id: balance.ironSpeed
                type: number
                name:
                  key: Config_IronSpeed_Name
                  ns: KDFSample
                  source: Iron smelting speed
                description: How many times faster the Iron Ingot recipe runs.
                default: 2
      docs: "features/pack-configuration#localized-names"
    "fields[].description":
      summary: "One or two sentences that explain the setting."
      description: >-
        A non-empty string, or the localized form with `key`, `ns` and `source`. Shown next to the
        control in a settings screen.
      type: "string | localized text"
      required: true
      uses: localizedText
      examples:
        - title: Plain description
          yaml: |
            type: config
            category: SampleBalanceCategory
            fields:
              - id: balance.ironSpeed
                type: number
                name: Iron smelting speed
                description: How many times faster the Iron Ingot recipe runs than in the base game.
                default: 2
      docs: "features/pack-configuration#common-field-keys"
    "fields[].tooltip":
      summary: "Optional hover title and text for the setting."
      description: >-
        A map with `title` and/or `text`, each a string or the localized form. At least one of
        them is needed.
      type: "map"
      examples:
        - title: Tooltip with title and text
          yaml: |
            type: config
            category: SampleBalanceCategory
            fields:
              - id: balance.ironSpeed
                type: number
                name: Iron smelting speed
                description: How many times faster the Iron Ingot recipe runs.
                default: 2
                tooltip:
                  title: Smelting speed
                  text: Values above 1 make the recipe faster.
      docs: "features/pack-configuration#common-field-keys"
    "fields[].tooltip.title":
      summary: "Title line of the tooltip."
      description: >-
        A non-empty string, or the localized form with `key`, `ns` and `source`.
      type: "string | localized text"
      uses: localizedText
      examples:
        - title: Tooltip title
          yaml: |
            type: config
            category: SampleBalanceCategory
            fields:
              - id: balance.ironSpeed
                type: number
                name: Iron smelting speed
                description: How many times faster the Iron Ingot recipe runs.
                default: 2
                tooltip:
                  title: Smelting speed
      docs: "features/pack-configuration#common-field-keys"
    "fields[].tooltip.text":
      summary: "Body text of the tooltip."
      description: >-
        A non-empty string, or the localized form with `key`, `ns` and `source`.
      type: "string | localized text"
      uses: localizedText
      examples:
        - title: Tooltip text
          yaml: |
            type: config
            category: SampleBalanceCategory
            fields:
              - id: balance.ironSpeed
                type: number
                name: Iron smelting speed
                description: How many times faster the Iron Ingot recipe runs.
                default: 2
                tooltip:
                  text: Values above 1 make the recipe faster.
      docs: "features/pack-configuration#common-field-keys"
    "fields[].category":
      summary: "Category of this field, overriding the file default."
      description: >-
        A `UFGCategory` subclass: a bare id of a class generated in the pack, a class path, or
        `/KDataForge/Gen/<PackRef>.Gen_<PackRef>_<Id>`. Required unless the document sets a
        default. An unknown or wrong class is an error and the field is listed under the plain
        `UFGCategory` bucket.
      type: "class path | id"
      required: "yes, unless the document sets `category`"
      examples:
        - title: Field-level category wins over the document default
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: cat.b
                type: boolean
                name: Uses its own category
                description: The field level key wins over the document default.
                category: SampleBalanceCategory
                default: false
      docs: "features/pack-configuration#categories"
    "fields[].default":
      summary: "Value used until the player changes it."
      description: >-
        Has to satisfy the field's type and constraints. A list when `multiple: true`, and for a
        select it must be one of the option values (every element for a multi-select).
      type: "value | list"
      required: true
      examples:
        - title: Default of a list field
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.names
                type: text
                multiple: true
                name: Names
                description: Between one and four names.
                default: [Alpha, Beta]
      docs: "features/pack-configuration#common-field-keys"
    "fields[].apply":
      summary: "Whether a changed value applies live (hot) or after a restart (cold)."
      description: >-
        `hot` values are saved and the content follows within the session after a reload.
        `cold` values are saved, but the running game keeps the value it loaded with and reports
        that a restart is required. Use `hot` for numbers and texts in `properties:` of a patch.
      type: "hot | cold"
      default: cold
      values: apply
      examples:
        - title: A hot setting
          yaml: |
            type: config
            category: SampleBalanceCategory
            fields:
              - id: balance.ironSpeed
                type: number
                name: Iron smelting speed
                description: How many times faster the Iron Ingot recipe runs.
                default: 2
                apply: hot
      docs: "features/pack-configuration#hot-and-cold-values"
    "fields[].order":
      summary: "Sort position of the field inside its category."
      description: >-
        A whole number. Without it the declaration order across the pack's config files (sorted
        by path) is used.
      type: "integer"
      default: "declaration order"
      examples:
        - title: Show this field first
          yaml: |
            type: config
            category: SampleBalanceCategory
            fields:
              - id: balance.ironSpeed
                type: number
                name: Iron smelting speed
                description: How many times faster the Iron Ingot recipe runs.
                default: 2
                order: 1
      docs: "features/pack-configuration#common-field-keys"
    "fields[].multiple":
      summary: "Makes the field a list (text, number) or a multi-select (select)."
      description: >-
        With `multiple: true` the `default` is a list. Not allowed for `boolean`. A list holds at
        most 64 entries; bound it with `minCount`/`maxCount`, or `minSelected`/`maxSelected` for a
        select.
      type: "bool"
      default: false
      examples:
        - title: A list of names
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.names
                type: text
                multiple: true
                minCount: 1
                maxCount: 4
                name: Names
                description: Between one and four names.
                default: [Alpha, Beta]
      docs: "features/pack-configuration#common-field-keys"
    "fields[].min":
      summary: "Smallest allowed number."
      description: >-
        A whole number for integer types. It has to be at most `max`. For a number list it
        applies to every element, and values outside the range are clamped.
      type: "number"
      examples:
        - title: Count between 1 and 100
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.count
                type: number
                name: Count
                description: A whole number.
                default: 10
                min: 1
                max: 100
      docs: "features/pack-configuration#numbers"
    "fields[].max":
      summary: "Largest allowed number."
      description: >-
        A whole number for integer types. It has to be at least `min`. For a number list it
        applies to every element, and values outside the range are clamped.
      type: "number"
      examples:
        - title: Count between 1 and 100
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.count
                type: number
                name: Count
                description: A whole number.
                default: 10
                min: 1
                max: 100
      docs: "features/pack-configuration#numbers"
    "fields[].step":
      summary: "Step size of the number control."
      description: >-
        Greater than 0, and a whole number for integer types. Without `decimals` its digits
        decide how many decimals are shown and stored.
      type: "number"
      examples:
        - title: Quarter steps
          yaml: |
            type: config
            category: SampleBalanceCategory
            fields:
              - id: balance.ironSpeed
                type: number
                valueType: float
                name: Iron smelting speed
                description: How many times faster the Iron Ingot recipe runs.
                default: 2
                min: 0.25
                max: 4
                step: 0.25
      docs: "features/pack-configuration#numbers"
    "fields[].decimals":
      summary: "Number of fractional digits shown and stored."
      description: >-
        0 to 9. Without it the digits of `step` are used, otherwise 4 for `float` and 6 for
        `double`.
      type: "integer"
      examples:
        - title: Two decimals
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.speed
                type: number
                valueType: float
                name: Speed
                description: A slider with a step.
                default: 1
                min: 0.25
                max: 4
                step: 0.25
                decimals: 2
      docs: "features/pack-configuration#numbers"
    "fields[].display":
      summary: "Control shown for a number: slider or input."
      description: >-
        `slider` needs `min` and `max` with `min < max` and cannot be combined with `multiple`.
        Without `display`, a field with both bounds is a slider and any other number field is a
        plain input.
      type: "slider | input"
      values: display
      examples:
        - title: A free input
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.ratio
                type: number
                valueType: double
                display: input
                name: Ratio
                description: A free decimal number.
                default: 0.125
                decimals: 3
      docs: "features/pack-configuration#numbers"
    "fields[].multiline":
      summary: "Shows a multi-line text box."
      description: >-
        Only valid for a `text` field with `valueType: text`.
      type: "bool"
      examples:
        - title: A multi-line text
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.motto
                type: text
                valueType: text
                multiline: true
                maxLength: 200
                name: Motto
                description: A longer text that can span several lines.
                default: Forged from YAML.
      docs: "features/pack-configuration#text-tags-and-selections"
    "fields[].maxLength":
      summary: "Longest text a player can enter."
      description: >-
        1 to 1024, default 1024. Typing more characters than this is rejected.
      type: "integer"
      default: 1024
      examples:
        - title: At most 40 characters
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.title
                type: text
                maxLength: 40
                name: Title
                description: A short single-line text.
                default: Hello
      docs: "features/pack-configuration#text-tags-and-selections"
    "fields[].tagRoot":
      summary: "Gameplay tag below which tag values must lie."
      description: >-
        For a `text` field with `valueType: tag`. Only tags below this root are accepted. The
        tags do not need to be registered when the value is read, so a pack can offer tags that
        its own `gametag` document registers.
      type: "gameplay tag"
      examples:
        - title: Tags below KDF.Sample
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.marker
                type: text
                valueType: tag
                tagRoot: KDF.Sample
                name: Marker tag
                description: Pick one tag below KDF.Sample.
                default: KDF.Sample.Test
      docs: "features/pack-configuration#text-tags-and-selections"
    "fields[].options":
      summary: "Choices of a select field."
      description: >-
        At least one `{value, label}` entry. Values are unique and of the field's `valueType`.
        Text and option values are compared case-sensitively.
      type: "list of options"
      required: "yes, for `type: select`"
      examples:
        - title: A difficulty choice
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.difficulty
                type: select
                name: Difficulty
                description: Exactly one option.
                default: easy
                options:
                  - value: easy
                    label: Easy
                  - value: hard
                    label: Hard
      docs: "features/pack-configuration#text-tags-and-selections"
    "fields[].options[].value":
      summary: "Stored value of the option."
      description: >-
        A string, number or boolean of the field's `valueType`, unique among the options.
      type: "scalar"
      required: true
      examples:
        - title: Numeric option values
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.tier
                type: select
                valueType: int32
                name: Tier
                description: A numeric choice.
                default: 2
                options:
                  - { value: 1, label: Tier 1 }
                  - { value: 2, label: Tier 2 }
      docs: "features/pack-configuration#text-tags-and-selections"
    "fields[].options[].label":
      summary: "Text shown for the option."
      description: >-
        A string, or the localized form with `key`, `ns` and `source`.
      type: "string | localized text"
      required: true
      uses: localizedText
      examples:
        - title: Localized label
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.difficulty
                type: select
                name: Difficulty
                description: Exactly one option.
                default: easy
                options:
                  - value: easy
                    label: Easy
                  - value: hard
                    label:
                      key: Demo_Hard
                      ns: KDFSample
                      source: Hard
      docs: "features/pack-configuration#localized-names"
    "fields[].minSelected":
      summary: "Fewest options a multi-select must have chosen."
      description: >-
        Only with `multiple: true`. At most the number of options.
      type: "integer"
      examples:
        - title: Pick at least one tier
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.enabledTiers
                type: select
                valueType: int32
                multiple: true
                minSelected: 1
                name: Enabled tiers
                description: Pick one or two tiers.
                default: [1, 2]
                options:
                  - { value: 1, label: Tier 1 }
                  - { value: 2, label: Tier 2 }
                  - { value: 3, label: Tier 3 }
      docs: "features/pack-configuration#text-tags-and-selections"
    "fields[].maxSelected":
      summary: "Most options a multi-select may have chosen."
      description: >-
        Only with `multiple: true`. Not below `minSelected` and at most 64.
      type: "integer"
      examples:
        - title: Pick at most two tiers
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.enabledTiers
                type: select
                valueType: int32
                multiple: true
                maxSelected: 2
                name: Enabled tiers
                description: Pick one or two tiers.
                default: [1, 2]
                options:
                  - { value: 1, label: Tier 1 }
                  - { value: 2, label: Tier 2 }
                  - { value: 3, label: Tier 3 }
      docs: "features/pack-configuration#text-tags-and-selections"
    "fields[].minCount":
      summary: "Fewest entries a list field must hold."
      description: >-
        For `text` and `number` fields with `multiple: true`. At most 64.
      type: "integer"
      examples:
        - title: At least one name
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.names
                type: text
                multiple: true
                minCount: 1
                name: Names
                description: At least one name.
                default: [Alpha]
      docs: "features/pack-configuration#text-tags-and-selections"
    "fields[].maxCount":
      summary: "Most entries a list field may hold."
      description: >-
        For `text` and `number` fields with `multiple: true`. A list without `maxCount` holds at
        most 64 entries.
      type: "integer"
      default: 64
      examples:
        - title: At most four names
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.names
                type: text
                multiple: true
                maxCount: 4
                name: Names
                description: Up to four names.
                default: [Alpha, Beta]
      docs: "features/pack-configuration#text-tags-and-selections"
    "fields[].descriptionClass":
      summary: "Reserved for a later version."
      description: >-
        The schema accepts it, the editor reports it as a reserved key and the runtime ignores
        it.
      type: "class path"
      examples:
        - title: Reserved key (ignored)
          partial: true
          yaml: |
            descriptionClass: /Game/SomeMod/BP_Description.BP_Description_C
      docs: "features/pack-configuration#common-field-keys"
    "fields[].properties":
      summary: "Reserved for a later version."
      description: >-
        Accepted by the schema and ignored with a warning.
      type: "any"
      examples:
        - title: Reserved key (ignored)
          partial: true
          yaml: |
            properties: {}
      docs: "features/pack-configuration#common-field-keys"

  # ---- pack.yml ------------------------------------------------------------------------------
  pack:
    "scripts":
      summary: "Explicit runtime script entries."
      description: "Scripts run only when declared. Runtime generates IDs from pack ref and entry; capabilities belong in TypeScript meta."
      type: "list of script entries"
      examples:
        - title: Runtime script manifest fragment
          partial: true
          yaml: "scripts: [{language: kmods.typescript, entry: scripts/main.ts}]"
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    "scripts[].language":
      summary: "Registered script language."
      description: "Language IDs contain dot-separated ASCII identifier segments. KDataForgeJS registers kmods.typescript."
      type: "string"
      examples:
        - title: Runtime script manifest fragment
          partial: true
          yaml: "language: kmods.typescript"
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    "scripts[].languageVersion":
      summary: "Registered language ABI version."
      description: "Positive uint32 version, default 1. The language provider must support it."
      type: "integer"
      examples:
        - title: Runtime script manifest fragment
          partial: true
          yaml: "languageVersion: 1"
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    "scripts[].entry":
      summary: "Pack-relative entry source path."
      description: "Portable relative path without traversal or device names. KDataForgeJS requires scripts/main.ts."
      type: "file path"
      examples:
        - title: Runtime script manifest fragment
          partial: true
          yaml: "entry: scripts/main.ts"
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    "scripts[].realm":
      summary: "Realm execution policy."
      description: "Accepts any, server or client; defaults to any."
      type: "string"
      examples:
        - title: Runtime script manifest fragment
          partial: true
          yaml: "realm: any"
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    "scripts[].network":
      summary: "Network execution policy."
      description: "Accepts any, standalone or networked; defaults to any."
      type: "string"
      examples:
        - title: Runtime script manifest fragment
          partial: true
          yaml: "network: any"
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    "scripts[].authority":
      summary: "Authority execution policy."
      description: "Accepts any, required or forbidden; defaults to any."
      type: "string"
      examples:
        - title: Runtime script manifest fragment
          partial: true
          yaml: "authority: any"
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    "scripts[].reflectionClasses":
      summary: "Explicit reflected class allowlist."
      description: "At most 64 unique class paths. Cannot coexist with the classes alias."
      type: "list of class paths"
      examples:
        - title: Runtime script manifest fragment
          partial: true
          yaml: "reflectionClasses: [/Script/Engine.Actor]"
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    "scripts[].classes":
      summary: "Alias of reflectionClasses."
      description: "Uses the same class path rules; cannot coexist with reflectionClasses."
      type: "list of class paths"
      examples:
        - title: Runtime script manifest fragment
          partial: true
          yaml: "classes: [/Script/Engine.Actor]"
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    "scripts[].imports":
      summary: "Manifest-authorized static imports."
      description: "At most 64 declarations. Keys and portable case-folded paths must be unique."
      type: "list of import declarations"
      examples:
        - title: Runtime script manifest fragment
          partial: true
          yaml: "imports: []"
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    "scripts[].imports[].key":
      summary: "Static import lookup key."
      description: "ASCII key beginning with a letter; slashes cannot repeat or trail. Maximum 128 bytes."
      type: "string"
      examples:
        - title: Runtime script manifest fragment
          partial: true
          yaml: "key: starter-text"
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    "scripts[].imports[].kind":
      summary: "Runtime import kind."
      description: "Accepts yaml, structured, text, binary, image or audio."
      type: "string"
      examples:
        - title: Runtime script manifest fragment
          partial: true
          yaml: "kind: text"
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    "scripts[].imports[].path":
      summary: "Pack-relative import path."
      description: "Portable relative path, at most 1024 bytes and 32 segments. Runtime verifies imported bytes against the declared digest."
      type: "file path"
      examples:
        - title: Runtime script manifest fragment
          partial: true
          yaml: "path: example.txt"
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    "scripts[].imports[].sha256":
      summary: "Expected import SHA-256."
      description: "64 hexadecimal digits. Runtime requires an exact digest match before authorizing the imported bytes."
      type: "string"
      examples:
        - title: Runtime script manifest fragment
          partial: true
          yaml: "sha256: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'"
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    "scripts[].imports[].digest":
      summary: "Alias of sha256."
      description: "Used when sha256 is absent. Requires 64 hexadecimal digits."
      type: "string"
      examples:
        - title: Runtime script manifest fragment
          partial: true
          yaml: "digest: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'"
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    ref:
      summary: "Stable reference of the pack."
      description: >-
        The save-persistence contract: generated classes are named `Gen_<PackRef>_<Id>` and
        values files are named after it. Prefer an explicit ref, because moving the pack root
        otherwise changes the implicit one. A pack that defines configuration needs a ref of at
        most 50 characters. Letters, digits, `_`, `.` and `-`, starting with a letter.
      type: "pack ref"
      required: true
      examples:
        - title: Minimal manifest
          yaml: |
            ref: MyBalancePack
            name: My Balance Pack
            version: 1.2.0
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    name:
      summary: "Display name of the pack."
      description: >-
        Display name of the pack. The runtime falls back to the ref when it is missing; the
        linter schema still asks for it.
      type: "string | localized text"
      uses: localizedText
      required: true
      examples:
        - title: Pack name
          yaml: |
            ref: MyBalancePack
            name: My Balance Pack
            version: 1.2.0
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    description:
      summary: "Short player-facing summary of the pack."
      description: >-
        A string, or the localized form with `key`, `ns` and `source`. The runtime reads it as the
        pack description for settings screens; KPatchwork also uses it on the generated mod page.
      type: "string | localized text"
      uses: localizedText
      examples:
        - title: Plain description
          yaml: |
            ref: MyBalancePack
            name: My Balance Pack
            version: 1.2.0
            description: Rebalances the smelter recipes.
      docs: "features/pack-configuration#pack-name-description-and-icon"
    icon:
      summary: "Icon shown next to the pack in settings screens."
      description: >-
        A pack-relative `png`, `jpg`, `jpeg`, `tga` or `bmp` file that must stay inside the pack
        folder, or the object path of a `UTexture2D` starting with `/`. At most 16 MB and
        4096 x 4096 pixels; larger images are rejected. Skipped on dedicated servers.
      type: "file path | texture path"
      examples:
        - title: Icon file next to the manifest
          partial: true
          yaml: |
            ref: MyBalancePack
            name: My Balance Pack
            version: 1.2.0
            icon: mod-logo.png
      docs: "features/pack-configuration#pack-name-description-and-icon"
    version:
      summary: "Semantic version of the pack."
      description: >-
        `major.minor.patch`, optionally with a pre-release or build suffix (`1.2.0-beta.1`).
        Informational, and used by conflict reports.
      type: "semver"
      required: true
      examples:
        - title: Pre-release version
          yaml: |
            ref: MyBalancePack
            name: My Balance Pack
            version: 1.3.0-beta.1
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    contributer:
      summary: "GitHub login (or list of logins) that owns the pack in KPatchwork."
      description: >-
        Repository ownership metadata, spelled exactly this way. KPatchwork's policy linter
        requires it; the KDataForge runtime does not. A single login or a list of unique logins.
      type: "login | list"
      required: "only for KPatchwork packs"
      examples:
        - title: Two maintainers
          yaml: |
            ref: MyTweaks
            name: My Tweaks
            version: 1.0.0
            contributer:
              - your-github-login
              - co-maintainer
      docs: "lint-your-pack#kpatchwork-policy-fields"
    priority:
      summary: "Load order among packs: higher applies earlier in each stage."
      description: >-
        A 32-bit integer. Among packs whose dependencies are ready, higher priority runs first
        and the pack ref (ascending) breaks ties. Documents have no priority of their own.
      type: "integer"
      default: 100
      examples:
        - title: Apply before default packs
          yaml: |
            ref: MyOverhaul
            name: My Overhaul Pack
            version: 2.1.0
            priority: 200
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    enabled:
      summary: "Switches the whole pack on or off."
      description: >-
        `false` disables the pack without deleting it.
      type: "bool"
      default: true
      examples:
        - title: Disabled pack
          yaml: |
            ref: MyOverhaul
            name: My Overhaul Pack
            version: 2.1.0
            enabled: false
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    debug:
      summary: "Logs every operation of every document in the pack."
      description: >-
        Like `debug: true` on a document, for the whole pack. Each applied operation is written
        to the game log.
      type: "bool"
      default: false
      examples:
        - title: Trace the whole pack
          yaml: |
            ref: MyOverhaul
            name: My Overhaul Pack
            version: 2.1.0
            debug: true
      docs: "reference/yaml-schema#debug-logging"
    conditions:
      summary: "Gates the whole pack."
      description: >-
        Same grammar and evaluator as a document's `conditions`, evaluated once before any file
        of the pack is read. A failing pack is skipped with a single Info diagnostic. Use it for
        "this pack is a compat layer for mod X" instead of repeating the condition in every
        document. A `config:` condition works here; use a cold field.
      type: "condition object | list"
      examples:
        - title: Only with RefinedPower 4 or newer
          yaml: |
            ref: MyRefinedPowerAddon
            name: My RefinedPower Addon
            version: 1.0.0
            conditions:
              hasMod: RefinedPower@>=4.0.0
      docs: "features/conditions-and-packs#packyml-conditions-gating-a-whole-pack"
    dependencies:
      summary: "Packs that have to load before this one."
      description: >-
        Pack refs. A missing, self-referencing or already invalid dependency rejects the pack, and
        the rejection spreads to dependants. Dependency cycles are rejected.
      type: "list of pack refs"
      examples:
        - title: Load after another pack
          yaml: |
            ref: MyOverhaul
            name: My Overhaul Pack
            version: 2.1.0
            dependencies:
              - KDFSample
      docs: "features/conditions-and-packs#packyml-the-pack-manifest"
    redirects:
      summary: "Maps renamed generated ids to their new ids."
      description: >-
        Generated class names are id-based, so renaming an `id` would orphan saved data. A redirect
        makes class paths of the old id in existing saves resolve to the renamed class. Renaming a
        file never needs a redirect.
      type: "map of old id to new id"
      examples:
        - title: Rename MySuperIngot
          yaml: |
            ref: MyOverhaul
            name: My Overhaul Pack
            version: 3.0.0
            redirects:
              MySuperIngot: SuperIngotMk2
      docs: "features/conditions-and-packs#redirects-renaming-generated-content-ids"
    "redirects.*":
      summary: "New id for the old id named by the key."
      description: >-
        The key is the old generated id and the value is the id that replaces it. The class
        path of the old id then resolves to the new class.
      type: "id"
      examples:
        - title: Old id to new id
          yaml: |
            ref: MyOverhaul
            name: My Overhaul Pack
            version: 3.0.0
            redirects:
              OldItemId: NewItemId
      docs: "features/conditions-and-packs#redirects-renaming-generated-content-ids"

  # ---- type: recipe ---------------------------------------------------------------------------
  recipe:
    recipes:
      summary: "Recipes to generate or register."
      description: >-
        Each entry either generates a new `FGRecipe` class (`id`) or registers an existing one
        (`class`). Recipes can reference every item, resource, building and unlock generated by the
        Items stage. A document may hold only `remove:` entries. Changes need a restart.
      type: "list of recipe entries"
      required: "yes, unless `remove` is given"
      uses: registerableEntry
      examples:
        - title: A recipe for a generated item
          yaml: |
            type: recipe
            recipes:
              - id: Recipe_MySuperIngot
                properties:
                  - path: mIngredients
                    value:
                      - ItemClass: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                        Amount: 2
                  - path: mProduct
                    value:
                      - ItemClass: MySuperIngot
                        Amount: 1
                  - path: mManufactoringDuration
                    value: 4
                  - path: mProducedIn
                    value:
                      - /Game/FactoryGame/Buildable/Factory/SmelterMk1/Build_SmelterMk1.Build_SmelterMk1_C
      docs: "features/recipes"
    "recipes[].parent":
      summary: "Recipe class the new recipe is derived from."
      description: >-
        Defaults to `/Script/FactoryGame.FGRecipe`, which is also the required base class. Only
        used with `id`.
      type: "class path"
      default: "/Script/FactoryGame.FGRecipe"
      examples:
        - title: Derive from the Iron Plate recipe
          yaml: |
            type: recipe
            recipes:
              - id: Recipe_GatedPlate
                parent: /Game/FactoryGame/Recipes/Constructor/Recipe_IronPlate.Recipe_IronPlate_C
      docs: "features/recipes"
    remove:
      summary: "Recipes to take out of the game."
      description: >-
        Each entry is a class reference (full path, bare class name or generated id) that removes
        exactly that class, or a filter map using `matchTag`, `matchName`, `producedIn`,
        `ingredient`, `product` and `where` (scope `FGRecipe`). Filters are re-checked on every
        recipe grant, so late-loading recipes are covered. Removal never revokes schematic
        purchases.
      type: "list of class references | filter maps"
      uses: scopeFilters
      examples:
        - title: Remove one recipe and every alternate recipe
          yaml: |
            type: recipe
            remove:
              - /Game/FactoryGame/Recipes/Constructor/Recipe_IronPlate.Recipe_IronPlate_C
              - matchName: Recipe_Alternate_*
      docs: "features/removing-content#recipes"

  # ---- type: research / mam ---------------------------------------------------------------------
  research:
    research:
      summary: "M.A.M. research trees to generate, register or edit."
      description: >-
        Each entry generates a `UFGResearchTree` class (`id`) or registers an existing one
        (`class`) and can place schematics into its visual graph with `addNodes`. `type: mam` is an
        alias. A document may hold only `remove:` entries. Changes need a restart.
      type: "list of research entries"
      required: "yes, unless `remove` is given"
      uses: registerableEntry
      examples:
        - title: A new research tree
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
                properties:
                  - path: mDisplayName
                    value: My Content Line
                  - path: mMenuPriority
                    value: 50
      docs: "features/research-trees"
    "research[].parent":
      summary: "Research tree class the new tree is derived from."
      description: >-
        Defaults to `/Script/FactoryGame.FGResearchTree`, which is also the required base class.
        Only used with `id`.
      type: "class path"
      default: "/Script/FactoryGame.FGResearchTree"
      examples:
        - title: Derive from an existing tree
          yaml: |
            type: research
            research:
              - id: MyMyceliaTree
                parent: /Game/FactoryGame/Schematics/Research/Mycelia_RS/ResearchTree_Mycelia.ResearchTree_Mycelia_C
      docs: "features/research-trees"
    "research[].unlockDependencies":
      summary: "Dependencies appended to the tree's `mUnlockDependencies`."
      description: >-
        Instanced `FGAvailabilityDependency` objects with `class` and `properties`. They decide
        when the tree can be unlocked.
      type: "list of instanced objects"
      uses: instancedObject
      examples:
        - title: Unlock after a schematic is purchased
          yaml: |
            type: research
            research:
              - id: MyResearchTree
                unlockDependencies:
                  - class: /Script/FactoryGame.FGSchematicPurchasedDependency
                    properties:
                      - path: mSchematics
                        value:
                          - Schematic_MyPrerequisite
      docs: "reference/yaml-schema#instanced-dependencies-on-research-trees"
    "research[].visibilityDependencies":
      summary: "Dependencies appended to the tree's `mVisibilityDependencies`."
      description: >-
        Instanced `FGAvailabilityDependency` objects with `class` and `properties`. They decide
        when the tree becomes visible.
      type: "list of instanced objects"
      uses: instancedObject
      examples:
        - title: Visible from a game phase on
          yaml: |
            type: research
            research:
              - id: MyResearchTree
                visibilityDependencies:
                  - class: /Script/FactoryGame.FGGamePhaseReachedDependency
                    properties:
                      - path: mGamePhase
                        value: EGP_EarlyGame
      docs: "reference/yaml-schema#instanced-dependencies-on-research-trees"
    "research[].autoPath":
      summary: "Draws straight roads for the `parents` relationships of added nodes."
      description: >-
        When on, each resolved `parents` reference of an added node gets a straight two-point
        visual road. Leave it off and give the parent `childrenAndRoads` for custom routes.
      type: "bool"
      default: false
      examples:
        - title: Automatic roads
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
                autoPath: true
                addNodes:
                  - schematic: Schematic_First
                    coordinate:
                      X: 0
                      Y: 0
                  - schematic: Schematic_Second
                    coordinate:
                      X: 2
                      Y: 0
                    parents:
                      - schematic: Schematic_First
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"
    "research[].addNodes":
      summary: "Nodes appended to the tree's graph."
      description: >-
        Appends node instances; it does not update or deduplicate an existing node with the same
        schematic. A usable node supplies `schematic` and `coordinate`. To move a node, remove it
        with `removeNodes` and add it again.
      type: "list of nodes"
      uses: researchNode
      examples:
        - title: Two nodes
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
                addNodes:
                  - schematic: Schematic_First
                    coordinate:
                      X: 0
                      Y: 0
                  - schematic: Schematic_Second
                    coordinate:
                      X: 2
                      Y: 0
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"
    "research[].nodes":
      summary: "Legacy alias of `addNodes`."
      description: >-
        If both `nodes` and `addNodes` exist, `addNodes` wins and KDataForge warns that `nodes`
        was ignored.
      type: "list of nodes"
      uses: researchNode
      examples:
        - title: Legacy spelling
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
                nodes:
                  - schematic: Schematic_First
                    coordinate:
                      X: 0
                      Y: 0
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"
    "research[].removeNodes":
      summary: "Nodes to remove from the tree by schematic."
      description: >-
        Each entry is a schematic class or id, or a map with `schematic`. Removals run before the
        same entry's `addNodes` and also delete every `Parents`, `NodesToUnhide`, `UnhiddenBy` and
        `ChildrenAndRoads` reference to the removed coordinate.
      type: "list of schematic references"
      examples:
        - title: Replace a node
          yaml: |
            type: research
            research:
              - class: /Game/FactoryGame/Schematics/Research/Mycelia_RS/ResearchTree_Mycelia.ResearchTree_Mycelia_C
                register: false
                removeNodes:
                  - Schematic_Obsolete
                addNodes:
                  - schematic: Schematic_Replacement
                    coordinate:
                      X: 3
                      Y: 1
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"
    "research[].removeNodes[].schematic":
      summary: "Schematic whose node is removed."
      description: >-
        A generated short id or a schematic class path. A bare scalar entry means the same.
      type: "schematic id | class path"
      required: true
      examples:
        - title: Map form
          yaml: |
            type: research
            research:
              - class: /Game/FactoryGame/Schematics/Research/Mycelia_RS/ResearchTree_Mycelia.ResearchTree_Mycelia_C
                register: false
                removeNodes:
                  - schematic: Schematic_Obsolete
      docs: "reference/yaml-schema#nodes-placing-a-schematic-in-a-research-tree"
    remove:
      summary: "Research trees to take out of the game."
      description: >-
        Each entry is a class reference that removes exactly that tree, or a filter map using
        the scope filters (scope `FGResearchTree`). Removal is save-clean and reverses on the next
        session after the pack is removed; existing unlock state is not revoked.
      type: "list of class references | filter maps"
      uses: scopeFilters
      examples:
        - title: Remove a tree by name
          yaml: |
            type: research
            remove:
              - matchName: ResearchTree_Obsolete*
      docs: "features/removing-content#research-trees"

  # ---- type: resource ------------------------------------------------------------------------------
  resource:
    resources:
      summary: "New resource descriptor classes to generate."
      description: >-
        Each entry creates a `UFGResourceDescriptor`-derived class. A resource descriptor alone
        does not place nodes in the world or make the resource scannable.
      type: "list of resource entries"
      required: true
      uses: generatedEntry
      examples:
        - title: A new ore
          yaml: |
            type: resource
            resources:
              - id: MyCustomOre
                parent: /Game/FactoryGame/Resource/RawResources/OreIron/Desc_OreIron.Desc_OreIron_C
                properties:
                  - path: mDisplayName
                    value: Custom Ore
      docs: "features/resources"
    "resources[].parent":
      summary: "Resource descriptor class the new resource copies from."
      description: >-
        Defaults to `/Script/FactoryGame.FGResourceDescriptor`, which is also the required base
        class.
      type: "class path"
      default: "/Script/FactoryGame.FGResourceDescriptor"
      examples:
        - title: Derive from Iron Ore
          yaml: |
            type: resource
            resources:
              - id: MyCustomOre
                parent: /Game/FactoryGame/Resource/RawResources/OreIron/Desc_OreIron.Desc_OreIron_C
      docs: "features/resources"

  # ---- type: resourcenode --------------------------------------------------------------------------
  resourcenode:
    visuals:
      summary: "Continuously overrides material slots on meshes of existing resource nodes."
      description: >-
        A non-empty list of exact resource descriptor identities and material slot mappings.
        Resource deposits are excluded. Existing, newly spawned and streamed mesh actors are handled
        on server and clients; pairing may be deferred. Later documents replace earlier mappings
        for the same descriptor. Disabling or reloading rules restores saved instance baselines.
      type: "list"
      examples:
        - title: "Override iron node material"
          yaml: |
            type: resourcenode
            visuals:
              - resource: /Game/FactoryGame/Resource/RawResources/OreIron/Desc_OreIron.Desc_OreIron_C
                materials:
                  - slot: 0
                    material: /MyMod/Materials/MI_Node.MI_Node
      docs: "features/resource-node-visuals"
    "visuals[].resource":
      summary: "Exact resource descriptor class of the live linked node."
      description: "Must derive from FGResourceDescriptor. Subclasses are not expanded; duplicate resources in one document are rejected."
      type: "resource class"
      required: "yes"
      examples:
        - title: "Choose a descriptor"
          partial: true
          yaml: |
            resource: /Game/FactoryGame/Resource/RawResources/OreIron/Desc_OreIron.Desc_OreIron_C
      docs: "features/resource-node-visuals"
    "visuals[].materials":
      summary: "Non-empty list of explicit component material slot assignments."
      description: "Each slot may occur once per descriptor. Materials must resolve to cooked UMaterialInterface assets."
      type: "list"
      required: "yes"
      examples:
        - title: "Assign material slots"
          partial: true
          yaml: |
            materials:
              - slot: 0
                material: /MyMod/Materials/MI_Node.MI_Node
      docs: "features/resource-node-visuals"
    "visuals[].materials[].slot":
      summary: "Zero-based static mesh component material slot, from 0 through 63."
      description: "Write an integer number; quoted numbers and duplicate slots are rejected. Unlisted slots remain untouched."
      type: "integer"
      required: "yes"
      examples:
        - title: "First material slot"
          partial: true
          yaml: |
            slot: 0
      docs: "features/resource-node-visuals"
    "visuals[].materials[].material":
      summary: "Material or material-instance asset path assigned to this slot."
      description: "Use an object asset path without a generated-class _C suffix. The asset must be cooked and available on every peer."
      type: "material asset"
      required: "yes"
      examples:
        - title: "Use a material instance"
          partial: true
          yaml: |
            material: /MyMod/Materials/MI_Node.MI_Node
      docs: "features/resource-node-visuals"
    hideMeshes:
      summary: "Hides matching resource mesh actors and disables their actor collision."
      description: >-
        Non-empty list of exact UStaticMesh asset paths. No node pairing is needed; hides take
        precedence over material mappings and also apply to meshes linked to deposits. Rules from
        active documents are combined. Nodes themselves are not destroyed.
      type: "list of static mesh assets"
      examples:
        - title: "Hide a mesh asset"
          yaml: |
            type: resourcenode
            hideMeshes:
              - /MyMod/ResourceNodes/SM_OldNode.SM_OldNode
      docs: "features/resource-node-visuals"
    meshActorsPerTick:
      summary: "Budget for pending mesh resolution and round-robin maintenance."
      description: >-
        Integer in [1,1024], default 1. At most this many waiting meshes and tracked meshes are
        processed per tick, plus one resource-node lookup. The last explicitly configured budget wins.
        Requires visuals or hideMeshes in the same document.
      type: "integer"
      default: 1
      examples:
        - title: "Limit work per tick"
          partial: true
          yaml: |
            meshActorsPerTick: 1
      docs: "features/resource-node-visuals"
    remove:
      summary: "Resource nodes to purge from the world."
      description: >-
        A non-empty list. A scalar is a resource descriptor class, a map adds options, and a map
        with an `ofClass` scope and filters selects every loaded descriptor that passes. Valid
        entries still apply when another entry reports an error. Saves can persist level-placed
        node destruction, so back up the save first.
      type: "list of resources | maps"
      required: "yes, unless add, replace, visuals or hideMeshes is provided"
      uses: scopeFilters
      examples:
        - title: Remove uranium nodes
          yaml: |
            type: resourcenode
            remove:
              - /Game/FactoryGame/Resource/RawResources/Uranium/Desc_OreUranium.Desc_OreUranium_C
      docs: "features/resources#removing-resource-nodes-type-resourcenode"
    "remove[].resource":
      summary: "Resource descriptor whose nodes are removed."
      description: >-
        Has to resolve to a `UFGResourceDescriptor` class; generated short ids work. Instead of
        `resource` an entry can carry an `ofClass` scope with filters.
      type: "class path | id"
      examples:
        - title: Generated resource, selected node types
          yaml: |
            type: resourcenode
            remove:
              - resource: MyGeneratedResource
                nodeTypes: [Node, FrackingCore]
      docs: "features/resources#removing-resource-nodes-type-resourcenode"
    "remove[].nodeTypes":
      summary: "Node types the removal is limited to."
      description: >-
        `Node`, `FrackingSatellite`, `FrackingCore`, `Geyser` and `Deposit`, with or without the
        `EResourceNodeType::` prefix. Omitted or empty means all types.
      type: "list of node types"
      values: nodeType
      examples:
        - title: Only plain nodes
          yaml: |
            type: resourcenode
            remove:
              - resource: MyGeneratedResource
                nodeTypes: [Node]
      docs: "features/resources#removing-resource-nodes-type-resourcenode"
    "remove[].allowOccupied":
      summary: "Also removes node groups an extractor is built on."
      description: >-
        By default node groups used by an extractor are skipped with a warning. `true` removes them
        anyway, which can invalidate the extractor's node reference.
      type: "bool"
      default: false
      examples:
        - title: Remove even occupied nodes
          yaml: |
            type: resourcenode
            remove:
              - resource: MyGeneratedResource
                allowOccupied: true
      docs: "features/resources#removing-resource-nodes-type-resourcenode"
    "remove[].removeFromScanner":
      summary: "Also removes the resource from vanilla scanner pairs and KAPI allow-lists."
      description: >-
        Strips vanilla scanner pairs and matching KAPI allow-list data, then refreshes the
        scanner and radar caches.
      type: "bool"
      default: true
      examples:
        - title: Keep scanner entries
          yaml: |
            type: resourcenode
            remove:
              - resource: MyGeneratedResource
                removeFromScanner: false
      docs: "features/resources#removing-resource-nodes-type-resourcenode"

  # ---- type: schematic -------------------------------------------------------------------------------
    add:
      summary: "Adds ordinary resource nodes with stable pack-qualified identities."
      description: "A nearby eligible ordinary node may be reused; otherwise a new node and separate native mesh actor are created."
      type: "list"
      examples:
        - title: "Configure add"
          partial: true
          yaml: |
            add:
              - id: northern-iron
                resource: /Game/FactoryGame/Resource/RawResources/OreIron/Desc_OreIron.Desc_OreIron_C
                position: [10000, 20000, 1200]
      uses: nodePlacement
      docs: "features/resource-node-placement"
    replace:
      summary: "Replaces a nearby unoccupied ordinary resource node in place."
      description: "Replacement requires a nearby eligible ordinary node and creates no node when none matches."
      type: "list"
      examples:
        - title: "Configure replace"
          partial: true
          yaml: |
            replace:
              - id: northern-iron
                resource: /Game/FactoryGame/Resource/RawResources/OreIron/Desc_OreIron.Desc_OreIron_C
                position: [10000, 20000, 1200]
      uses: nodePlacement
      docs: "features/resource-node-placement"
    "replace[].fromResource":
      summary: "Optional exact original resource descriptor required for replacement."
      description: "Compares the original descriptor when selecting an existing node; omission accepts any descriptor."
      type: "resource class"
      examples:
        - title: "Configure fromResource"
          partial: true
          yaml: |
            fromResource: /Game/FactoryGame/Resource/RawResources/OreIron/Desc_OreIron.Desc_OreIron_C
      docs: "features/resource-node-placement"
    "replace[].radius":
      summary: "Legacy replacement spelling of checkRange; cannot combine both."
      description: "Accepted only on replacement entries. Specify this alias or checkRange, never both."
      type: "number"
      examples:
        - title: "Configure radius"
          partial: true
          yaml: |
            radius: 500
      docs: "features/resource-node-placement"
    "add[].reuseExisting":
      summary: "Reuse a nearby ordinary node before spawning; default true."
      description: "Disable reuse to require a new addition; separate overlap prevention can still reject the location."
      type: "boolean"
      examples:
        - title: "Configure reuseExisting"
          partial: true
          yaml: |
            reuseExisting: false
      docs: "features/resource-node-placement"

  schematic:
    schematics:
      summary: "Schematics (milestones, MAM research, upgrades) to generate or register."
      description: >-
        Each entry generates a new `FGSchematic` class (`id`) or registers an existing one
        (`class`). Schematics apply after recipes, so they can unlock recipes generated in the
        same pack. A document may hold only `remove:` entries. Changes need a restart.
      type: "list of schematic entries"
      required: "yes, unless `remove` is given"
      uses: registerableEntry
      examples:
        - title: A milestone that unlocks a recipe
          yaml: |
            type: schematic
            schematics:
              - id: Schematic_MySuperIngot
                properties:
                  - path: mDisplayName
                    value: Super Ingot Smelting
                  - path: mTechTier
                    value: 2
                unlocks:
                  - class: /Game/FactoryGame/Unlocks/BP_UnlockRecipe.BP_UnlockRecipe_C
                    properties:
                      - path: mRecipes
                        value:
                          - Recipe_MySuperIngot
      docs: "features/schematics"
    "schematics[].parent":
      summary: "Schematic class the new schematic is derived from."
      description: >-
        Defaults to `/Script/FactoryGame.FGSchematic`, which is also the required base class.
        Only used with `id`.
      type: "class path"
      default: "/Script/FactoryGame.FGSchematic"
      examples:
        - title: Derive from a milestone
          yaml: |
            type: schematic
            schematics:
              - id: Schematic_MyMilestone
                parent: /Game/FactoryGame/Schematics/Progression/Schematic_1-1.Schematic_1-1_C
      docs: "features/schematics"
    "schematics[].unlocks":
      summary: "Unlock objects created on the schematic."
      description: >-
        Each entry instances a concrete `FGUnlock` subclass onto the schematic's `mUnlocks` and
        applies its `properties`. Known native class paths are remapped to their Blueprint
        implementation. For a reusable preconfigured unlock use a `type: unlock` document.
      type: "list of instanced objects"
      uses: instancedObject
      examples:
        - title: Unlock a recipe and an inventory slot
          yaml: |
            type: schematic
            schematics:
              - id: Schematic_Convenience
                unlocks:
                  - class: /Game/FactoryGame/Unlocks/BP_UnlockRecipe.BP_UnlockRecipe_C
                    properties:
                      - path: mRecipes
                        value:
                          - Recipe_MySuperIngot
                  - class: /Script/FactoryGame.FGUnlockInventorySlot
                    properties:
                      - path: mNumInventorySlotsToUnlock
                        value: 1
      docs: "features/schematics#instanced-unlocks-the-normal-way-to-wire-up-a-recipe"
    "schematics[].dependencies":
      summary: "Prerequisites created on the schematic."
      description: >-
        Each entry instances an `FGAvailabilityDependency` subclass onto `mSchematicDependencies`.
        Set `mDependenciesBlocksSchematicAccess` or `mHiddenUntilDependenciesMet` in `properties`
        to choose between blocking and hiding while the dependency is unmet.
      type: "list of instanced objects"
      uses: instancedObject
      examples:
        - title: Require another schematic first
          yaml: |
            type: schematic
            schematics:
              - id: Schematic_AdvancedSuperIngot
                dependencies:
                  - class: /Script/FactoryGame.FGSchematicPurchasedDependency
                    properties:
                      - path: mSchematics
                        value:
                          - Schematic_MySuperIngot
      docs: "features/schematics#gating-a-schematic-on-prerequisites"
    "schematics[].recipes":
      summary: "Shortcut: recipes the schematic unlocks."
      description: >-
        `FGRecipe` classes (full paths or generated ids). Creates one `FGUnlockRecipe`.
      type: "list of recipe classes"
      examples:
        - title: Unlock two recipes
          yaml: |
            type: schematic
            schematics:
              - id: Schematic_Convenience
                recipes:
                  - Recipe_MySuperIngot
                  - /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
      docs: "features/schematics#shortcut-unlocks"
    "schematics[].schematics":
      summary: "Shortcut: schematics the schematic unlocks."
      description: >-
        `FGSchematic` classes. Creates one `FGUnlockSchematic`.
      type: "list of schematic classes"
      examples:
        - title: Unlock another milestone
          yaml: |
            type: schematic
            schematics:
              - id: Schematic_Convenience
                schematics:
                  - /Game/FactoryGame/Schematics/Progression/Schematic_2-3.Schematic_2-3_C
      docs: "features/schematics#shortcut-unlocks"
    "schematics[].handSlots":
      summary: "Shortcut: number of arm equipment slots to unlock."
      description: >-
        A positive integer. Creates the matching arm-equipment unlock.
      type: "integer"
      examples:
        - title: One hand slot
          yaml: |
            type: schematic
            schematics:
              - id: Schematic_Convenience
                handSlots: 1
      docs: "features/schematics#shortcut-unlocks"
    "schematics[].inventorySlots":
      summary: "Shortcut: number of inventory slots to unlock."
      description: >-
        A positive integer. Creates the matching inventory unlock.
      type: "integer"
      examples:
        - title: Three inventory slots
          yaml: |
            type: schematic
            schematics:
              - id: Schematic_Convenience
                inventorySlots: 3
      docs: "features/schematics#shortcut-unlocks"
    "schematics[].scannableResources":
      summary: "Shortcut: resources added to the object scanner."
      description: >-
        Each entry names a resource descriptor and an optional node type and creates an
        `FGUnlockScannableResource`. It makes the resource scannable; it does not place nodes.
      type: "list of resource entries"
      examples:
        - title: Scan for Bauxite nodes
          yaml: |
            type: schematic
            schematics:
              - id: Schematic_Convenience
                scannableResources:
                  - resource: /Game/FactoryGame/Resource/RawResources/Bauxite/Desc_OreBauxite.Desc_OreBauxite_C
      docs: "features/schematics#shortcut-unlocks"
    "schematics[].scannableResources[].resource":
      summary: "Resource descriptor class to add to the scanner."
      description: >-
        A resource descriptor class path or generated id.
      type: "class path | id"
      required: true
      examples:
        - title: Scannable resource
          yaml: |
            type: schematic
            schematics:
              - id: Schematic_Convenience
                scannableResources:
                  - resource: /Game/FactoryGame/Resource/RawResources/Bauxite/Desc_OreBauxite.Desc_OreBauxite_C
      docs: "features/schematics#shortcut-unlocks"
    "schematics[].scannableResources[].nodeType":
      summary: "Node type the scanner shows for the resource."
      description: >-
        `Node`, `FrackingSatellite`, `FrackingCore`, `Geyser` or `Deposit`.
      type: "node type"
      default: Node
      values: nodeType
      examples:
        - title: Geyser scanning
          yaml: |
            type: schematic
            schematics:
              - id: Schematic_Convenience
                scannableResources:
                  - resource: /Game/FactoryGame/Resource/RawResources/Bauxite/Desc_OreBauxite.Desc_OreBauxite_C
                    nodeType: Geyser
      docs: "features/schematics#shortcut-unlocks"
    remove:
      summary: "Schematics to take out of the game."
      description: >-
        Each entry is a class reference that removes exactly that schematic, or a filter map using
        the scope filters (scope `FGSchematic`). Removal is save-clean and reverses on the next
        session after the pack is removed. It does not remove recipes the schematic already
        granted or revoke purchases.
      type: "list of class references | filter maps"
      uses: scopeFilters
      examples:
        - title: Remove a milestone and all high-tier schematics
          yaml: |
            type: schematic
            remove:
              - /Game/FactoryGame/Schematics/Progression/Schematic_1-1.Schematic_1-1_C
              - where:
                  path: mTechTier
                  greaterOrEqual: 8
      docs: "features/removing-content#schematics"

  # ---- type: sinkpoints --------------------------------------------------------------------------------
  category_reorder:
    subType:
      summary: "Kind of object whose menu category and order are changed."
      description: >-
        `items` targets item or building descriptors, `recipe` targets recipes, `schematic`
        targets schematics, and `settings` targets UFGUserSetting assets. Recipes support only a
        main category.
      type: "items | recipe | schematic | settings"
      required: true
      values: categoryReorderSubType
      examples:
        - title: Order item descriptors
          partial: true
          yaml: "subType: items"
      docs: "features/category-reorder#supported-subtypes"
    category:
      summary: "Main category assigned to every class in order."
      description: >-
        Class path of a category compatible with the selected subtype. The handler writes the
        category before assigning one-based menu priorities.
      type: "category class path"
      required: true
      examples:
        - title: Pipeline category
          partial: true
          yaml: "category: /Game/Categories/Cat_Pipelines.Cat_Pipelines_C"
      docs: "features/category-reorder"
    subCategory:
      summary: "Optional subcategory assigned to every ordered item, schematic, or setting."
      description: >-
        Replaces an item's or schematic's subcategory list with this single category. For settings,
        writes WidgetsToCreate[0].SubCategoryClass. Not supported for recipes.
      type: "category class path"
      examples:
        - title: Special pipeline subcategory
          partial: true
          yaml: "subCategory: /Game/Categories/SC_Pipes_Addons.SC_Pipes_Addons_C"
      docs: "features/category-reorder#supported-subtypes"
    categoryPriority:
      summary: "Optional menu priority written to the main category."
      description: "Accepts integer or fractional priorities."
      type: "number"
      examples:
        - title: Place category between existing groups
          partial: true
          yaml: "categoryPriority: 4.05"
      docs: "features/category-reorder#category-priorities"
    subCategoryPriority:
      summary: "Optional menu priority written to the selected subcategory."
      description: "Requires subCategory and is unavailable for recipe documents."
      type: "number"
      examples:
        - title: First subcategory
          partial: true
          yaml: "subCategoryPriority: 1"
      docs: "features/category-reorder#category-priorities"
    order:
      summary: "Class or setting-asset paths in ascending menu order."
      description: >-
        Every entry must be unique. First entry receives priority 1, second receives 2, and so on.
        Settings entries are UFGUserSetting asset paths and must already contain WidgetsToCreate[0].
      type: "non-empty unique list of class or asset paths"
      required: true
      examples:
        - title: Order two descriptors
          partial: true
          yaml: |
            order:
              - /Game/Items/Desc_First.Desc_First_C
              - /Game/Items/Desc_Second.Desc_Second_C
      docs: "features/category-reorder"

  sinkpoints:
    track:
      summary: "Sink point table the document writes to."
      description: >-
        `Default` or `Exploration`; they are separate tables.
      type: "Default | Exploration"
      default: Default
      values: track
      examples:
        - title: Exploration track
          yaml: |
            type: sinkpoints
            track: Exploration
            entries:
              - item: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                points: 100
      docs: "features/sinkpoints"
    entries:
      summary: "AWESOME Sink point values per item."
      description: >-
        Each entry names one `item` or replaces it with an `ofClass` scope plus filters that select
        many item descriptors. Sink point changes need a session restart because the registry
        freezes.
      type: "list of sink point entries"
      required: true
      uses: scopeFilters
      examples:
        - title: One item and a filter
          yaml: |
            type: sinkpoints
            entries:
              - item: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                points: 100
              - ofClass: /Script/FactoryGame.FGItemDescriptor
                where:
                  path: mForm
                  in: [RF_LIQUID, RF_GAS]
                points: 0
      docs: "features/sinkpoints"
    "entries[].item":
      summary: "Item descriptor that gets the points."
      description: >-
        Has to resolve to a `UFGItemDescriptor` subclass: a class path, a generated id or a bare
        class name. Use it or the filter keys, not both. A later explicit row for the same
        descriptor wins over a filter entry.
      type: "class path | id"
      required: "yes, unless filter keys are used"
      examples:
        - title: A generated item
          yaml: |
            type: sinkpoints
            entries:
              - item: MySuperIngot
                points: 8
      docs: "features/sinkpoints"
    "entries[].points":
      summary: "AWESOME Sink points the item is worth."
      description: >-
        A plain 32-bit integer.
      type: "integer"
      required: true
      examples:
        - title: Worth 100 points
          yaml: |
            type: sinkpoints
            entries:
              - item: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                points: 100
      docs: "features/sinkpoints"
    "entries[].overridden":
      summary: "Separate overridden point value some UI paths read."
      description: >-
        Optional and only needed for a distinct value next to the base `points`.
      type: "integer"
      examples:
        - title: Base and overridden value
          yaml: |
            type: sinkpoints
            entries:
              - item: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                points: 100
                overridden: 50
      docs: "features/sinkpoints"

  # ---- type: sound ---------------------------------------------------------------------------------------
  sound:
    sounds:
      summary: "WAV/FLAC files imported as Wwise audio events."
      description: >-
        Each entry creates a `UAkAudioEvent` from a pack-relative PCM16 WAV or native FLAC file, for example
        for ADA voice-over. The event is finite, played once in 2D, and routed to the master bus.
        Importing does not play it or define an ADA trigger. Install the same pack and audio files
        on every multiplayer client.
      type: "list of sound entries"
      required: true
      examples:
        - title: An ADA voice line
          yaml: |
            type: sound
            sounds:
              - id: AdaWelcome
                file: audio/welcome.wav
      docs: "features/sounds"
    "sounds[].id":
      summary: "Stable id of the audio event."
      description: >-
        Shares the generated asset namespace with images, curves and data assets. The event is
        referenced by this id inside the pack, or by
        `/KDataForge/GenAssets/<PackRef>.Gen_<PackRef>_<Id>` across packs.
      type: "id"
      required: true
      examples:
        - title: Reference the event from a message
          yaml: |
            type: dataasset
            assets:
              - id: WelcomeMessage
                class: /Script/FactoryGame.FGMessage
                properties:
                  - path: mAudioEvent
                    value: AdaWelcome
      docs: "features/sounds#reference-an-event"
    "sounds[].file":
      summary: "WAV/FLAC file, relative to the pack root."
      description: >-
        PCM16 RIFF WAV or native FLAC, mono or stereo, 8000 to 192000 Hz, at most 64 MiB encoded and decoded. FLAC requires a known nonzero frame count. Ogg and 24-bit FLAC are unsupported. The
        path and any symbolic link must stay inside the pack. MP3, OGG, float WAV, loops and
        spatial attenuation are unsupported.
      type: "file path"
      required: true
      examples:
        - title: WAV in a subfolder
          yaml: |
            type: sound
            sounds:
              - id: AdaWelcome
                file: audio/welcome.wav
      docs: "features/sounds#accepted-audio"
    "sounds[].name":
      summary: "Display name of the sound setting."
      description: >-
        Optional label for the local Audio setting, never a pack configuration field. When omitted, runtime falls back
        to `<id> volume` so existing `id` and `file` entries keep working.
      type: "text"
      examples:
        - title: Named sound setting
          yaml: |
            type: sound
            sounds:
              - id: AdaWelcome
                file: audio/welcome.wav
                name: Welcome
      docs: "features/sounds"
    "sounds[].description":
      summary: "Description of the sound setting."
      description: >-
        Optional help text for the local Audio setting. Use it to explain what the
        imported event controls.
      type: "text"
      examples:
        - title: Described sound setting
          yaml: |
            type: sound
            sounds:
              - id: AdaWelcome
                file: audio/welcome.wav
                description: ADA welcome line
      docs: "features/sounds"
    "sounds[].category":
      summary: "Audio category for the sound setting."
      description: >-
        Optional category below the native Audio settings section. Runtime flattens `category`
        and `subCategory` because FactoryGame exposes Audio plus one subcategory level.
      type: "text"
      examples:
        - title: Group under Voice
          yaml: |
            type: sound
            sounds:
              - id: AdaWelcome
                file: audio/welcome.wav
                category: Voice
      docs: "features/sounds"
    "sounds[].subCategory":
      summary: "Audio subcategory for the sound setting."
      description: >-
        Optional second grouping label for the native Audio settings section. Runtime flattens
        this with `category` to fit FactoryGame's single audio subcategory level.
      type: "text"
      examples:
        - title: Group under ADA voice
          yaml: |
            type: sound
            sounds:
              - id: AdaWelcome
                file: audio/welcome.wav
                category: Voice
                subCategory: ADA
      docs: "features/sounds"

  # ---- type: sublevel ---------------------------------------------------------------------------------------
  sublevel:
    block:
      summary: "Sublevel descriptor assets to block."
      description: >-
        Blocks RefinedRDLib or KBFL sublevel assets in memory for the session. An entry is an
        exact asset path, or a map with `target`, `allAssetsOfClass` and/or an `ofClass` scope
        with filters (`ofClass` is required there). It does not unload an already streamed
        level. Restart the session after changing it.
      type: "list of asset paths | maps"
      required: true
      uses: scopeFilters
      examples:
        - title: An exact asset and a whole provider class
          yaml: |
            type: sublevel
            conditions:
              hasMod: RefinedRDLib
            block:
              - /SomeMod/World/DA_OptionalSublevel.DA_OptionalSublevel
              - allAssetsOfClass: /Script/RefinedRDLib.RRDLSublevelAsset
      docs: "features/sublevels"
    "block[].target":
      summary: "Exact sublevel asset path or list of paths."
      description: >-
        Object paths (no `_C`) of provider data assets. They load directly, so they work even
        when the asset registry is not fully populated. An unresolved path produces a warning.
      type: "object path | list"
      examples:
        - title: Two assets
          yaml: |
            type: sublevel
            block:
              - target:
                  - /AnotherMod/World/DA_Nodes_A.DA_Nodes_A
                  - /AnotherMod/World/DA_Nodes_B.DA_Nodes_B
      docs: "features/sublevels#block-explicit-assets"
    "block[].allAssetsOfClass":
      summary: "Blocks every asset of a provider class."
      description: >-
        The scan includes derived classes and depends on the asset registry. An unresolved
        provider class gives an Info diagnostic, not a hard failure.
      type: "class path"
      examples:
        - title: All RefinedRDLib sublevels
          yaml: |
            type: sublevel
            conditions:
              hasMod: RefinedRDLib
            block:
              - allAssetsOfClass: /Script/RefinedRDLib.RRDLSublevelAsset
      docs: "features/sublevels#block-every-asset-of-a-provider-class"

  # ---- type: unlock ------------------------------------------------------------------------------------------
  unlock:
    unlocks:
      summary: "Reusable preconfigured unlock classes to generate."
      description: >-
        Generates `FGUnlock` subclasses with baked-in defaults, which several schematics can
        reference by class. Most packs do not need this: a schematic's own `unlocks:` list is
        simpler. Register-only entries (`class:`) are not supported.
      type: "list of unlock entries"
      required: true
      uses: generatedEntry
      examples:
        - title: A reusable inventory slot unlock
          yaml: |
            type: unlock
            unlocks:
              - id: MyStarterKitUnlock
                parent: /Game/FactoryGame/Unlocks/BP_UnlockInventorySlot.BP_UnlockInventorySlot_C
                properties:
                  - path: mNumInventorySlotsToUnlock
                    value: 3
      docs: "features/unlocks"
    "unlocks[].parent":
      summary: "Concrete unlock class the new class derives from."
      description: >-
        Required for a generated unlock: there is no default. Any concrete `FGUnlock` subclass of
        the base game works.
      type: "class path"
      required: true
      examples:
        - title: Derive from the inventory slot unlock
          yaml: |
            type: unlock
            unlocks:
              - id: MyStarterKitUnlock
                parent: /Game/FactoryGame/Unlocks/BP_UnlockInventorySlot.BP_UnlockInventorySlot_C
      docs: "features/unlocks"

values:
  categoryReorderSubType:
    items:
      summary: "Orders item and building descriptors."
      description: "Assigns item categories, optional subcategories, and one-based menu priorities."
      type: "category reorder subtype"
      examples:
        - title: Items
          partial: true
          yaml: "subType: items"
      docs: "features/category-reorder#supported-subtypes"
    recipe:
      summary: "Orders recipes."
      description: "Assigns the overridden recipe category and one-based manufacturing-menu priorities."
      type: "category reorder subtype"
      examples:
        - title: Recipes
          partial: true
          yaml: "subType: recipe"
      docs: "features/category-reorder#supported-subtypes"
    schematic:
      summary: "Orders schematics."
      description: "Assigns schematic categories, optional subcategories, and one-based menu priorities."
      type: "category reorder subtype"
      examples:
        - title: Schematics
          partial: true
          yaml: "subType: schematic"
      docs: "features/category-reorder#supported-subtypes"
    settings:
      summary: "Orders user settings."
      description: >-
        Assigns setting categories and one-based priorities through WidgetsToCreate[0]. Additional
        placements and SubOptionTo links remain unchanged.
      type: "category reorder subtype"
      examples:
        - title: Settings
          partial: true
          yaml: "subType: settings"
      docs: "features/category-reorder#settings-preserve-other-placements"
  actorAction:
    destroy:
      summary: "Destroys a ready authority actor on the next world timer tick."
      description: "Includes local non-replicated client actors. Reload cancels pending callbacks, but cannot restore actors already destroyed; save tombstones may persist."
      type: "actor action"
      examples:
        - title: "Destroy matched actors"
          partial: true
          yaml: |
            actorAction: destroy
      docs: "features/targeting#actor-lifecycle-actions"
    dismantle:
      summary: "Dismantles child actors and parent through the game's dismantle interface."
      description: "Uses normal destruction for actors without the interface. Runs after BeginPlay on a subsequent timer tick; reload cannot restore already removed actors."
      type: "actor action"
      examples:
        - title: "Dismantle matched actors"
          partial: true
          yaml: |
            actorAction: dismantle
      docs: "features/targeting#actor-lifecycle-actions"
  event:
    worldReady:
      summary: "Runs after the server world begins play; reload does not replay this event."
      description: "Runs after gameplay actors enter play; YAML reload does not replay this event."
      type: "event"
      examples:
        - title: "Configure worldReady"
          partial: true
          yaml: |
            event: worldReady
      docs: "features/event-rules"
    schematicPurchased:
      summary: "Runs when the schematic manager broadcasts a new purchase."
      description: "Uses the schematic manager purchase event; prior purchases are not replayed."
      type: "event"
      examples:
        - title: "Configure schematicPurchased"
          partial: true
          yaml: |
            event: schematicPurchased
      docs: "features/event-rules"
  purity:
    Impure:
      summary: "Impure ordinary resource node."
      description: "Selects the game impure-node extraction rate for an ordinary resource node."
      type: "purity"
      examples:
        - title: "Configure Impure"
          partial: true
          yaml: |
            purity: Impure
      docs: "features/resource-node-placement"
    Normal:
      summary: "Normal ordinary resource node."
      description: "Selects the game normal-node extraction rate for an ordinary resource node."
      type: "purity"
      examples:
        - title: "Configure Normal"
          partial: true
          yaml: |
            purity: Normal
      docs: "features/resource-node-placement"
    Pure:
      summary: "Pure ordinary resource node."
      description: "Selects the game pure-node extraction rate for an ordinary resource node."
      type: "purity"
      examples:
        - title: "Configure Pure"
          partial: true
          yaml: |
            purity: Pure
      docs: "features/resource-node-placement"
  classType:
    any:
      summary: "Accepts native and Blueprint-authored classes."
      description: "Default class identity filter; use other scope fields to narrow selection."
      type: "classType"
      examples:
        - title: Both class kinds
          partial: true
          yaml: |
            classType: any
      docs: "features/targeting#class-identity-filters"
    blueprint:
      summary: "Requires Unreal's CLASS_CompiledFromBlueprint flag."
      description: "Selects Blueprint-authored classes, including ones loaded later."
      type: "classType"
      examples:
        - title: Blueprint classes only
          partial: true
          yaml: |
            classType: blueprint
      docs: "features/targeting#class-identity-filters"
    native:
      summary: "Excludes classes with Unreal's CLASS_CompiledFromBlueprint flag."
      description: "Selects native classes, including ones loaded later."
      type: "classType"
      examples:
        - title: Native classes only
          partial: true
          yaml: |
            classType: native
      docs: "features/targeting#class-identity-filters"
  # ---- op: the 25 property operations -----------------------------------------------------------------
  op:
    append_unique:
      summary: "Appends array elements only when they are absent."
      description: >-
        Preserves existing duplicates and order, and adds each missing incoming value at most once.
        Uses reflected element equality. Arrays only; value is one element or a sequence. Inline
        instanced object creation is unsupported because comparison uses object identity.
      type: "op"
      examples:
        - title: Add one resource form without duplicates
          partial: true
          yaml: |
            path: mAllowedResourceForms
            op: append_unique
            value: [RF_GAS]
      docs: "features/operations#append_unique-array"
    update_where:
      summary: "Partially updates every matching struct element in an array."
      description: >-
        Evaluates one or more where clauses relative to each struct element, then merges the value
        mapping into every match. Requires at least one match; otherwise the operation fails. Arrays
        of structs only.
      type: "op"
      examples:
        - title: Replace an item class without relying on array order
          partial: true
          yaml: |
            path: mProduct
            op: update_where
            where: { path: ItemClass, equals: Desc_Old_C }
            value: { ItemClass: Desc_New_C }
      docs: "features/operations#update_where-array-of-structs"
    replace_refs:
      summary: "Recursively replaces matching object and class references."
      description: >-
        Searches below path through structs, arrays, sets, maps, and instanced objects. Every exact
        matching hard or soft object/class reference is replaced with value. Requires from and value;
        zero matches or an incompatible replacement fails atomically.
      type: "op"
      examples:
        - title: Replace a recipe in nested schematic unlocks
          partial: true
          yaml: |
            path: mUnlocks
            op: replace_refs
            from: /OldMod/Recipes/Recipe_Old.Recipe_Old_C
            value: /NewMod/Recipes/Recipe_New.Recipe_New_C
      docs: "features/operations#replace_refs-reflected-reference-trees"
    set:
      summary: "Overwrites the property with `value`."
      description: >-
        The default operation. Works on every property type; bitmask properties accept one flag
        name or a list of names. `set` is implied when `op` is left out.
      type: "op"
      examples:
        - title: Replace a text
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                properties:
                  - path: mDisplayName
                    op: set
                    value: Reinforced Iron Ingot
      docs: "features/operations#set-default-everything"
    add:
      summary: "Adds `value` to a numeric property."
      description: >-
        Plain numeric properties only. Enum-backed integers such as `mStackSize` are rejected;
        use `set` with the enum name there.
      type: "op"
      examples:
        - title: Raise a tech tier by one
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Schematics/Progression/Schematic_1-1.Schematic_1-1_C
                properties:
                  - path: mTechTier
                    op: add
                    value: 1
      docs: "features/operations#add--subtract-numeric"
    subtract:
      summary: "Subtracts `value` from a numeric property."
      description: >-
        Plain numeric properties only. Enum-backed integers are rejected.
      type: "op"
      examples:
        - title: Shorten a build time by 30 seconds
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Schematics/Progression/Schematic_1-1.Schematic_1-1_C
                properties:
                  - path: mTimeToComplete
                    op: subtract
                    value: 30
      docs: "features/operations#add--subtract-numeric"
    multiply:
      summary: "Multiplies a numeric property by `value`."
      description: >-
        Scales the stored number: `0.5` halves a crafting time. Enum-backed integers are rejected.
      type: "op"
      examples:
        - title: Halve a crafting time
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.5
      docs: "features/operations#multiply--divide-numeric"
    divide:
      summary: "Divides a numeric property by `value`."
      description: >-
        Dividing by `0` is rejected instead of producing infinity or NaN. Enum-backed integers
        are rejected.
      type: "op"
      examples:
        - title: Double the energy efficiency
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                properties:
                  - path: mEnergyValue
                    op: divide
                    value: 2
      docs: "features/operations#multiply--divide-numeric"
    min:
      summary: "Keeps the smaller of the current value and `value`, a ceiling."
      description: >-
        The property becomes whichever is smaller, so `min: 100` caps it at 100. Enum-backed
        integers are rejected.
      type: "op"
      examples:
        - title: Cap sink points at 100
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                properties:
                  - path: mResourceSinkPoints
                    op: min
                    value: 100
      docs: "features/operations#min--max-numeric-result--minmax-of-current-and-value"
    max:
      summary: "Keeps the larger of the current value and `value`, a floor."
      description: >-
        The property becomes whichever is larger, so `max: 50` raises it to at least 50. Enum-backed
        integers are rejected.
      type: "op"
      examples:
        - title: Raise sink points to at least 50
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                properties:
                  - path: mResourceSinkPoints
                    op: max
                    value: 50
      docs: "features/operations#min--max-numeric-result--minmax-of-current-and-value"
    clamp:
      summary: "Pins a numeric property between `min` and `max`."
      description: >-
        Two-sided version of `min`/`max`. Takes the `min` and `max` keys instead of `value`.
      type: "op"
      examples:
        - title: Keep a menu priority between 0 and 999
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Schematics/Progression/Schematic_1-1.Schematic_1-1_C
                properties:
                  - path: mMenuPriority
                    op: clamp
                    min: 0
                    max: 999
      docs: "features/operations#clamp-numeric"
    append:
      summary: "Adds to the end of a container, or concatenates onto text."
      description: >-
        Arrays and sets take one item or a list; strings concatenate; tag containers add tags; a
        map merges the key/value pairs of `value`; bitmasks OR-add named flags. An instanced
        object array accepts a `{class, properties}` value. An empty list adds nothing and is not
        an error; leaving `value` out is.
      type: "op"
      examples:
        - title: Add an ingredient
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mIngredients
                    op: append
                    value:
                      ItemClass: /Game/FactoryGame/Resource/RawResources/Coal/Desc_Coal.Desc_Coal_C
                      Amount: 1
        - title: Add a tag
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mGameplayTags
                    op: append
                    value:
                      - MyPack.Rebalanced
      docs: "features/operations#append-array--set--map--string--tag-container--bitmask"
    prepend:
      summary: "Adds to the front of an array, or in front of existing text."
      description: >-
        Mirrors `append`. Sets, tag containers and bitmasks have no order, so `prepend` behaves
        like `append` there. Maps do not support it.
      type: "op"
      examples:
        - title: Prefix a name
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                properties:
                  - path: mDisplayName
                    op: prepend
                    value: '[MP] '
      docs: "features/operations#prepend-array--set--string-tag-containers-and-bitmasks-same-as-append"
    insert:
      summary: "Inserts element(s) at `index` of an array."
      description: >-
        Later elements shift back. An out-of-range index is an error and is not clamped. An empty
        list adds nothing, but the index is still checked.
      type: "op"
      examples:
        - title: Insert as the second ingredient
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mIngredients
                    op: insert
                    index: 1
                    value:
                      ItemClass: /Game/FactoryGame/Resource/RawResources/OreCopper/Desc_OreCopper.Desc_OreCopper_C
                      Amount: 1
      docs: "features/operations#insert-array"
    remove:
      summary: "Deletes by content: array/set elements, a map key, tags or bitmask flags."
      description: >-
        On arrays and sets it deletes every element equal to `value`, and fails when nothing
        matches. On maps `value` is the key; on tag containers the tag(s); on bitmasks it clears
        the named bits.
      type: "op"
      examples:
        - title: Take a tag off
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mGameplayTags
                    op: remove
                    value: KMods.WikiExclude
      docs: "features/operations#remove-array-by-value--set-by-value--map-by-key--tag-container--bitmask"
    remove_at:
      summary: "Deletes the array element at `index`."
      description: >-
        Use it when you know the slot but not (or do not want to spell out) the contents.
      type: "op"
      examples:
        - title: Drop the second product
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mProduct
                    op: remove_at
                    index: 1
      docs: "features/operations#remove_at-array"
    clear:
      summary: "Empties a container or text, or sets a bitmask to 0."
      description: >-
        Arrays, sets, maps and tag containers lose every element. Strings become empty, not their
        class default. Takes no `value`.
      type: "op"
      examples:
        - title: Empty a list
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Schematics/Progression/Schematic_1-1.Schematic_1-1_C
                properties:
                  - path: mSubCategories
                    op: clear
      docs: "features/operations#clear-array--set--map--string--tag-container--bitmask"
    swap:
      summary: "Exchanges the array elements at `index` and `with`."
      description: >-
        Reorders two entries without rewriting the array.
      type: "op"
      examples:
        - title: Swap the first two ingredients
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mIngredients
                    op: swap
                    index: 0
                    with: 1
      docs: "features/operations#swap-array"
    replace:
      summary: "Overwrites the array element at `index` with `value`."
      description: >-
        Every other element and the array length stay unchanged.
      type: "op"
      examples:
        - title: Replace the first product
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mProduct
                    op: replace
                    index: 0
                    value:
                      ItemClass: /Game/FactoryGame/Resource/Parts/SteelIngot/Desc_SteelIngot.Desc_SteelIngot_C
                      Amount: 2
      docs: "features/operations#replace-array"
    duplicate:
      summary: "Copies the element at `index` to the end of the array."
      description: >-
        Handy for cloning an ingredient or product as a starting point before a follow-up
        `replace`.
      type: "op"
      examples:
        - title: Clone the first product
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mProduct
                    op: duplicate
                    index: 0
      docs: "features/operations#duplicate-array-copies-element-to-the-end"
    sort:
      summary: "Sorts an array in ascending order."
      description: >-
        Numbers and strings sort by value; other element types sort by their exported text form.
        Takes no `value`.
      type: "op"
      examples:
        - title: Sort a list
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Schematics/Progression/Schematic_1-1.Schematic_1-1_C
                properties:
                  - path: mRelevantEvents
                    op: sort
      docs: "features/operations#sort--reverse-array"
    reverse:
      summary: "Reverses the order of an array."
      description: >-
        Flips the current order of every element. Takes no `value`.
      type: "op"
      examples:
        - title: Reverse a list
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Schematics/Progression/Schematic_1-1.Schematic_1-1_C
                properties:
                  - path: mSubCategories
                    op: reverse
      docs: "features/operations#sort--reverse-array"
    unique:
      summary: "Removes later duplicates from an array."
      description: >-
        Keeps the first occurrence of every identical element. On a set it is a no-op because a
        set has no duplicates.
      type: "op"
      examples:
        - title: Deduplicate a list
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Schematics/Progression/Schematic_1-1.Schematic_1-1_C
                properties:
                  - path: mSubCategories
                    op: unique
      docs: "features/operations#unique-array-removes-later-duplicates-sets-no-op"
    copy:
      summary: "Copies the value of another property of the same object into `path`."
      description: >-
        `from` names the source. Identical property types copy the raw value; otherwise the value
        round-trips through its text form, so compatible types such as string to name can work.
      type: "op"
      examples:
        - title: Copy a name into another text property
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                properties:
                  - path: mAbbreviatedDisplayName
                    op: copy
                    from: mDisplayName
      docs: "features/operations#copy-any-property-from-another-path-on-the-same-object"
    move:
      summary: "Copies a property like `copy`, then resets the source to its default."
      description: >-
        Use it when the value should live at the new path instead of the old one.
      type: "op"
      examples:
        - title: Move a description
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                properties:
                  - path: mDescription
                    op: move
                    from: mScannerDisplayText
      docs: "features/operations#move-copy-then-reset-the-source-to-its-default"

  # ---- type: the document types --------------------------------------------------------------------------
  type:
    eventrule:
      summary: "Registers server-side event rules in the RuntimePatches stage."
      description: "Combines bounded server events, schematic prerequisites and explicit actions without arbitrary function execution."
      type: "document type"
      examples:
        - title: "Configure eventrule"
          partial: true
          yaml: |
            type: eventrule
            rules:
              - id: started
                event: worldReady
                actions:
                  - log: World ready
      docs: "features/event-rules"
    asset:
      summary: "Imports pack images as texture assets."
      description: >-
        Runs in the Assets stage. Each entry turns a PNG, JPG, TGA or BMP file into a referenceable
        `UTexture2D`, for example an item icon.
      type: "document type"
      examples:
        - title: Import an icon
          yaml: |
            type: asset
            assets:
              - id: SuperIngotIcon
                file: icons/super-ingot.png
      docs: "features/data-assets#2d-image-assets-type-asset"
    building:
      summary: "Generates new building descriptor classes."
      description: >-
        Runs in the Items stage (last of the generation types). A generated building keeps the
        layout of its parent; only defaults differ.
      type: "document type"
      examples:
        - title: A storage variant
          yaml: |
            type: building
            buildings:
              - id: MyCrimsonStorage
                parent: /Game/FactoryGame/Buildable/Factory/StorageContainerMk1/Build_StorageContainerMk1.Build_StorageContainerMk1_C
      docs: "features/buildings"
    cdo:
      summary: "Patches properties of existing classes and assets."
      description: >-
        Runs in the CDOChanges stage. The workhorse type: it edits any reflected property of a
        class default object, a live object or every asset matching a class or tag scan.
      type: "document type"
      examples:
        - title: Halve a crafting time
          yaml: |
            type: cdo
            patches:
              - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
                properties:
                  - path: mManufactoringDuration
                    op: multiply
                    value: 0.5
      docs: "features/patching-cdo"
    category_reorder:
      summary: "Assigns categories and explicit one-based menu ordering."
      description: >-
        Runs late in CDOChanges, after normal CDO patches, so explicit category ordering
        stays separate from general property patches.
      type: "document type"
      examples:
        - title: Order descriptors in a category
          partial: true
          yaml: |
            type: category_reorder
            subType: items
            category: /Game/Categories/Cat_Pipelines.Cat_Pipelines_C
            order: [/Game/Items/Desc_Pipe.Desc_Pipe_C]
      docs: "features/category-reorder"
    class:
      summary: "Generates classes of any kind from any parent."
      description: >-
        Runs first in the Items stage. The escape hatch for classes the preset types do not
        cover: equipment, categories, unlocks, classes of other mods.
      type: "document type"
      examples:
        - title: A category class
          yaml: |
            type: class
            classes:
              - id: SampleBalanceCategory
                parent: /Script/FactoryGame.FGCategory
      docs: "features/custom-classes"
    config:
      summary: "Defines player-configurable settings for a pack."
      description: >-
        Lives in a `<name>.config.yml` file. Config definitions are read before pack conditions
        and are never staged; their values come from `Configs/Packs/<PackRef>.config.yml`.
      type: "document type"
      examples:
        - title: A checkbox setting
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: features.enableBonus
                type: boolean
                name: Enable bonus
                description: Turns the bonus recipes on or off.
                default: true
      docs: "features/pack-configuration"
    curve:
      summary: "Creates or edits float and vector curve assets."
      description: >-
        Runs in the Assets stage. `curveType` selects `UCurveFloat` or `UCurveVector`; the keys of
        an entry replace the curve's key set.
      type: "document type"
      examples:
        - title: A float curve
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                keys:
                  - time: 0
                    value: 1
      docs: "features/curves"
    dataasset:
      summary: "Creates new data-asset instances at runtime."
      description: >-
        Runs in the Assets stage. Existing data assets are edited with a `cdo` document instead.
      type: "document type"
      examples:
        - title: A KAPI data asset
          yaml: |
            type: dataasset
            assets:
              - id: CleanerItem_MyFluid
                class: /Script/KAPI.KAPICleanerItemDescription
      docs: "features/data-assets#creating-new-instances-type-dataasset"
    gametag:
      summary: "Registers new gameplay tags."
      description: >-
        Runs in the GameTags stage, which is always first, so other documents of the pack can use
        the tags straight away.
      type: "document type"
      examples:
        - title: Two tags
          yaml: |
            type: gametag
            tags:
              - MyPack.Machines.Special
              - MyPack.Simple
      docs: "features/game-tags"
    item:
      summary: "Generates new item descriptor classes."
      description: >-
        Runs in the Items stage. The generated class is named `Gen_<PackRef>_<Id>`; the id is the
        save-persistence contract.
      type: "document type"
      examples:
        - title: A new ingot
          yaml: |
            type: item
            items:
              - id: MySuperIngot
                parent: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
      docs: "features/items"
    localization:
      summary: "Adds or overrides runtime texts per namespace and culture."
      description: >-
        Runs in the Localization stage, after GameTags and Assets and before CDOChanges. Changes
        load on the next session start.
      type: "document type"
      examples:
        - title: A German text
          yaml: |
            type: localization
            namespace: MyPack
            culture: de
            entries:
              MySuperIngot_Name: Superbarren
      docs: "features/localization"
    mam:
      summary: "Alias of `research`."
      description: >-
        Identical to `type: research`; the file name convention `my-tree.mam.yml` selects it too.
        It runs in the Research stage.
      type: "document type"
      examples:
        - title: A research tree
          yaml: |
            type: mam
            research:
              - id: MyContentLineTree
      docs: "features/research-trees"
    recipe:
      summary: "Generates or registers recipes, or removes them."
      description: >-
        Runs in the Recipes stage, after the whole Items stage, so recipes can use every generated
        item, resource, building and unlock. Changes need a restart.
      type: "document type"
      examples:
        - title: A new recipe
          yaml: |
            type: recipe
            recipes:
              - id: Recipe_MySuperIngot
      docs: "features/recipes"
    research:
      summary: "Generates, registers or edits M.A.M. research trees, or removes them."
      description: >-
        Runs in the Research stage, after Schematics. `type: mam` is an alias. Changes need a
        restart.
      type: "document type"
      examples:
        - title: A research tree
          yaml: |
            type: research
            research:
              - id: MyContentLineTree
      docs: "features/research-trees"
    resource:
      summary: "Generates new resource descriptor classes."
      description: >-
        Runs in the Items stage. Placing nodes in the world or making the resource scannable are
        separate steps.
      type: "document type"
      examples:
        - title: A new ore
          yaml: |
            type: resource
            resources:
              - id: MyCustomOre
                parent: /Game/FactoryGame/Resource/RawResources/OreIron/Desc_OreIron.Desc_OreIron_C
      docs: "features/resources"
    resourcenode:
      summary: "Removes resource nodes from the world."
      description: >-
        Runs in the SubsystemMods stage. Entries name resource descriptors (or filters) whose
        placed nodes are purged. The world's own persistence of destroyed nodes limits how
        reversible it is.
      type: "document type"
      examples:
        - title: Remove uranium nodes
          yaml: |
            type: resourcenode
            remove:
              - /Game/FactoryGame/Resource/RawResources/Uranium/Desc_OreUranium.Desc_OreUranium_C
      docs: "features/resources#removing-resource-nodes-type-resourcenode"
    schematic:
      summary: "Generates or registers schematics, or removes them."
      description: >-
        Runs in the Schematics stage, after Recipes. Supports inline `unlocks` and `dependencies`
        lists. Changes need a restart.
      type: "document type"
      examples:
        - title: A milestone
          yaml: |
            type: schematic
            schematics:
              - id: Schematic_MySuperIngot
      docs: "features/schematics"
    sinkpoints:
      summary: "Sets AWESOME Sink point values."
      description: >-
        Runs in the SubsystemMods stage. Changes need a session restart because the sink registry
        freezes.
      type: "document type"
      examples:
        - title: Points for one item
          yaml: |
            type: sinkpoints
            entries:
              - item: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                points: 100
      docs: "features/sinkpoints"
    sound:
      summary: "Imports WAV/FLAC files as Wwise audio events."
      description: >-
        Runs in the Assets stage. Events are finite 2D sounds, for example ADA voice-over.
      type: "document type"
      examples:
        - title: A voice line
          yaml: |
            type: sound
            sounds:
              - id: AdaWelcome
                file: audio/welcome.wav
      docs: "features/sounds"
    sublevel:
      summary: "Blocks RefinedRDLib or KBFL sublevel assets."
      description: >-
        Runs in the CDOChanges stage. It only changes the provider data assets in memory; it does
        not unload an already streamed level.
      type: "document type"
      examples:
        - title: Block a sublevel
          yaml: |
            type: sublevel
            block:
              - /SomeMod/World/DA_OptionalSublevel.DA_OptionalSublevel
      docs: "features/sublevels"
    unlock:
      summary: "Generates reusable FGUnlock subclasses."
      description: >-
        Runs in the Items stage. Most packs use a schematic's inline `unlocks` list instead.
      type: "document type"
      examples:
        - title: A reusable unlock
          yaml: |
            type: unlock
            unlocks:
              - id: MyStarterKitUnlock
                parent: /Game/FactoryGame/Unlocks/BP_UnlockInventorySlot.BP_UnlockInventorySlot_C
      docs: "features/unlocks"

  # ---- whereMode ------------------------------------------------------------------------------------------
  whereMode:
    AND:
      summary: "Require every where clause (default)."
      description: >-
        Case-insensitive. All clauses must match. Other scope filters remain AND-combined with the
        final where result.
      type: "where mode"
      examples:
        - title: Require every clause
          partial: true
          yaml: |
            whereMode: AND
    OR:
      summary: "Require at least one where clause."
      description: >-
        Case-insensitive. At least one clause must match. Every clause is still evaluated so an
        invalid clause fails closed instead of being hidden by another match.
      type: "where mode"
      examples:
        - title: Require any clause
          partial: true
          yaml: |
            whereMode: OR

  # ---- conditionBehavior ---------------------------------------------------------------------------------
  conditionBehavior:
    AND:
      summary: "Every condition object has to pass (default)."
      description: >-
        Case-insensitive. With an empty condition list `AND` passes. Each object is evaluated and
        optionally inverted with `ifNotMatch` before the results are combined.
      type: "condition behavior"
      examples:
        - title: Both mods required
          yaml: |
            type: cdo
            conditionBehavior: AND
            conditions:
              - hasMod: KAPI
              - hasMod: KLib
            patches:
              - target: Desc_Water
                properties:
                  - path: mResourceSinkPoints
                    value: 0
      docs: "features/conditions-and-packs"
    OR:
      summary: "At least one condition object has to pass."
      description: >-
        Case-insensitive. With an empty condition list `OR` fails. An invalid object fails closed
        even when another object matches.
      type: "condition behavior"
      examples:
        - title: Either mod is enough
          yaml: |
            type: cdo
            conditionBehavior: OR
            conditions:
              - hasMod: RefinedPower
              - hasMod: FicsitFarming
            patches:
              - target: Desc_Water
                properties:
                  - path: mResourceSinkPoints
                    value: 0
      docs: "features/conditions-and-packs"

  # ---- smaller enums -------------------------------------------------------------------------------------
  track:
    Default:
      summary: "The standard AWESOME Sink point table."
      description: >-
        Used when `track` is omitted.
      type: "sink track"
      examples:
        - title: Default track
          yaml: |
            type: sinkpoints
            track: Default
            entries:
              - item: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                points: 100
      docs: "features/sinkpoints"
    Exploration:
      summary: "The separate Exploration sink point table."
      description: >-
        Separate from `Default`; rows of one track do not affect the other.
      type: "sink track"
      examples:
        - title: Exploration track
          yaml: |
            type: sinkpoints
            track: Exploration
            entries:
              - item: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
                points: 100
      docs: "features/sinkpoints"

  curveType:
    float:
      summary: "Edits or creates `UCurveFloat` assets."
      description: >-
        Keys carry a single number. `isEventCurve` is only valid for float curves.
      type: "curve type"
      examples:
        - title: Float curve
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: DamageFalloff
                keys:
                  - time: 0
                    value: 1
      docs: "features/curves"
    vector:
      summary: "Edits or creates `UCurveVector` assets."
      description: >-
        Keys carry an `X`/`Y`/`Z` map or three numbers, and one key defines all three component
        curves.
      type: "curve type"
      examples:
        - title: Vector curve
          yaml: |
            type: curve
            curveType: vector
            curves:
              - id: CameraOffset
                keys:
                  - time: 0
                    value: [0, 0, 0]
      docs: "features/curves#vector-curves"

  registerAs:
    recipe:
      summary: "Registers the generated class as a recipe."
      description: >-
        Queues it for SML's mod content registry like a `type: recipe` entry would.
      type: "registration kind"
      examples:
        - title: Generic class registered as a recipe
          yaml: |
            type: class
            classes:
              - id: Recipe_FromClass
                parent: /Script/FactoryGame.FGRecipe
                registerAs: recipe
      docs: "features/custom-classes"
    schematic:
      summary: "Registers the generated class as a schematic."
      description: >-
        Queues it for SML's mod content registry like a `type: schematic` entry would.
      type: "registration kind"
      examples:
        - title: Generic class registered as a schematic
          yaml: |
            type: class
            classes:
              - id: Schematic_FromClass
                parent: /Script/FactoryGame.FGSchematic
                registerAs: schematic
      docs: "features/custom-classes"
    research:
      summary: "Registers the generated class as a research tree."
      description: >-
        Queues it for SML's mod content registry like a `type: research` entry would.
      type: "registration kind"
      examples:
        - title: Generic class registered as a research tree
          yaml: |
            type: class
            classes:
              - id: Tree_FromClass
                parent: /Script/FactoryGame.FGResearchTree
                registerAs: research
      docs: "features/custom-classes"

  interpMode:
    constant:
      summary: "Holds the key's value until the next key."
      description: >-
        A step: the curve jumps to the next key's value at its time.
      type: "interpolation"
      examples:
        - title: Stepped key
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Steps
                keys:
                  - time: 0
                    value: 1
                    interpMode: constant
                  - time: 5
                    value: 2
      docs: "features/curves#key-and-curve-fields"
    linear:
      summary: "Straight line to the next key (default)."
      description: >-
        The value changes at a constant rate between the two keys.
      type: "interpolation"
      examples:
        - title: Linear key
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Ramp
                keys:
                  - time: 0
                    value: 0
                    interpMode: linear
                  - time: 5
                    value: 1
      docs: "features/curves#key-and-curve-fields"
    cubic:
      summary: "Smooth cubic curve to the next key."
      description: >-
        Shaped by the key's tangents; see `tangentMode`.
      type: "interpolation"
      examples:
        - title: Cubic key
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Smooth
                keys:
                  - time: 0
                    value: 0
                    interpMode: cubic
                  - time: 5
                    value: 1
      docs: "features/curves#key-and-curve-fields"

  tangentMode:
    auto:
      summary: "Tangents are computed automatically (default)."
      description: >-
        The arrive and leave tangents follow the neighbouring keys.
      type: "tangent mode"
      examples:
        - title: Automatic tangents
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Smooth
                keys:
                  - time: 0
                    value: 0
                    interpMode: cubic
                    tangentMode: auto
      docs: "features/curves#key-and-curve-fields"
    smartAuto:
      summary: "Automatic tangents that avoid overshooting."
      description: >-
        Like `auto`, but keeps the curve from overshooting between keys.
      type: "tangent mode"
      examples:
        - title: Smart automatic tangents
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Smooth
                keys:
                  - time: 0
                    value: 0
                    interpMode: cubic
                    tangentMode: smartAuto
      docs: "features/curves#key-and-curve-fields"
    user:
      summary: "Tangents come from `arriveTangent` and `leaveTangent`."
      description: >-
        You give the tangent values; they are not recomputed from the neighbours.
      type: "tangent mode"
      examples:
        - title: User tangents
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Smooth
                keys:
                  - time: 0
                    value: 0
                    interpMode: cubic
                    tangentMode: user
                    arriveTangent: 0
                    leaveTangent: 1
      docs: "features/curves#key-and-curve-fields"
    break:
      summary: "Arrive and leave tangents are independent."
      description: >-
        Allows a sharp corner at the key: `arriveTangent` and `leaveTangent` need not match.
      type: "tangent mode"
      examples:
        - title: Broken tangents
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Corner
                keys:
                  - time: 0
                    value: 0
                    interpMode: cubic
                    tangentMode: break
                    arriveTangent: 0
                    leaveTangent: 2
      docs: "features/curves#key-and-curve-fields"

  tangentWeightMode:
    none:
      summary: "Tangents carry no weight (default)."
      description: >-
        `arriveTangentWeight` and `leaveTangentWeight` are not used.
      type: "tangent weight mode"
      examples:
        - title: Unweighted
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Smooth
                keys:
                  - time: 0
                    value: 0
                    interpMode: cubic
                    tangentWeightMode: none
      docs: "features/curves#key-and-curve-fields"
    arrive:
      summary: "Only the arrive tangent is weighted."
      description: >-
        Uses `arriveTangentWeight`.
      type: "tangent weight mode"
      examples:
        - title: Weighted arrive tangent
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Smooth
                keys:
                  - time: 0
                    value: 0
                    interpMode: cubic
                    tangentWeightMode: arrive
                    arriveTangentWeight: 0.3
      docs: "features/curves#key-and-curve-fields"
    leave:
      summary: "Only the leave tangent is weighted."
      description: >-
        Uses `leaveTangentWeight`.
      type: "tangent weight mode"
      examples:
        - title: Weighted leave tangent
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Smooth
                keys:
                  - time: 0
                    value: 0
                    interpMode: cubic
                    tangentWeightMode: leave
                    leaveTangentWeight: 0.3
      docs: "features/curves#key-and-curve-fields"
    both:
      summary: "Both tangents are weighted."
      description: >-
        Uses `arriveTangentWeight` and `leaveTangentWeight`.
      type: "tangent weight mode"
      examples:
        - title: Both weighted
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Smooth
                keys:
                  - time: 0
                    value: 0
                    interpMode: cubic
                    tangentWeightMode: both
                    arriveTangentWeight: 0.3
                    leaveTangentWeight: 0.3
      docs: "features/curves#key-and-curve-fields"

  extrapolation:
    none:
      summary: "No extrapolation outside the keys."
      description: >-
        Outside the first or last key the curve does not continue.
      type: "extrapolation"
      examples:
        - title: No extrapolation after the last key
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Ramp
                postInfinityExtrap: none
                keys:
                  - time: 0
                    value: 0
      docs: "features/curves#key-and-curve-fields"
    constant:
      summary: "Holds the value of the nearest key."
      description: >-
        Before the first key the first value is used, after the last key the last value.
      type: "extrapolation"
      examples:
        - title: Hold the last value
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Ramp
                postInfinityExtrap: constant
                keys:
                  - time: 0
                    value: 0
      docs: "features/curves#key-and-curve-fields"
    linear:
      summary: "Continues along the slope of the end segment."
      description: >-
        The curve is extended in a straight line.
      type: "extrapolation"
      examples:
        - title: Continue linearly
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Ramp
                postInfinityExtrap: linear
                keys:
                  - time: 0
                    value: 0
      docs: "features/curves#key-and-curve-fields"
    cycle:
      summary: "Repeats the curve."
      description: >-
        The key range loops over and over.
      type: "extrapolation"
      examples:
        - title: Loop the curve
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Wave
                postInfinityExtrap: cycle
                keys:
                  - time: 0
                    value: 0
      docs: "features/curves#key-and-curve-fields"
    cycleWithOffset:
      summary: "Repeats the curve and adds the value change of each cycle."
      description: >-
        Every repetition starts where the previous one ended.
      type: "extrapolation"
      examples:
        - title: Staircase
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Stairs
                postInfinityExtrap: cycleWithOffset
                keys:
                  - time: 0
                    value: 0
      docs: "features/curves#key-and-curve-fields"
    oscillate:
      summary: "Bounces back and forth over the key range."
      description: >-
        The curve is mirrored at its ends, repeatedly.
      type: "extrapolation"
      examples:
        - title: Ping-pong
          yaml: |
            type: curve
            curveType: float
            curves:
              - id: Pulse
                postInfinityExtrap: oscillate
                keys:
                  - time: 0
                    value: 0
      docs: "features/curves#key-and-curve-fields"

  nodeType:
    Node:
      summary: "Ordinary resource node (default for scanner entries)."
      description: >-
        Accepted with or without the `EResourceNodeType::` prefix.
      type: "node type"
      examples:
        - title: Only plain nodes
          yaml: |
            type: resourcenode
            remove:
              - resource: MyGeneratedResource
                nodeTypes: [Node]
      docs: "features/resources#removing-resource-nodes-type-resourcenode"
    FrackingSatellite:
      summary: "Satellite node of a fracking cluster."
      description: >-
        Accepted with or without the `EResourceNodeType::` prefix.
      type: "node type"
      examples:
        - title: Fracking satellites
          yaml: |
            type: resourcenode
            remove:
              - resource: MyGeneratedResource
                nodeTypes: [FrackingSatellite]
      docs: "features/resources#removing-resource-nodes-type-resourcenode"
    FrackingCore:
      summary: "Core node of a fracking cluster."
      description: >-
        Accepted with or without the `EResourceNodeType::` prefix.
      type: "node type"
      examples:
        - title: Fracking cores
          yaml: |
            type: resourcenode
            remove:
              - resource: MyGeneratedResource
                nodeTypes: [FrackingCore]
      docs: "features/resources#removing-resource-nodes-type-resourcenode"
    Geyser:
      summary: "Geyser node."
      description: >-
        Accepted with or without the `EResourceNodeType::` prefix.
      type: "node type"
      examples:
        - title: Geysers
          yaml: |
            type: resourcenode
            remove:
              - resource: MyGeneratedResource
                nodeTypes: [Geyser]
      docs: "features/resources#removing-resource-nodes-type-resourcenode"
    Deposit:
      summary: "Deposit node."
      description: >-
        Accepted with or without the `EResourceNodeType::` prefix.
      type: "node type"
      examples:
        - title: Deposits
          yaml: |
            type: resourcenode
            remove:
              - resource: MyGeneratedResource
                nodeTypes: [Deposit]
      docs: "features/resources#removing-resource-nodes-type-resourcenode"

  # ---- pack configuration -------------------------------------------------------------------------------
  config.type:
    text:
      summary: "A text value, or a list of texts with `multiple`."
      description: >-
        `valueType` selects string (default), text (localizable), name or gameplay tag.
        `multiline`, `maxLength` and `tagRoot` apply.
      type: "field type"
      examples:
        - title: A text setting
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.title
                type: text
                name: Title
                description: A short single-line text.
                default: Hello
      docs: "features/pack-configuration#field-types-at-a-glance"
    number:
      summary: "A number, shown as a slider or an input."
      description: >-
        `valueType` selects the width or `float`/`double`. `min`, `max`, `step`, `decimals` and
        `display` apply; with `multiple` it is a list of numbers.
      type: "field type"
      examples:
        - title: A number setting
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.count
                type: number
                name: Count
                description: A whole number.
                default: 10
                min: 1
                max: 100
      docs: "features/pack-configuration#field-types-at-a-glance"
    boolean:
      summary: "A checkbox."
      description: >-
        `valueType` is `bool` (default) or `uint8`. `multiple` is not allowed.
      type: "field type"
      examples:
        - title: A checkbox
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.enabled
                type: boolean
                name: Enabled
                description: A checkbox.
                default: true
      docs: "features/pack-configuration#field-types-at-a-glance"
    select:
      summary: "One choice (or several with `multiple`) from `options`."
      description: >-
        `options` is required. `minSelected` and `maxSelected` bound a multi-select.
      type: "field type"
      examples:
        - title: A dropdown
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.difficulty
                type: select
                name: Difficulty
                description: Exactly one option.
                default: easy
                options:
                  - value: easy
                    label: Easy
                  - value: hard
                    label: Hard
      docs: "features/pack-configuration#field-types-at-a-glance"

  apply:
    hot:
      summary: "Changes apply within the session."
      description: >-
        The value is saved and KDataForge reloads so the content follows. Fits numbers and texts
        inside `properties:` of a patch. Feeding a cold context is reported as restart advised.
      type: "apply mode"
      examples:
        - title: A hot setting
          yaml: |
            type: config
            category: SampleBalanceCategory
            fields:
              - id: balance.ironSpeed
                type: number
                name: Iron smelting speed
                description: How many times faster the Iron Ingot recipe runs.
                default: 2
                apply: hot
      docs: "features/pack-configuration#hot-and-cold-values"
    cold:
      summary: "Changes need a game restart (default)."
      description: >-
        The value is saved, but the running game keeps the value it loaded with and reports that a
        restart is required. Use it for anything the game reads once: generated class ids,
        registrations, which documents exist.
      type: "apply mode"
      examples:
        - title: A cold setting
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: modules.enableBalance
                type: boolean
                name: Enable the balance module
                description: Turns the rebalancing documents of this pack on or off. Needs a restart.
                default: true
                apply: cold
      docs: "features/pack-configuration#hot-and-cold-values"

  display:
    slider:
      summary: "Shows the number as a slider."
      description: >-
        Needs `min` and `max` with `min < max`, and cannot be combined with `multiple`. It is the
        default when both bounds exist.
      type: "display mode"
      examples:
        - title: A slider
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.speed
                type: number
                valueType: float
                display: slider
                name: Speed
                description: A slider with a step.
                default: 1
                min: 0.25
                max: 4
                step: 0.25
      docs: "features/pack-configuration#numbers"
    input:
      summary: "Shows the number as a text input."
      description: >-
        The default for a number field that lacks one of the bounds.
      type: "display mode"
      examples:
        - title: A free input
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.ratio
                type: number
                valueType: double
                display: input
                name: Ratio
                description: A free decimal number.
                default: 0.125
      docs: "features/pack-configuration#numbers"

  valueType:
    string:
      summary: "A plain string (FString)."
      description: >-
        Default for `text` fields and for `select` fields.
      type: "value type"
      examples:
        - title: String setting
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.title
                type: text
                valueType: string
                name: Title
                description: A short single-line text.
                default: Hello
      docs: "features/pack-configuration#field-types-at-a-glance"
    text:
      summary: "A localizable text (FText)."
      description: >-
        The only value type that allows `multiline`. Keeps its localization when a template
        consists of this value alone.
      type: "value type"
      examples:
        - title: Multi-line text
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.motto
                type: text
                valueType: text
                multiline: true
                name: Motto
                description: A longer text that can span several lines.
                default: Forged from YAML.
      docs: "features/pack-configuration#text-tags-and-selections"
    name:
      summary: "An FName value."
      description: >-
        Names are compared case-sensitively like other text values.
      type: "value type"
      examples:
        - title: Name setting
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.internalName
                type: text
                valueType: name
                name: Internal name
                description: A name value.
                default: MyThing
      docs: "features/pack-configuration#field-types-at-a-glance"
    tag:
      summary: "A gameplay tag."
      description: >-
        With `tagRoot` only tags below that root are accepted. The tag does not need to be
        registered when the value is read.
      type: "value type"
      examples:
        - title: Tag setting
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.marker
                type: text
                valueType: tag
                tagRoot: KDF.Sample
                name: Marker tag
                description: Pick one tag below KDF.Sample.
                default: KDF.Sample.Test
      docs: "features/pack-configuration#text-tags-and-selections"
    int8:
      summary: "8-bit signed integer."
      description: >-
        Whole numbers only; `min`, `max` and `step` have to be whole numbers.
      type: "value type"
      examples:
        - title: Small integer
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.small
                type: number
                valueType: int8
                name: Small
                description: A small whole number.
                default: 5
      docs: "features/pack-configuration#numbers"
    int16:
      summary: "16-bit signed integer."
      description: >-
        Whole numbers only; `min`, `max` and `step` have to be whole numbers.
      type: "value type"
      examples:
        - title: 16-bit integer
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.medium
                type: number
                valueType: int16
                name: Medium
                description: A medium whole number.
                default: 500
      docs: "features/pack-configuration#numbers"
    int32:
      summary: "32-bit signed integer (default for numbers)."
      description: >-
        Whole numbers only; `min`, `max` and `step` have to be whole numbers. A number field
        without `valueType` is an `int32`.
      type: "value type"
      examples:
        - title: Default integer
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.count
                type: number
                valueType: int32
                name: Count
                description: A whole number.
                default: 10
      docs: "features/pack-configuration#numbers"
    int64:
      summary: "64-bit signed integer."
      description: >-
        Whole numbers only; `min`, `max` and `step` have to be whole numbers.
      type: "value type"
      examples:
        - title: 64-bit integer
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.large
                type: number
                valueType: int64
                name: Large
                description: A large whole number.
                default: 100000
      docs: "features/pack-configuration#numbers"
    uint8:
      summary: "Unsigned 8-bit integer; also allowed for `boolean` fields."
      description: >-
        For `number` fields it is a whole number. A `boolean` field may use it instead of
        `bool`.
      type: "value type"
      examples:
        - title: Unsigned byte
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.byte
                type: number
                valueType: uint8
                name: Byte
                description: A value from 0 to 255.
                default: 7
      docs: "features/pack-configuration#numbers"
    float:
      summary: "32-bit floating point number."
      description: >-
        Shown with `decimals` digits, or the digits of `step`, otherwise 4.
      type: "value type"
      examples:
        - title: Float setting
          yaml: |
            type: config
            category: SampleBalanceCategory
            fields:
              - id: balance.ironSpeed
                type: number
                valueType: float
                name: Iron smelting speed
                description: How many times faster the Iron Ingot recipe runs.
                default: 2
      docs: "features/pack-configuration#numbers"
    double:
      summary: "64-bit floating point number."
      description: >-
        Shown with `decimals` digits, or the digits of `step`, otherwise 6.
      type: "value type"
      examples:
        - title: Double setting
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.ratio
                type: number
                valueType: double
                name: Ratio
                description: A free decimal number.
                default: 0.125
      docs: "features/pack-configuration#numbers"
    bool:
      summary: "A boolean (default for `boolean` fields, also allowed for `select`)."
      description: >-
        Stored as true or false.
      type: "value type"
      examples:
        - title: Boolean setting
          yaml: |
            type: config
            category: SampleFeaturesCategory
            fields:
              - id: demo.enabled
                type: boolean
                valueType: bool
                name: Enabled
                description: A checkbox.
                default: true
      docs: "features/pack-configuration#field-types-at-a-glance"

prefixes:
  # ---- typed references: a whole, unquoted scalar --------------------------------------------------------
  "cfg:":
    summary: "Typed reference to a pack configuration field."
    description: >-
      `cfg:<id>` reads a field of the own pack, `cfg:<pack>:<id>` a field of another pack. As a
      whole unquoted scalar it is replaced by the typed value before the stages run: numbers and
      booleans unquoted, strings quoted, a `multiple` field as a list. A quoted `'cfg:...'` stays
      literal text; an unknown id leaves the scalar as written and logs a warning.
    type: "typed reference"
    examples:
      - title: Divide a crafting time by a setting
        yaml: |
          type: cdo
          patches:
            - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
              properties:
                - path: mManufactoringDuration
                  op: divide
                  value: cfg:balance.ironSpeed
      - title: Field of another pack
        yaml: |
          type: cdo
          patches:
            - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
              properties:
                - path: mManufactoringDuration
                  op: multiply
                  value: cfg:Other:shared.level
    docs: "features/templates#typed-references"
  "session:":
    summary: "Typed reference to a session setting."
    description: >-
      `session:<id>` reads an SML session setting, falling back to an advanced game setting of the
      same id. Session settings do not exist on the main menu, so a document that uses one is
      deferred until a save is loaded and applied again when the setting changes. The ids come from
      the settings index of a reflection export.
    type: "typed reference"
    examples:
      - title: A session setting as a value
        yaml: |
          type: cdo
          patches:
            - target: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
              properties:
                - path: mCanBeDiscarded
                  value: session:FG.Example
    docs: "features/templates#game-settings"
  "ags:":
    summary: "Typed reference to an advanced game setting."
    description: >-
      `ags:<id>` reads an advanced game setting. It does not exist on the main menu: a document
      that uses it is deferred until a save is loaded and applied again when the setting changes.
    type: "typed reference"
    examples:
      - title: An advanced game setting as a value
        yaml: |
          type: cdo
          patches:
            - target: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
              properties:
                - path: mCanBeDiscarded
                  value: ags:FG.GameRules.NoPower
    docs: "features/templates#game-settings"
  "option:":
    summary: "Typed reference to a local game option of the player."
    description: >-
      `option:<id>` reads a local game option. Unlike `session:` and `ags:` it exists at any time,
      including on the main menu.
    type: "typed reference"
    examples:
      - title: A local option as a value
        yaml: |
          type: cdo
          patches:
            - target: /Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C
              properties:
                - path: mCanBeDiscarded
                  value: option:FG.Example
    docs: "features/templates#game-settings"

  # ---- pre-pass templates ---------------------------------------------------------------------------------
  "{cfg:":
    summary: "Template that inserts a pack configuration value as text."
    description: >-
      `{cfg:<id>}` or `{cfg:<pack>:<id>}` inside any string of any document is replaced before the
      stages run. Lists are joined with `, `. Not replaced in the values of `id`, `type`,
      `include` and `ref`, in map keys, or inside `conditions:`. Quote any value that starts with
      `{`.
    type: "template provider (pre-pass)"
    examples:
      - title: Insert a setting into a description
        yaml: |
          type: item
          items:
            - id: SuperIngot
              properties:
                - path: mDescription
                  value: 'Smelts at {cfg:balance.ironSpeed}x speed.'
    docs: "features/templates#templates"
  "{session:":
    summary: "Template that inserts a session setting as text."
    description: >-
      `{session:<id>}` is replaced before the stages run. Session settings need a loaded world, so
      a document using one is deferred on the main menu.
    type: "template provider (pre-pass)"
    examples:
      - title: Insert a session setting
        yaml: |
          type: item
          items:
            - id: SuperIngot
              properties:
                - path: mDescription
                  value: 'Setting: {session:FG.Example}'
    docs: "features/templates#game-settings"
  "{ags:":
    summary: "Template that inserts an advanced game setting as text."
    description: >-
      `{ags:<id>}` is replaced before the stages run. Advanced game settings need a loaded world,
      so a document using one is deferred on the main menu.
    type: "template provider (pre-pass)"
    examples:
      - title: Insert an advanced game setting
        yaml: |
          type: item
          items:
            - id: SuperIngot
              properties:
                - path: mDescription
                  value: 'No power: {ags:FG.GameRules.NoPower}'
    docs: "features/templates#game-settings"
  "{option:":
    summary: "Template that inserts a local game option as text."
    description: >-
      `{option:<id>}` is replaced before the stages run. Local options exist at any time.
    type: "template provider (pre-pass)"
    examples:
      - title: Insert a local option
        yaml: |
          type: item
          items:
            - id: SuperIngot
              properties:
                - path: mDescription
                  value: 'Option: {option:FG.Example}'
    docs: "features/templates#game-settings"

  # ---- apply-time templates (operation value, min and max) ------------------------------------------------
  "{class:":
    summary: "Apply-time template that reads a property or calls a function of any class."
    description: >-
      `{class:<class>:<member>}` reads a property of the class default object or calls a safe
      native function, which makes function libraries usable
      (`{class:/Script/Engine.KismetMathLibrary:Round(2.6)}`). Works in `value`, `min` and `max`
      of an operation. A string that is exactly one token keeps the result's type.
    type: "template provider (apply time)"
    examples:
      - title: Round a setting
        yaml: |
          type: cdo
          patches:
            - target: /Game/FactoryGame/Recipes/Constructor/Recipe_IronPlate.Recipe_IronPlate_C
              properties:
                - path: mProduct[0].Amount
                  value: '{class:/Script/Engine.KismetMathLibrary:Round({cfg:balance.ironSpeed})}'
    docs: "features/templates#providers"
  "{item:":
    summary: "Apply-time template that reads a property or function of an item descriptor."
    description: >-
      `{item:<class>:<member>}` such as `GetItemName` or `mStackSize`. The class has to derive from
      `UFGItemDescriptor`, otherwise the token is an error. Works in `value`, `min` and `max` of an
      operation.
    type: "template provider (apply time)"
    examples:
      - title: Use the name of the Iron Ingot in a text
        yaml: |
          type: item
          items:
            - id: SuperIngot
              properties:
                - path: mDescription
                  value: 'Smelts like {item:/Game/FactoryGame/Resource/Parts/IronIngot/Desc_IronIngot.Desc_IronIngot_C:GetItemName}.'
    docs: "features/templates#providers"
  "{resource:":
    summary: "Apply-time template that reads a property or function of a resource descriptor."
    description: >-
      `{resource:<class>:<member>}`. The class has to derive from `UFGResourceDescriptor`. Works in
      `value`, `min` and `max` of an operation.
    type: "template provider (apply time)"
    examples:
      - title: Name of Iron Ore in a text
        yaml: |
          type: item
          items:
            - id: SuperIngot
              properties:
                - path: mDescription
                  value: 'Made from {resource:/Game/FactoryGame/Resource/RawResources/OreIron/Desc_OreIron.Desc_OreIron_C:GetItemName}.'
    docs: "features/templates#providers"
  "{building:":
    summary: "Apply-time template that reads a property or function of a buildable class."
    description: >-
      `{building:<class>:<member>}`. The class has to derive from `AFGBuildable`. Works in `value`,
      `min` and `max` of an operation. Non-static members of actors are not callable; read
      properties instead.
    type: "template provider (apply time)"
    examples:
      - title: Copy the power use of the Smelter
        yaml: |
          type: cdo
          patches:
            - target: /Game/FactoryGame/Buildable/Factory/ConstructorMk1/Build_ConstructorMk1.Build_ConstructorMk1_C
              properties:
                - path: mPowerConsumption
                  value: '{building:/Game/FactoryGame/Buildable/Factory/SmelterMk1/Build_SmelterMk1.Build_SmelterMk1_C:mPowerConsumption}'
    docs: "features/templates#providers"
  "{recipe:":
    summary: "Apply-time template that reads a property or function of a recipe."
    description: >-
      `{recipe:<class>:<member>}`. The class has to derive from `UFGRecipe`. Works in `value`,
      `min` and `max` of an operation; a whole-token value keeps its type.
    type: "template provider (apply time)"
    examples:
      - title: Take as long as the Iron Ingot recipe
        yaml: |
          type: cdo
          patches:
            - target: /Game/FactoryGame/Recipes/Constructor/Recipe_IronPlate.Recipe_IronPlate_C
              properties:
                - path: mManufactoringDuration
                  value: '{recipe:/Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C:mManufactoringDuration}'
    docs: "features/templates#whole-token-typed-values"
  "{schematic:":
    summary: "Apply-time template that reads a property or function of a schematic."
    description: >-
      `{schematic:<class>:<member>}` such as `GetTechTier`. The class has to derive from
      `UFGSchematic`. Works in `value`, `min` and `max` of an operation.
    type: "template provider (apply time)"
    examples:
      - title: Reuse the tech tier of a milestone
        yaml: |
          type: cdo
          patches:
            - target: /Game/FactoryGame/Schematics/Progression/Schematic_2-1.Schematic_2-1_C
              properties:
                - path: mMenuPriority
                  value: '{schematic:/Game/FactoryGame/Schematics/Progression/Schematic_1-1.Schematic_1-1_C:GetTechTier}'
    docs: "features/templates#providers"
  "{research:":
    summary: "Apply-time template that reads a property or function of a research tree."
    description: >-
      `{research:<class>:<member>}` such as `GetDisplayName`. The class has to derive from
      `UFGResearchTree`. Works in `value`, `min` and `max` of an operation.
    type: "template provider (apply time)"
    examples:
      - title: Show the name of another tree
        yaml: |
          type: item
          items:
            - id: SuperIngot
              properties:
                - path: mDescription
                  value: 'See {research:/Game/FactoryGame/Schematics/Research/BPD_ResearchTree_Mycelia.BPD_ResearchTree_Mycelia_C:GetDisplayName}.'
    docs: "features/templates#providers"
  "{category:":
    summary: "Apply-time template that reads a property or function of a category class."
    description: >-
      `{category:<class>:<member>}`. The class has to derive from `UFGCategory`; a bare id of a
      category generated in the same pack works. Works in `value`, `min` and `max` of an operation.
    type: "template provider (apply time)"
    examples:
      - title: Reuse a category name
        yaml: |
          type: item
          items:
            - id: SuperIngot
              properties:
                - path: mDescription
                  value: 'Category: {category:SampleBalanceCategory:mDisplayName}'
    docs: "features/templates#providers"
  "{dataasset:":
    summary: "Apply-time template that reads a property or function of a data asset instance."
    description: >-
      `{dataasset:<asset>:<member>}`. The target is an asset path or the id of a KDataForge
      `dataasset`, and it has to be a `UDataAsset`. Static functions with one input that accepts the
      object get the object implicitly. Works in `value`, `min` and `max` of an operation.
    type: "template provider (apply time)"
    examples:
      - title: Copy a time from a generated data asset
        yaml: |
          type: cdo
          patches:
            - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
              properties:
                - path: mManufactoringDuration
                  value: '{dataasset:CleanerItem_SuperIngot:mProductionTime}'
    docs: "features/templates#providers"
  "{asset:":
    summary: "Apply-time template that reads a property or function of any asset by path."
    description: >-
      `{asset:<path>:<member>}` for an asset that is not a data asset or has no more specific
      provider. Works in `value`, `min` and `max` of an operation.
    type: "template provider (apply time)"
    examples:
      - title: Read a property of an asset
        yaml: |
          type: cdo
          patches:
            - target: /Game/FactoryGame/Recipes/Smelter/Recipe_IngotIron.Recipe_IngotIron_C
              properties:
                - path: mManufactoringDuration
                  value: '{asset:/Game/Path/To/Asset.Asset:SomeProperty}'
    docs: "features/templates#providers"
  "\\{":
    summary: "Escape that keeps a template token as literal text."
    description: >-
      A backslash directly before `{` and a registered prefix leaves the token as text. Each phase
      removes only its own escapes. In a double-quoted YAML string write `\\{`; single-quoted,
      plain and block scalars take `\{` as written.
    type: "escape"
    examples:
      - title: Show a token instead of resolving it
        yaml: |
          type: item
          items:
            - id: EscapeDemo
              properties:
                - path: mDescription
                  value: 'Use \{cfg:balance.ironSpeed} to read the speed.'
    docs: "features/templates#escaping"
