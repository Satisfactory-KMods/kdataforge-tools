$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/sound.schema.yml
x-kdf-type: sound
title: KDataForge Wwise sounds
description: Import pack-relative PCM16 WAV/FLAC files as Wwise audio events, including ADA voice-over. Finite 2D sounds, mono/stereo, 8000-192000 Hz, maximum 64 MiB encoded and decoded.
allOf:
  - $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/documentBase
  - type: object
    required: [sounds]
    properties:
      type: { const: sound }
      sounds:
        type: array
        minItems: 1
        description: Generated UAkAudioEvent assets. Reference by ID in the same pack or /KDataForge/GenAssets/<PackRef>.Gen_<PackRef>_<Id> across packs.
        items:
          type: object
          additionalProperties: false
          required: [id, file]
          properties:
            id:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/token
              description: Stable generated audio event ID; shares the asset namespace with images, curves and data assets.
            file:
              type: string
              minLength: 1
              pattern: '\.([Ww][Aa][Vv]|[Ff][Ll][Aa][Cc])$'
              description: Path relative to pack root. PCM16 mono/stereo WAV or native FLAC, 8000-192000 Hz, at most 64 MiB encoded and decoded. FLAC requires a known nonzero frame count. Ogg FLAC and 24-bit FLAC are unsupported. Path and symbolic links must stay inside pack. MP3, OGG, float WAV, loops and spatial attenuation are unsupported.
            name:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/nonEmptyString
              pattern: '\S'
              description: Optional display name for the local Audio settings entry. Runtime falls back to `<id> volume`.
            description:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/nonEmptyString
              pattern: '\S'
              description: Optional display description for the local Audio settings entry.
            category:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/nonEmptyString
              pattern: '\S'
              description: Optional Audio section category. FactoryGame exposes Audio plus one subcategory level, so runtime flattens this with subCategory.
            subCategory:
              $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/nonEmptyString
              pattern: '\S'
              description: Optional Audio section subcategory. FactoryGame exposes Audio plus one subcategory level, so runtime flattens this with category.
unevaluatedProperties: false
