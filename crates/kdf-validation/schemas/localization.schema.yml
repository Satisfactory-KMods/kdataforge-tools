$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/localization.schema.yml
x-kdf-type: localization
title: KDataForge localization
allOf:
  - $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/documentBase
  - type: object
    required: [namespace, entries]
    properties:
      type: { const: localization }
      namespace:
        $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/nonEmptyString
      culture:
        $ref: https://raw.githubusercontent.com/Satisfactory-KMods/KDataForge-Linter/main/src/kdataforge_linter/schemas/common.schema.yml#/$defs/nonEmptyString
      entries:
        type: object
        minProperties: 1
        additionalProperties:
          oneOf:
            - type: string
            - type: object
              additionalProperties: false
              required: [text]
              properties:
                source: { type: string }
                text: { type: string, minLength: 1 }
unevaluatedProperties: false
